<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RAINBOW RELAY</title>
<style>
  html,body{margin:0;height:100%;background:#07060f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font:14px/1.4 system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .pane{pointer-events:auto;background:#0d0b1ce6;border:2px solid #ffffff22;border-radius:14px;
    padding:26px 30px;text-align:center;min-width:260px;box-shadow:0 20px 60px #000a}
  .hide{display:none}
  h1{margin:0 0 4px;font-size:30px;letter-spacing:3px}
  h1 span{background:linear-gradient(90deg,#ff3b30,#ff9d00,#ffe100,#2ee65a,#2196ff,#5b5bff,#c44bff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h2{margin:0 0 10px;font-size:20px;letter-spacing:2px}
  p{margin:0 0 18px;color:#9a97b8;font-size:12px}
  button{display:block;width:100%;margin:7px 0;padding:11px 14px;font:600 13px system-ui,sans-serif;
    letter-spacing:1px;color:#fff;background:#1b1833;border:1px solid #ffffff26;border-radius:9px;cursor:pointer}
  button:hover{background:#2a2650;border-color:#ffffff55}
  .hint{color:#77749a;font-size:11px;margin-top:12px}
  #code{font:700 34px/1 ui-monospace,monospace;letter-spacing:9px;margin:6px 0 12px;color:#ffe100}
  #cin{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:10px;text-align:center;
    font:700 24px ui-monospace,monospace;letter-spacing:8px;text-transform:uppercase;
    background:#000;color:#fff;border:1px solid #ffffff33;border-radius:9px}
  #plist div{font-size:12px;padding:3px 0}
</style>
<canvas id=c></canvas>
<div id=ui>
  <div id=menu class=pane>
    <h1>RAINBOW <span>RELAY</span></h1>
    <p>paint the loop. ride your own color.</p>
    <button data-a=solo1>SOLO &mdash; 1 AI</button>
    <button data-a=solo2>SOLO &mdash; 2 AI</button>
    <button data-a=host>HOST ONLINE</button>
    <button data-a=join>JOIN ONLINE</button>
    <div class=hint>A / D or &larr; &rarr; to steer<br>tap left / right half on mobile</div>
  </div>
  <div id=lobby class="pane hide">
    <h2 id=lt>ROOM</h2>
    <div id=code>----</div>
    <input id=cin maxlength=4 placeholder="CODE" class=hide autocomplete=off>
    <div id=plist></div>
    <button id=go>START RACE</button>
    <button id=back>BACK</button>
    <div id=nstat class=hint></div>
  </div>
  <div id=over class="pane hide">
    <h2 id=wtxt>WINNER</h2>
    <div id=wsub class=hint></div>
    <button data-a=again>RACE AGAIN</button>
    <button data-a=menu>MENU</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   RAINBOW RELAY -- js13k 2026 sandbox prototype
   top-down looping unicorn racer. paint the track, ride your own color.
   offline first: online is a thin optional layer over the js13k relay.
   ===================================================================== */

const c = document.getElementById('c'), X = c.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * DPR | 0; c.height = H * DPR | 0;
  X.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const COL = ['#ff3b30','#ff9d00','#ffe100','#2ee65a','#2196ff','#5b5bff','#c44bff'];
const DIM = ['#5c1a17','#5c3a00','#5c5200','#0f4a1e','#0b2e5c','#22225c','#451a5c'];
const CNAME = ['RED','ORANGE','YELLOW','GREEN','BLUE','INDIGO','VIOLET'];
// complementary pairs across the 7: R-B, O-I, Y-V, green is neutral
function comp(i){ return i < 3 ? i + 4 : i > 3 ? i - 4 : -1 }

/* ---------------- track ---------------------------------------------- */
const N = 256, HW = 58, LAPS = 3;
let pts = [], eL = [], eR = [], sL = [], sR = [], paint = new Int8Array(N), seed = 1;
const FENCE = HW * 2.2;   // how far into the grass you can stray before the loop pulls you back
let bounds = [0,0,0,0];

function rng(s){
  return function(){
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function cr(p0, p1, p2, p3, t){
  const t2 = t * t, t3 = t2 * t, o = [0,0];
  for (let d = 0; d < 2; d++)
    o[d] = .5 * (2*p1[d] + (-p0[d]+p2[d])*t + (2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2 + (-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3);
  return o;
}
function buildTrack(sd){
  seed = sd;
  const r = rng(sd), K = 8 + (r() * 4 | 0), cp = [];
  for (let i = 0; i < K; i++){
    const ang = i / K * TAU + (r() - .5) * .3, rad = 520 + r() * 430;
    cp.push([Math.cos(ang) * rad, Math.sin(ang) * rad * (.78 + r() * .3)]);
  }
  const fine = [];
  for (let i = 0; i < K; i++){
    const p0 = cp[(i+K-1)%K], p1 = cp[i], p2 = cp[(i+1)%K], p3 = cp[(i+2)%K];
    for (let s = 0; s < 32; s++) fine.push(cr(p0, p1, p2, p3, s / 32));
  }
  // resample by arc length so every segment is the same length
  const M = fine.length, acc = [0];
  let total = 0;
  for (let i = 1; i <= M; i++){
    const a = fine[i-1], b = fine[i % M];
    total += Math.hypot(b[0] - a[0], b[1] - a[1]);
    acc.push(total);
  }
  pts = []; let j = 0;
  for (let i = 0; i < N; i++){
    const d = total * i / N;
    while (acc[j+1] < d) j++;
    const f = (d - acc[j]) / (acc[j+1] - acc[j] || 1), a = fine[j], b = fine[(j+1) % M];
    pts.push([a[0] + (b[0]-a[0]) * f, a[1] + (b[1]-a[1]) * f]);
  }
  eL = []; eR = []; sL = []; sR = [];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < N; i++){
    const a = pts[(i+N-1)%N], b = pts[(i+1)%N];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const p = pts[i];
    eL.push([p[0] - ty * HW, p[1] + tx * HW]);
    eR.push([p[0] + ty * HW, p[1] - tx * HW]);
    sL.push([p[0] - ty * FENCE, p[1] + tx * FENCE]);
    sR.push([p[0] + ty * FENCE, p[1] - tx * FENCE]);
    x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]);
    y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
  }
  bounds = [x0 - HW, y0 - HW, x1 + HW, y1 + HW];
  paint.fill(-1);
}
function segDir(i){
  const a = pts[i], b = pts[(i+1)%N];
  const dx = b[0]-a[0], dy = b[1]-a[1], m = Math.hypot(dx, dy) || 1;
  return [dx/m, dy/m];
}

/* ---------------- riders --------------------------------------------- */
let riders = [], me = null, sparks = [];

function mkRider(ci, kind, id){
  const d = segDir(0), lane = riders.length;
  const off = (lane - 1.5) * 26;
  const p = pts[0];
  return {
    id: id || ('r' + lane), ci: ci, ai: kind === 'ai', net: kind === 'net',
    x: p[0] - d[1] * off, y: p[1] + d[0] * off,
    a: Math.atan2(d[1], d[0]), vx: 0, vy: 0,
    seg: 0, prev: 0, prog: 0, lap: 0, dist: 0, fin: 0, time: 0,
    fx: 0, sx: 0, ph: Math.random() * 9, wob: 0,
    tx: 0, ty: 0, ta: 0, lastSeg: -1
  };
}

/* ---------------- input ---------------------------------------------- */
const keys = {};
onkeydown = e => {
  keys[e.key.toLowerCase()] = 1;
  if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.preventDefault();
  if (e.key.toLowerCase() === 'r' && st === 2) again();
};
onkeyup = e => keys[e.key.toLowerCase()] = 0;
let tSteer = 0;
c.addEventListener('pointerdown', e => { tSteer = e.clientX < W / 2 ? -1 : 1; });
c.addEventListener('pointermove', e => { if (tSteer) tSteer = e.clientX < W / 2 ? -1 : 1; });
c.addEventListener('pointerup', () => tSteer = 0);
c.addEventListener('pointercancel', () => tSteer = 0);
function steerIn(){
  let s = 0;
  if (keys.a || keys.arrowleft) s -= 1;
  if (keys.d || keys.arrowright) s += 1;
  return s || tSteer;
}

/* ---------------- simulation ----------------------------------------- */
const BASE = 235;
let st = 0, cd = 0, clock = 0, best = +(localStorage.getItem('rainbow-relay-best') || 0);

function locate(r){
  let bi = r.seg, bd = 1e9, nx = r.x, ny = r.y;
  for (let k = -8; k <= 16; k++){
    const i = (r.seg + k + N * 2) % N, a = pts[i], b = pts[(i+1)%N];
    const dx = b[0]-a[0], dy = b[1]-a[1], L = dx*dx + dy*dy;
    let t = ((r.x-a[0])*dx + (r.y-a[1])*dy) / L;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = a[0]+dx*t, py = a[1]+dy*t, d = (r.x-px)*(r.x-px) + (r.y-py)*(r.y-py);
    if (d < bd){ bd = d; bi = i; nx = px; ny = py; }
  }
  r.seg = bi; r.dist = Math.sqrt(bd);
  // soft fence: you can cut into the grass, but you can never lose the loop
  if (r.dist > FENCE){
    const f = FENCE / r.dist;
    r.x = nx + (r.x - nx) * f; r.y = ny + (r.y - ny) * f; r.dist = FENCE;
  }
  let dl = r.seg - r.prev;
  if (dl > N/2) dl -= N;
  if (dl < -N/2) dl += N;
  r.prog += dl; r.prev = r.seg;
  if (!r.fin && r.prog >= N * (r.lap + 1)){
    r.lap++;
    if (r.lap >= LAPS){ r.fin = 1; r.time = clock; finish(r); }
    else if (r === me){
      const lt = clock - (me.lapAt || 0);
      me.lapAt = clock;
      if (!best || lt < best){ best = lt; try { localStorage.setItem('rainbow-relay-best', best.toFixed(2)); } catch(e){} }
    }
  }
}
function applyPaint(r){
  if (r.dist > HW) return -2;
  const was = paint[r.seg];
  if (was !== r.ci){
    paint[r.seg] = r.ci;
    if (r.lastSeg !== r.seg && r === me) netSeg(r.seg, r.ci);
  }
  r.lastSeg = r.seg;
  return was;
}
function drive(r, dt, steer){
  const was = applyPaint(r);
  let mult = 1, grip = 9;
  if (was === -2){ mult = .55; grip = 5.5; }
  else if (was === r.ci){ mult = 1.42; r.fx = .3; }
  else if (was === comp(r.ci)){ mult = .66; grip = 2.1; r.sx = .3; }
  if (r.fin) mult = .5;
  const tgt = BASE * mult * (r.ai ? .955 : 1);
  let sp = Math.hypot(r.vx, r.vy);
  sp += (tgt - sp) * (1 - Math.exp(-(tgt > sp ? 3.4 : 2.4) * dt));
  r.a += steer * 2.55 * dt;
  const g = 1 - Math.exp(-grip * dt), m = Math.hypot(r.vx, r.vy) || 1;
  let nx = r.vx/m + (Math.cos(r.a) - r.vx/m) * g;
  let ny = r.vy/m + (Math.sin(r.a) - r.vy/m) * g;
  const nm = Math.hypot(nx, ny) || 1;
  r.vx = nx/nm * sp; r.vy = ny/nm * sp;
  r.x += r.vx * dt; r.y += r.vy * dt;
  if (r.fx > 0){
    r.fx -= dt;
    if (Math.random() < .6) sparks.push({ x: r.x, y: r.y, vx: -r.vx*.3 + (Math.random()-.5)*60,
      vy: -r.vy*.3 + (Math.random()-.5)*60, l: .5, c: COL[(Math.random()*7)|0] });
  }
  if (r.sx > 0) r.sx -= dt;
}
function aiSteer(r){
  const look = (r.seg + 9) % N, p = pts[look], d = segDir(look);
  const off = Math.sin(clock * .5 + r.ph) * 26;
  const tx = p[0] - d[1] * off, ty = p[1] + d[0] * off;
  let a = Math.atan2(ty - r.y, tx - r.x) - r.a;
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  const s = a * 2.3 + Math.sin(clock * 1.7 + r.ph) * .12;
  return s < -1 ? -1 : s > 1 ? 1 : s;
}
function update(dt){
  if (st !== 1) return;
  if (cd > 0){ cd -= dt; return; }
  clock += dt;
  for (const r of riders){
    if (r.net){
      const k = 1 - Math.exp(-9 * dt);
      r.x += (r.tx - r.x) * k; r.y += (r.ty - r.y) * k;
      let da = r.ta - r.a;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      r.a += da * k;
      locate(r); applyPaint(r);
    } else {
      drive(r, dt, r.ai ? aiSteer(r) : (r.fin ? aiSteer(r) : steerIn()));
      locate(r);
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.l -= dt;
    if (s.l <= 0) sparks.splice(i, 1);
  }
  netTick(dt);
}

/* ---------------- drawing -------------------------------------------- */
const cam = { x: 0, y: 0 };
function drawUni(r){
  X.save(); X.translate(r.x, r.y);
  const glow = r.fx > 0 ? 1 : 0;
  X.globalAlpha = .5;
  X.fillStyle = COL[r.ci];
  X.beginPath(); X.arc(0, 0, glow ? 20 : 14, 0, TAU); X.fill();
  X.globalAlpha = 1;
  X.rotate(r.a);
  if (r.sx > 0){
    X.strokeStyle = '#fff6'; X.lineWidth = 2;
    X.beginPath(); X.moveTo(-14, -7); X.lineTo(-24, -12); X.moveTo(-14, 7); X.lineTo(-24, 12); X.stroke();
  }
  // mane: 7 stripes down the neck
  for (let i = 0; i < 7; i++){
    X.strokeStyle = COL[i]; X.lineWidth = 2.4;
    X.beginPath(); X.moveTo(3 - i * 1.9, -3); X.lineTo(-1 - i * 1.9, -10); X.stroke();
  }
  // tail
  for (let i = 0; i < 7; i++){
    X.strokeStyle = COL[i]; X.lineWidth = 1.8;
    X.beginPath(); X.moveTo(-10, -3 + i); X.lineTo(-18 - Math.sin(clock * 12 + i) * 2, -5 + i * 1.6); X.stroke();
  }
  // body
  X.fillStyle = '#fdfbff';
  X.beginPath(); X.ellipse(0, 0, 11, 6, 0, 0, TAU); X.fill();
  X.fillStyle = COL[r.ci];
  X.beginPath(); X.ellipse(-3, 0, 6, 5, 0, 0, TAU); X.fill();
  // horn
  X.fillStyle = '#ffe9a8';
  X.beginPath(); X.moveTo(9, -2.5); X.lineTo(20, 0); X.lineTo(9, 2.5); X.closePath(); X.fill();
  X.restore();
}
function draw(){
  X.fillStyle = '#07060f'; X.fillRect(0, 0, W, H);
  if (st === 0){ return; }
  const cx = W / 2, cy = H / 2, Z = Math.max(1, Math.min(W, H) / 620);
  X.save(); X.translate(cx, cy); X.scale(Z, Z); X.translate(-cam.x, -cam.y);
  const hx = cx / Z + 90, hy = cy / Z + 90;
  const vx0 = cam.x - hx, vy0 = cam.y - hy, vx1 = cam.x + hx, vy1 = cam.y + hy;
  // grass shoulder: shows where the loop is even when you have wandered off it
  X.fillStyle = '#12101f';
  for (let i = 0; i < N; i++){
    const j = (i + 1) % N, p = pts[i];
    if (p[0] < vx0 || p[0] > vx1 || p[1] < vy0 || p[1] > vy1) continue;
    X.beginPath();
    X.moveTo(sL[i][0], sL[i][1]); X.lineTo(sR[i][0], sR[i][1]);
    X.lineTo(sR[j][0], sR[j][1]); X.lineTo(sL[j][0], sL[j][1]);
    X.closePath(); X.fill();
  }
  // track ribbon
  for (let i = 0; i < N; i++){
    const j = (i + 1) % N, p = pts[i];
    if (p[0] < vx0 || p[0] > vx1 || p[1] < vy0 || p[1] > vy1) continue;
    const pc = paint[i];
    X.fillStyle = pc < 0 ? '#282546' : DIM[pc];
    X.beginPath();
    X.moveTo(eL[i][0], eL[i][1]); X.lineTo(eR[i][0], eR[i][1]);
    X.lineTo(eR[j][0], eR[j][1]); X.lineTo(eL[j][0], eL[j][1]);
    X.closePath(); X.fill();
    if (pc >= 0){
      X.globalAlpha = .55; X.fillStyle = COL[pc]; X.fill(); X.globalAlpha = 1;
    }
    if (i === 0){
      X.strokeStyle = '#fff'; X.lineWidth = 4;
      X.beginPath(); X.moveTo(eL[i][0], eL[i][1]); X.lineTo(eR[i][0], eR[i][1]); X.stroke();
    }
  }
  // edges
  X.strokeStyle = '#544f85'; X.lineWidth = 3;
  for (const E of [eL, eR]){
    X.beginPath();
    for (let i = 0; i <= N; i++){
      const p = E[i % N];
      i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1]);
    }
    X.stroke();
  }
  for (const s of sparks){
    X.globalAlpha = Math.max(0, s.l * 2); X.fillStyle = s.c;
    X.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
  }
  X.globalAlpha = 1;
  for (const r of riders) drawUni(r);
  X.restore();
  hud();
}
function hud(){
  const order = riders.slice().sort((a, b) => b.prog - a.prog);
  X.font = '600 15px system-ui,sans-serif'; X.textAlign = 'left';
  X.fillStyle = '#fff';
  X.fillText('LAP ' + Math.min(me.lap + 1, LAPS) + '/' + LAPS, 16, 28);
  X.fillText('P' + (order.indexOf(me) + 1) + '/' + riders.length, 16, 50);
  X.fillStyle = '#9a97b8'; X.font = '13px ui-monospace,monospace';
  X.fillText(clock.toFixed(2) + 's', 16, 72);
  if (best) X.fillText('best lap ' + (+best).toFixed(2) + 's', 16, 90);
  X.fillStyle = COL[me.ci]; X.font = '600 12px system-ui,sans-serif';
  X.fillText(CNAME[me.ci], 16, 110);
  if (st !== 1){ }
  else if (me.fx > 0){ X.fillStyle = '#fff'; X.font = '700 22px system-ui,sans-serif'; X.textAlign = 'center'; X.fillText('BOOST', W/2, H - 40); }
  else if (me.sx > 0){ X.fillStyle = '#ff5a5a'; X.font = '700 22px system-ui,sans-serif'; X.textAlign = 'center'; X.fillText('SLIP!', W/2, H - 40); }
  if (cd > 0){
    X.textAlign = 'center'; X.fillStyle = '#fff'; X.font = '700 72px system-ui,sans-serif';
    X.fillText(cd > 1 ? '' + Math.ceil(cd) : 'GO!', W/2, H/2 - 40);
  }
  // minimap
  const S = 120, mx = W - S - 16, my = 16;
  const bw = bounds[2]-bounds[0], bh = bounds[3]-bounds[1], sc = S / Math.max(bw, bh);
  const px = x => mx + (x - bounds[0]) * sc + (S - bw*sc)/2;
  const py = y => my + (y - bounds[1]) * sc + (S - bh*sc)/2;
  X.fillStyle = '#0d0b1ccc'; X.fillRect(mx - 6, my - 6, S + 12, S + 12);
  X.lineWidth = 4;
  for (let i = 0; i < N; i++){
    const j = (i+1)%N;
    X.strokeStyle = paint[i] < 0 ? '#2a2840' : COL[paint[i]];
    X.beginPath(); X.moveTo(px(pts[i][0]), py(pts[i][1])); X.lineTo(px(pts[j][0]), py(pts[j][1])); X.stroke();
  }
  for (const r of riders){
    X.fillStyle = COL[r.ci];
    X.beginPath(); X.arc(px(r.x), py(r.y), r === me ? 4 : 3, 0, TAU); X.fill();
    if (r === me){ X.strokeStyle = '#fff'; X.lineWidth = 1.5; X.stroke(); }
  }
}

/* ---------------- flow ----------------------------------------------- */
const $ = i => document.getElementById(i);
function show(id){
  for (const p of ['menu','lobby','over']) $(p).classList.toggle('hide', p !== id);
  $('ui').style.display = id ? 'flex' : 'none';
}
function startRace(sd, list){
  buildTrack(sd);
  riders = []; sparks = []; clock = 0; cd = 3.2;
  for (const e of list){
    const r = mkRider(e.ci, e.kind, e.id);
    riders.push(r);
    if (e.kind === 'me') me = r;
  }
  for (const r of riders){ r.tx = r.x; r.ty = r.y; r.ta = r.a; }
  me.lapAt = 0;
  cam.x = me.x; cam.y = me.y;
  st = 1; show('');
}
function solo(nAi){
  // never green for the player: green has no complement, so it could never slip
  const mine = [0,1,2,4,5,6][(Math.random() * 6) | 0], used = [mine];
  const pick = [{ ci: mine, kind: 'me' }];
  // first rival paints your clashing color on purpose -- that is where slip comes from
  used.push(comp(mine));
  pick.push({ ci: comp(mine), kind: 'ai' });
  for (let i = 1; i < nAi; i++){
    let ci;
    do { ci = (Math.random() * 7) | 0; } while (used.indexOf(ci) >= 0);
    used.push(ci);
    pick.push({ ci: ci, kind: 'ai' });
  }
  startRace((Math.random() * 1e9) | 0, pick);
}
function finish(r){
  if (st !== 1) return;
  if (r === me || riders.every(q => q.fin)){
    st = 2;
    const order = riders.slice().sort((a, b) => (b.fin ? b.prog + 1e6 - b.time : b.prog) - (a.fin ? a.prog + 1e6 - a.time : a.prog));
    const pos = order.indexOf(me) + 1;
    $('wtxt').textContent = pos === 1 ? 'YOU WIN' : 'P' + pos + ' OF ' + riders.length;
    $('wtxt').style.color = COL[me.ci];
    $('wsub').textContent = me.fin ? me.time.toFixed(2) + 's' + (best ? ' · best lap ' + (+best).toFixed(2) + 's' : '') : 'race over';
    show('over');
  }
}
function again(){
  if (net.ws) { show('lobby'); return; }
  const list = riders.map(r => ({ ci: r.ci, kind: r === me ? 'me' : r.ai ? 'ai' : 'net', id: r.id }));
  startRace((Math.random() * 1e9) | 0, list);
}
document.addEventListener('click', e => {
  const a = e.target.getAttribute && e.target.getAttribute('data-a');
  if (!a) return;
  if (a === 'solo1') solo(1);
  if (a === 'solo2') solo(2);
  if (a === 'host') openLobby(1);
  if (a === 'join') openLobby(0);
  if (a === 'again') again();
  if (a === 'menu'){ netClose(); st = 0; show('menu'); }
});

/* ---------------- online (optional, fails silently) ------------------ */
// js13k 2026 Online category. The relay is a plain WebSocket broadcast:
//   wss://relay.js13kgames.com/<your-relay-slug>/<anything/you/want>
//   '@id' = your id, '+id' = someone joined, '-id' = someone left, anything else
//   is another client's message. Rooms are made on first connect and die empty.
// The real slug is handed out when the entry is registered; until then any string
// works. PartySocket is offered at play.js13kgames.com/2026/online/partysocket.js
// -- we don't need it, a raw WebSocket is smaller and works straight off file://.
const SLUG = 'rainbow-relay';
const net = { ws: null, id: '', host: 0, roster: [], acc: 0, room: '' };

function openLobby(host){
  net.host = host; net.roster = [];
  $('lt').textContent = host ? 'HOSTING' : 'JOIN ROOM';
  $('code').classList.toggle('hide', !host);
  $('cin').classList.toggle('hide', !!host);
  $('go').textContent = host ? 'START RACE' : 'CONNECT';
  $('plist').textContent = '';
  $('nstat').textContent = '';
  show('lobby');
  if (host){
    let code = '';
    for (let i = 0; i < 4; i++) code += 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[(Math.random()*32)|0];
    $('code').textContent = code;
    connect(code);
  }
}
$('back').onclick = () => { netClose(); show('menu'); };
$('go').onclick = () => {
  if (!net.host){
    const code = $('cin').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 4){ $('nstat').textContent = 'need a 4-character code'; return; }
    $('code').textContent = code; $('code').classList.remove('hide');
    connect(code);
    return;
  }
  if (!net.ws) return;
  const sd = (Math.random() * 1e9) | 0;
  send({ t: 'start', seed: sd, ids: net.roster });
  startRace(sd, net.roster.map((id, i) => ({ id: id, ci: i % 7, kind: id === net.id ? 'me' : 'net' })));
};
function connect(code){
  net.room = code;
  $('nstat').textContent = 'connecting…';
  let ws;
  try { ws = new WebSocket('wss://relay.js13kgames.com/' + SLUG + '/' + code); }
  catch (e){ return netFail(); }
  net.ws = ws;
  const guard = setTimeout(() => { if (!net.id) netFail(); }, 8000);
  ws.onopen = () => { $('nstat').textContent = 'connected'; };
  ws.onerror = () => {};
  ws.onclose = () => { clearTimeout(guard); if (net.ws === ws){ net.ws = null; if (st !== 1) netFail(); } };
  ws.onmessage = e => { clearTimeout(guard); onMsg('' + e.data); };
}
function netFail(){
  netClose();
  $('nstat').textContent = 'relay unreachable — playing solo';
  setTimeout(() => { if (st === 0 && !$('lobby').classList.contains('hide')) solo(1); }, 900);
}
function netClose(){
  const ws = net.ws; net.ws = null; net.id = ''; net.roster = [];
  if (ws) try { ws.onclose = null; ws.close(); } catch (e){}
}
function send(o){ if (net.ws && net.ws.readyState === 1) try { net.ws.send(JSON.stringify(o)); } catch (e){} }
function roomList(){
  $('plist').innerHTML = net.roster.map((id, i) =>
    '<div style="color:' + COL[i%7] + '">' + (id === net.id ? '▸ ' : '· ') + CNAME[i%7] + '</div>').join('');
}
function onMsg(d){
  const k = d[0];
  if (k === '@'){
    net.id = d.slice(1);
    if (net.host){ net.roster = [net.id]; roomList(); send({ t: 'r', ids: net.roster }); }
    else send({ t: 'j', id: net.id });
    return;
  }
  if (k === '-'){
    const id = d.slice(1);
    net.roster = net.roster.filter(x => x !== id);
    riders = riders.filter(r => r.id !== id);
    if (net.host) send({ t: 'r', ids: net.roster });
    roomList();
    return;
  }
  if (k === '+') return;
  let m;
  try { m = JSON.parse(d); } catch (e){ return }
  if (!m || !m.t) return;
  if (m.t === 'j' && net.host){
    if (net.roster.indexOf(m.id) < 0 && net.roster.length < 4) net.roster.push(m.id);
    roomList();
    send({ t: 'r', ids: net.roster });
  } else if (m.t === 'r' && !net.host){
    net.roster = m.ids; roomList();
    $('nstat').textContent = 'waiting for host…';
  } else if (m.t === 'start' && !net.host){
    net.roster = m.ids;
    startRace(m.seed, m.ids.map((id, i) => ({ id: id, ci: i % 7, kind: id === net.id ? 'me' : 'net' })));
  } else if (m.t === 'p'){
    const r = riders.find(q => q.id === m.id);
    if (r && r !== me){ r.tx = m.x; r.ty = m.y; r.ta = m.a; }
  } else if (m.t === 's'){
    if (m.seg >= 0 && m.seg < N) paint[m.seg] = m.c;
  }
}
function netSeg(seg, ci){ if (net.ws) send({ t: 's', seg: seg, c: ci }); }
function netTick(dt){
  if (!net.ws || !me) return;
  net.acc += dt;
  if (net.acc < 1/15) return;
  net.acc = 0;
  send({ t: 'p', id: net.id, x: Math.round(me.x), y: Math.round(me.y), a: +me.a.toFixed(2), c: me.ci });
}

/* ---------------- loop ------------------------------------------------ */
show('menu');
let last = 0;
requestAnimationFrame(function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  update(dt);
  if (st && me){
    const k = 1 - Math.exp(-6 * dt);
    cam.x += (me.x - cam.x) * k; cam.y += (me.y - cam.y) * k;
  }
  draw();
});
</script>
