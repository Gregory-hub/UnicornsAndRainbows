<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HERD — rainbow gates</title>
<style>
  html,body{margin:0;height:100%;background:#0a0714;overflow:hidden;touch-action:none;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
</style>
<canvas id=c></canvas>
<script>
'use strict';
const c=document.getElementById('c'), x=c.getContext('2d');

/* ---------------------------------------------------------------- helpers */
const PI=Math.PI, TAU=PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);

/* ---------------------------------------------------------------- palette */
const HUE =['#ff3d6e','#ff9b2f','#ffe14a','#4bf08a','#3ec8ff','#c07bff'];
const DIM =['#5c1428','#5c3610','#5c5015','#0f5230','#0c405a','#432560'];
const FLOOR='#150f26', FLOOR2='#1d1533', WALL='#3b2c5e', INK='#efe9ff';

/* shape glyph per colour, so colour is never the only channel */
function shapePath(px,py,r,i){
  x.beginPath();
  if(i===0){ x.arc(px,py,r,0,TAU); }
  else if(i===1){ x.rect(px-r*.84,py-r*.84,r*1.68,r*1.68); }
  else if(i===2){ x.moveTo(px,py-r*1.15); x.lineTo(px+r*1.05,py+r*.8); x.lineTo(px-r*1.05,py+r*.8); x.closePath(); }
  else if(i===3){ x.moveTo(px,py-r*1.2); x.lineTo(px+r*1.05,py); x.lineTo(px,py+r*1.2); x.lineTo(px-r*1.05,py); x.closePath(); }
  else if(i===4){ for(let k=0;k<10;k++){const a=-PI/2+k*PI/5, rr=k%2?r*.5:r*1.2;
      const ax=px+Math.cos(a)*rr, ay=py+Math.sin(a)*rr; k?x.lineTo(ax,ay):x.moveTo(ax,ay);} x.closePath(); }
  else { for(let k=0;k<6;k++){const a=k*PI/3+PI/6, rr=r*1.08;
      const ax=px+Math.cos(a)*rr, ay=py+Math.sin(a)*rr; k?x.lineTo(ax,ay):x.moveTo(ax,ay);} x.closePath(); }
}

/* ------------------------------------------------------------------ audio */
let AC=null, muted=false;
function actx(){ if(AC===null){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function snd(f1,f2,dur,type,vol,dly){
  const a=actx(); if(!a||muted) return;
  if(a.state==='suspended') a.resume();
  const t0=a.currentTime+(dly||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f1,t0);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(vol||.09,t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+dur+.03);
}
function noise(dur,vol,hi){
  const a=actx(); if(!a||muted) return;
  if(a.state==='suspended') a.resume();
  const n=Math.max(1,Math.floor(a.sampleRate*dur)), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(hi||2600,a.currentTime);
  f.frequency.exponentialRampToValueAtTime(180,a.currentTime+dur);
  const g=a.createGain(); g.gain.value=vol||.18;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5];
function sCollect(ci){ snd(SCALE[ci%6]*.5,SCALE[ci%6],.09,'triangle',.09); }
function sGate(L){ for(let i=0;i<L+2;i++) snd(392*Math.pow(2,i/4),392*Math.pow(2,(i+1)/4),.14,'triangle',.11,i*.045); }
function sDrop(){ snd(300,120,.12,'sawtooth',.06); }
function sDie(){ noise(.5,.25,1600); snd(220,55,.6,'sawtooth',.11); snd(110,40,.8,'square',.07,.05); }
function sWin(){ for(let i=0;i<10;i++) snd(392*Math.pow(2,i/6),392*Math.pow(2,(i+2)/6),.3,'triangle',.1,i*.09); }
function sBad(){ snd(160,80,.18,'square',.07); }

/* --------------------------------------------------------------- geometry */
const COLS=21, ROWS=15;
let W=0,H=0,DPR=1,cell=20,ox=0,oy=0,aw=0,ah=0,wt=4;
function layout(){
  cell=Math.max(9,Math.floor(Math.min(W/(COLS+4.6),(H-140)/(ROWS+4.6))));
  aw=cell*COLS; ah=cell*ROWS;
  ox=Math.round((W-aw)/2);
  oy=Math.round(58+(H-58-78-ah)/2);
  if(oy<cell*2.2) oy=Math.round(cell*2.2);
  wt=Math.max(3,Math.round(cell*.19));
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  c.width=Math.round(W*DPR); c.height=Math.round(H*DPR);
  c.style.width=W+'px'; c.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
addEventListener('resize',resize);
const cx=g=>ox+(g+.5)*cell, cy=g=>oy+(g+.5)*cell;

/* ------------------------------------------------------------------ state */
const WIN_GATES=20;
let mode='title';
let score=0,shown=0,cleared=0,combo=1,comboT=0,meter=1,rescued=0;
let snake=[],herd=[],units=[],gates=[],parts=[],rings=[],texts=[];
let dir={x:1,y:0},buf=[],acc=0,tick=.2,tp=0;
let shake=0,flash=0,flashCol='#fff',hitstop=0,T=0,deathMsg='',endT=0;
let mouseMode=false,aim=null,warnT=0;

let best=0;
try{ best=parseInt(localStorage.getItem('herd.best')||'0',10)||0; }catch(e){}
function saveBest(){ if(score>best){ best=score; try{ localStorage.setItem('herd.best',String(best)); }catch(e){} return true; } return false; }

function lvl(){
  const g=cleared;
  return {
    pal : 3+Math.min(2,Math.floor(g/6)),
    lmin: 1+Math.min(3,Math.floor(g/5)),
    lmax: 2+Math.min(3,Math.floor(g/4)),
    tick: Math.max(.10,.20-g*.005),
    drain: .028+g*.0024,
    units: 4+Math.min(3,Math.floor(g/6))
  };
}

/* ------------------------------------------------------------------ gates */
function gxy(g){
  if(g.side===0){ g.gx=g.pos; g.gy=-1;   g.nx=0;  g.ny=-1; }
  else if(g.side===1){ g.gx=COLS; g.gy=g.pos; g.nx=1; g.ny=0; }
  else if(g.side===2){ g.gx=g.pos; g.gy=ROWS; g.nx=0; g.ny=1; }
  else { g.gx=-1; g.gy=g.pos; g.nx=-1; g.ny=0; }
}
function mkGate(side){
  const cf=lvl();
  const along=(side%2===0)?COLS:ROWS;
  const pos=3+ri(Math.max(1,along-6));
  const L=cf.lmin+ri(Math.max(1,cf.lmax-cf.lmin+1));
  const seq=[];
  for(let i=0;i<L;i++){
    let ci=ri(cf.pal), guard=0;
    while(guard++<10 && i>0 && ci===seq[i-1] && Math.random()<.75) ci=ri(cf.pal);
    seq.push(ci);
  }
  const g={side,pos,seq,born:T,pulse:1};
  gxy(g); return g;
}
/* longest suffix of herd that is a prefix of seq */
function prog(g){
  const n=herd.length, L=g.seq.length, m=Math.min(n,L);
  for(let k=m;k>0;k--){
    let ok=true;
    for(let i=0;i<k;i++) if(herd[n-k+i]!==g.seq[i]){ ok=false; break; }
    if(ok) return k;
  }
  return 0;
}
const isOpen=g=>prog(g)===g.seq.length;
function maxProg(){ let m=0; for(const g of gates){ const p=prog(g); if(p>m) m=p; } return m; }
function needed(){
  const s=[];
  for(const g of gates){ const p=prog(g); if(p<g.seq.length) s.push(g.seq[p]); }
  return s;
}

/* -------------------------------------------------------------- particles */
function burst(px,py,col,n,spd,life){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, s=rnd(.25,1)*(spd||1)*150, l=rnd(.3,.75)*(life||1);
    parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:l,m:l,c:col,r:rnd(1.8,4.6)});
  }
}
function ring(px,py,mr,col,w,life){ rings.push({x:px,y:py,mr:mr,c:col,w:w||3,l:life||.45,m:life||.45}); }
function pop(px,py,t,col,size){ texts.push({x:px,y:py,t:t,c:col||INK,l:1,m:1,s:size||18}); }

/* ------------------------------------------------------------------ units */
function freeCell(minDist){
  for(let a=0;a<400;a++){
    const gx=ri(COLS), gy=ri(ROWS);
    let bad=false;
    for(const s of snake) if(s.x===gx&&s.y===gy){ bad=true; break; }
    if(!bad) for(const u of units) if(u.x===gx&&u.y===gy){ bad=true; break; }
    if(!bad && minDist){
      const h=snake[0];
      if(Math.abs(h.x-gx)+Math.abs(h.y-gy)<minDist) bad=true;
    }
    if(!bad) return {x:gx,y:gy};
  }
  return null;
}
function spawnUnit(forceCol){
  const p=freeCell(3); if(!p) return;
  const need=needed(), cf=lvl();
  let ci;
  if(forceCol!==undefined) ci=forceCol;
  else if(need.length && Math.random()<.72) ci=need[ri(need.length)];
  else ci=ri(cf.pal);
  units.push({x:p.x,y:p.y,c:ci,t:0,born:T});
}
function topUp(){ const n=lvl().units; let guard=0; while(units.length<n && guard++<12) spawnUnit(); }

/* ------------------------------------------------------------------ reset */
function reset(){
  score=0; shown=0; cleared=0; combo=1; comboT=0; meter=1; rescued=0;
  snake=[]; herd=[]; units=[]; gates=[]; parts=[]; rings=[]; texts=[];
  const hx=Math.floor(COLS/2), hy=Math.floor(ROWS/2);
  snake.push({x:hx,y:hy,px:hx,py:hy});
  dir={x:1,y:0}; buf=[]; acc=0; tp=0; tick=lvl().tick;
  for(let s=0;s<4;s++) gates.push(mkGate(s));
  topUp();
  shake=0; flash=0; hitstop=0; endT=0; warnT=0;
  mode='play';
}

/* ------------------------------------------------------------------ steps */
function steer(){
  while(buf.length){
    const d=buf.shift();
    if(d.x===-dir.x&&d.y===-dir.y) continue;
    if(d.x===dir.x&&d.y===dir.y) continue;
    dir=d; return;
  }
  if(mouseMode&&aim){
    const gx=(aim.x-ox)/cell-.5, gy=(aim.y-oy)/cell-.5;
    const dx=gx-snake[0].x, dy=gy-snake[0].y;
    if(Math.hypot(dx,dy)<.85) return;
    const cand = Math.abs(dx)>=Math.abs(dy)
      ? [{x:Math.sign(dx),y:0},{x:0,y:Math.sign(dy)}]
      : [{x:0,y:Math.sign(dy)},{x:Math.sign(dx),y:0}];
    for(const d of cand){
      if(!d.x&&!d.y) continue;
      if(d.x===-dir.x&&d.y===-dir.y) continue;
      dir=d; return;
    }
  }
}

function die(msg){
  if(mode!=='play') return;
  mode='dead'; deathMsg=msg; endT=0;
  const h=snake[0];
  burst(cx(h.x),cy(h.y),'#fff',36,2.2,1.4);
  for(let i=0;i<snake.length;i++){
    const s=snake[i], col=i===0?'#fff':HUE[herd[i-1]];
    burst(cx(s.x),cy(s.y),col,7,1.3,1.1);
  }
  ring(cx(h.x),cy(h.y),cell*7,'#ff5577',5,.7);
  shake=26; flash=.65; flashCol='#ff4d6d'; hitstop=.13;
  saveBest(); sDie();
}

function passGate(g){
  const L=g.seq.length;
  for(let i=0;i<L;i++){
    const ci=herd.pop(); const s=snake.pop();
    if(s){ burst(cx(s.x),cy(s.y),HUE[ci],16,1.5,1.1); ring(cx(s.x),cy(s.y),cell*1.6,HUE[ci],3,.4); }
  }
  cleared++; rescued+=L;
  combo=Math.min(9,combo+1); comboT=9;
  const pts=100*L*L*combo;
  score+=pts;
  meter=Math.min(1,meter+.30+L*.06);
  const gcx=cx(clamp(g.gx,0,COLS-1)), gcy=cy(clamp(g.gy,0,ROWS-1));
  ring(gcx,gcy,cell*9,'#fff',6,.55);
  ring(gcx,gcy,cell*6,HUE[g.seq[0]],4,.45);
  for(let i=0;i<6;i++) burst(gcx,gcy,HUE[i],10,2,1.2);
  pop(gcx,gcy-cell,'+'+pts+(combo>1?'  x'+combo:''),'#fff',Math.max(14,cell*.8));
  shake=12+L*3; flash=.45; flashCol='#ffffff'; hitstop=.09;
  sGate(L);
  const idx=gates.indexOf(g);
  if(idx>=0) gates[idx]=mkGate(g.side);
  tick=lvl().tick;
  topUp();
  if(cleared>=WIN_GATES){
    mode='win'; endT=0; saveBest(); sWin();
    for(let i=0;i<7;i++) winBurst(i);
  }
}
function winBurst(i){
  const px=rnd(ox,ox+aw), py=rnd(oy,oy+ah);
  burst(px,py,HUE[i%6],26,2,1.6);
  ring(px,py,cell*6,HUE[i%6],4,.8);
}

function collect(u,i){
  const wasNeeded=needed().indexOf(u.c)>=0, before=maxProg();
  units.splice(i,1);
  herd.push(u.c);
  const t=snake[snake.length-1];
  snake.push({x:t.px,y:t.py,px:t.px,py:t.py});
  score+=10; meter=Math.min(1,meter+.07);
  burst(cx(u.x),cy(u.y),HUE[u.c],12,1,.8);
  ring(cx(u.x),cy(u.y),cell*1.5,HUE[u.c],2.5,.35);
  shake=Math.max(shake,4);
  sCollect(u.c);
  spawnUnit();
  // readable feedback on whether this pickup helped or wrecked the order
  const after=maxProg();
  if(after<before||(!wasNeeded&&after===0&&herd.length>1)){
    flash=Math.max(flash,.22); flashCol='#ff4d6d';
    pop(cx(u.x),cy(u.y)-cell*.9,'ORDER BROKEN','#ff8fa6',13);
    sBad();
  } else if(after>before){
    pop(cx(u.x),cy(u.y)-cell*.9,after+' in a row','#ffffff',13);
  }
}

function dropTail(){
  if(mode!=='play') return;
  if(!herd.length){ sBad(); return; }
  const ci=herd.pop(); const s=snake.pop();
  const p=freeCell(2);
  if(p) units.push({x:p.x,y:p.y,c:ci,t:0,born:T});
  burst(cx(s.x),cy(s.y),HUE[ci],14,1.2,.8);
  ring(cx(s.x),cy(s.y),cell*2,HUE[ci],2.5,.4);
  meter=Math.max(0,meter-.05);
  score=Math.max(0,score-25);
  combo=1;
  shake=Math.max(shake,6);
  pop(cx(s.x),cy(s.y)-cell*.6,'released',DIM[ci],13);
  sDrop();
}

function step(){
  steer();
  let nx=snake[0].x+dir.x, ny=snake[0].y+dir.y, warped=false, gate=null;

  if(nx<0||ny<0||nx>=COLS||ny>=ROWS){
    for(const g of gates) if(g.gx===nx&&g.gy===ny) gate=g;
    if(gate && isOpen(gate)){
      passGate(gate); warped=true;
      if(gate.side===0){ nx=gate.pos; ny=ROWS-1; }
      else if(gate.side===1){ nx=0; ny=gate.pos; }
      else if(gate.side===2){ nx=gate.pos; ny=0; }
      else { nx=COLS-1; ny=gate.pos; }
      if(mode!=='play') return;
    } else {
      die(gate?'THE GATE WAS SEALED':'RAN INTO THE FENCE');
      return;
    }
  }
  for(let i=1;i<snake.length-1;i++){
    if(snake[i].x===nx&&snake[i].y===ny){ die('TANGLED IN YOUR OWN HERD'); return; }
  }

  for(const s of snake){ s.px=s.x; s.py=s.y; }
  for(let i=snake.length-1;i>0;i--){ snake[i].x=snake[i-1].px; snake[i].y=snake[i-1].py; }
  snake[0].x=nx; snake[0].y=ny;
  if(warped){ burst(cx(nx),cy(ny),'#fff',10,1.2,.5); }

  for(let i=units.length-1;i>=0;i--){
    const u=units[i];
    if(u.x===nx&&u.y===ny){ collect(u,i); break; }
  }
  topUp();
}

/* ----------------------------------------------------------------- update */
function update(dt){
  T+=dt;
  shake*=Math.pow(.0016,dt);
  flash=Math.max(0,flash-dt*3.2);
  if(hitstop>0){ hitstop-=dt; return; }

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.l-=dt; if(p.l<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    const k=Math.pow(.06,dt); p.vx*=k; p.vy*=k;
  }
  for(let i=rings.length-1;i>=0;i--){ rings[i].l-=dt; if(rings[i].l<=0) rings.splice(i,1); }
  for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.l-=dt; t.y-=dt*34; if(t.l<=0) texts.splice(i,1); }
  for(const u of units) u.t+=dt;
  for(const g of gates) g.pulse=Math.max(0,g.pulse-dt*1.6);

  shown+=(score-shown)*Math.min(1,dt*9);

  if(mode!=='play'){ endT+=dt; return; }

  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=1; }

  const cf=lvl();
  meter-=cf.drain*dt;
  if(meter<=0){ meter=0; die('THE HERD LOST HOPE'); return; }
  if(meter<.22){
    warnT-=dt;
    if(warnT<=0){ warnT=.34; snd(660,440,.09,'square',.05); }
  }

  acc+=dt;
  let guard=0;
  while(acc>=tick && mode==='play' && guard++<6){ acc-=tick; step(); }
  if(mode!=='play') acc=0;
  tp=clamp(acc/tick,0,1);
}

/* ------------------------------------------------------------------- draw */
function unicorn(px,py,r,col,ang,head,glyph){
  x.save(); x.translate(px,py); x.rotate(ang);
  x.globalAlpha=.28; x.fillStyle='#000';
  x.beginPath(); x.ellipse(0,r*.55,r*.95,r*.34,0,0,TAU); x.fill();
  x.globalAlpha=1;
  // tail
  x.strokeStyle=head?`hsl(${(T*180)%360} 90% 70%)`:col;
  x.lineWidth=Math.max(1.3,r*.2); x.lineCap='round';
  x.beginPath(); x.moveTo(-r*.95,-r*.05);
  x.quadraticCurveTo(-r*1.5,-r*.5+Math.sin(T*9+px)*r*.2,-r*1.35,-r*.85);
  x.stroke();
  // body
  x.fillStyle=col;
  x.beginPath(); x.ellipse(-r*.12,0,r*.92,r*.66,0,0,TAU); x.fill();
  // head
  x.beginPath(); x.ellipse(r*.66,-r*.3,r*.5,r*.4,.55,0,TAU); x.fill();
  // horn
  x.fillStyle=head?'#fff7cf':'#ffeeb8';
  x.beginPath(); x.moveTo(r*.86,-r*.66); x.lineTo(r*1.42,-r*1.3); x.lineTo(r*1.06,-r*.44); x.closePath(); x.fill();
  // mane
  x.fillStyle=head?`hsl(${(T*180+60)%360} 90% 68%)`:'rgba(255,255,255,.55)';
  x.beginPath(); x.arc(r*.34,-r*.52,r*.32,0,TAU); x.fill();
  x.beginPath(); x.arc(r*.02,-r*.55,r*.24,0,TAU); x.fill();
  // eye
  x.fillStyle='#2a1c3d';
  x.beginPath(); x.arc(r*.82,-r*.36,Math.max(1,r*.11),0,TAU); x.fill();
  // glyph badge
  if(glyph!==undefined && r>7){
    x.rotate(-ang);
    x.globalAlpha=.55; x.fillStyle='#1a1030';
    shapePath(-r*.1,r*.02,r*.36,glyph); x.fill();
    x.globalAlpha=1;
  }
  x.restore();
}

function segPos(s){
  const dx=s.x-s.px, dy=s.y-s.py;
  if(Math.abs(dx)>1||Math.abs(dy)>1) return [cx(s.x),cy(s.y)];
  return [cx(lerp(s.px,s.x,tp)),cy(lerp(s.py,s.y,tp))];
}
function segAng(s){
  let dx=s.x-s.px, dy=s.y-s.py;
  if(Math.abs(dx)>1||Math.abs(dy)>1){ dx=dir.x; dy=dir.y; }
  if(!dx&&!dy) return 0;
  return Math.atan2(dy,dx);
}

function drawBg(){
  x.fillStyle='#0a0714'; x.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){
    const a=T*.11+i*2.1;
    const px=W/2+Math.cos(a)*W*.32, py=H/2+Math.sin(a*1.27)*H*.3;
    const g=x.createRadialGradient(px,py,0,px,py,Math.max(W,H)*.42);
    g.addColorStop(0,`hsla(${(i*80+T*14)%360},80%,55%,.13)`);
    g.addColorStop(1,'hsla(0,0%,0%,0)');
    x.fillStyle=g; x.fillRect(0,0,W,H);
  }
}

function drawArena(){
  x.fillStyle=FLOOR;
  x.fillRect(ox,oy,aw,ah);
  x.strokeStyle='rgba(255,255,255,.045)'; x.lineWidth=1;
  x.beginPath();
  for(let i=1;i<COLS;i++){ x.moveTo(ox+i*cell,oy); x.lineTo(ox+i*cell,oy+ah); }
  for(let j=1;j<ROWS;j++){ x.moveTo(ox,oy+j*cell); x.lineTo(ox+aw,oy+j*cell); }
  x.stroke();
  // checker tint
  x.fillStyle='rgba(255,255,255,.02)';
  for(let i=0;i<COLS;i++) for(let j=0;j<ROWS;j++) if((i+j)%2) x.fillRect(ox+i*cell,oy+j*cell,cell,cell);
}

function drawWalls(){
  x.strokeStyle=WALL; x.lineWidth=wt; x.lineJoin='round';
  x.strokeRect(ox-wt/2,oy-wt/2,aw+wt,ah+wt);
  // carve openings
  x.save();
  for(const g of gates){
    x.fillStyle=FLOOR;
    if(g.side===0) x.fillRect(ox+g.pos*cell,oy-wt-1,cell,wt+2);
    else if(g.side===1) x.fillRect(ox+aw-1,oy+g.pos*cell,wt+2,cell);
    else if(g.side===2) x.fillRect(ox+g.pos*cell,oy+ah-1,cell,wt+2);
    else x.fillRect(ox-wt-1,oy+g.pos*cell,wt+2,cell);
  }
  x.restore();
}

function gateAnchor(g){
  if(g.side===0) return [cx(g.pos),oy-wt/2];
  if(g.side===1) return [ox+aw+wt/2,cy(g.pos)];
  if(g.side===2) return [cx(g.pos),oy+ah+wt/2];
  return [ox-wt/2,cy(g.pos)];
}

function drawGate(g){
  const L=g.seq.length, p=prog(g), open=(p===L);
  const [ax,ay]=gateAnchor(g);
  const pulse=.5+.5*Math.sin(T*(open?6:2.2));

  // beam into the arena when open
  if(open){
    const d=cell*4.5;
    const bx=ax-g.nx*d/2, by=ay-g.ny*d/2;
    const gr=x.createLinearGradient(ax,ay,ax-g.nx*d,ay-g.ny*d);
    gr.addColorStop(0,`hsla(${(T*160)%360},95%,65%,${.4+pulse*.2})`);
    gr.addColorStop(1,'hsla(0,0%,100%,0)');
    x.save(); x.fillStyle=gr;
    if(g.side%2===0) x.fillRect(ax-cell*.5,Math.min(ay,ay-g.ny*d),cell,d);
    else x.fillRect(Math.min(ax,ax-g.nx*d),ay-cell*.5,d,cell);
    x.restore();
  }

  // gate frame
  const half=cell*.5+wt*.5;
  x.save();
  x.translate(ax,ay);
  if(g.side%2===1) x.rotate(PI/2);
  x.lineWidth=Math.max(2,wt*.7);
  if(open){
    x.strokeStyle=`hsl(${(T*160)%360} 95% ${62+pulse*12}%)`;
    x.shadowColor=x.strokeStyle; x.shadowBlur=cell*.7;
  } else {
    x.strokeStyle='#6b53a8'; x.shadowBlur=0;
  }
  x.beginPath();
  x.moveTo(-half,-wt*1.6); x.lineTo(-half,wt*1.6);
  x.moveTo(half,-wt*1.6);  x.lineTo(half,wt*1.6);
  x.stroke();
  if(!open){
    x.strokeStyle='rgba(150,125,205,.75)'; x.lineWidth=Math.max(1.5,wt*.35);
    x.beginPath();
    for(let i=-1;i<=1;i++){ x.moveTo(i*cell*.3,-wt*1.1); x.lineTo(i*cell*.3,wt*1.1); }
    x.stroke();
  }
  x.restore();
  x.shadowBlur=0;

  // pips
  const pr=Math.max(4,cell*.235), gap=pr*2.55;
  const along = g.side%2===0 ? {x:1,y:0} : {x:0,y:1};
  const out = cell*.92+wt;
  const bx=ax+g.nx*out, by=ay+g.ny*out; // outward from the wall
  const startOff=-(L-1)/2*gap;
  for(let i=0;i<L;i++){
    const px=bx+along.x*(startOff+i*gap);
    const py=by+along.y*(startOff+i*gap);
    const done=i<p, next=(i===p);
    x.save();
    if(done){
      x.fillStyle=HUE[g.seq[i]];
      x.shadowColor=HUE[g.seq[i]]; x.shadowBlur=cell*.4;
      shapePath(px,py,pr,g.seq[i]); x.fill();
      x.shadowBlur=0;
      x.strokeStyle='rgba(255,255,255,.9)'; x.lineWidth=1.5;
      shapePath(px,py,pr,g.seq[i]); x.stroke();
    } else {
      x.fillStyle=DIM[g.seq[i]];
      shapePath(px,py,pr,g.seq[i]); x.fill();
      x.strokeStyle=HUE[g.seq[i]]; x.lineWidth=next?2.2:1;
      x.globalAlpha=next?1:.5;
      shapePath(px,py,pr,g.seq[i]); x.stroke();
      x.globalAlpha=1;
      if(next){
        x.strokeStyle=`rgba(255,255,255,${.35+pulse*.5})`;
        x.lineWidth=2;
        x.beginPath(); x.arc(px,py,pr*(1.7+pulse*.35),0,TAU); x.stroke();
      }
    }
    x.restore();
  }
  // progress caption
  x.save();
  x.font='700 '+Math.max(9,Math.round(cell*.32))+'px ui-sans-serif,system-ui,sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle=open?'#fff':'rgba(220,210,255,.55)';
  const capOff=out+pr*2.2;
  const tx=ax+g.nx*capOff, ty=ay+g.ny*capOff;
  x.fillText(open?'OPEN':(p+'/'+L), tx, ty);
  x.restore();
}

function drawUnits(){
  const need=needed();
  for(const u of units){
    const px=cx(u.x), py=cy(u.y)+Math.sin(T*3.4+u.x*1.7+u.y)*cell*.07;
    const grow=clamp((T-u.born)*4,0,1);
    const r=cell*.36*easeOut(grow);
    if(need.indexOf(u.c)>=0){
      const pl=.5+.5*Math.sin(T*5+u.x);
      x.strokeStyle=HUE[u.c]; x.globalAlpha=.35+pl*.4; x.lineWidth=2;
      x.beginPath(); x.arc(px,py,cell*(.46+pl*.08),0,TAU); x.stroke();
      x.globalAlpha=1;
    }
    unicorn(px,py,r,HUE[u.c],Math.sin(T*1.6+u.x)*.25,false,u.c);
  }
}

function drawSnake(){
  // connective ribbon
  x.strokeStyle='rgba(255,255,255,.10)'; x.lineWidth=cell*.5; x.lineCap='round'; x.lineJoin='round';
  x.beginPath();
  let pen=false;
  for(let i=0;i<snake.length;i++){
    const s=snake[i], [px,py]=segPos(s);
    if(i>0){
      const q=snake[i-1];
      if(Math.abs(q.x-s.x)+Math.abs(q.y-s.y)>1){ pen=false; }
    }
    if(!pen){ x.moveTo(px,py); pen=true; } else x.lineTo(px,py);
  }
  x.stroke();

  for(let i=snake.length-1;i>=1;i--){
    const s=snake[i], ci=herd[i-1];
    if(ci===undefined) continue;
    const [px,py]=segPos(s);
    const tail=(i===snake.length-1);
    if(tail){
      const pl=.5+.5*Math.sin(T*6);
      x.strokeStyle='rgba(255,255,255,'+(.4+pl*.45)+')'; x.lineWidth=2;
      x.beginPath(); x.arc(px,py,cell*.47,0,TAU); x.stroke();
    }
    unicorn(px,py,cell*.34,HUE[ci],segAng(s),false,ci);
  }
  const h=snake[0], [hx,hy]=segPos(h);
  x.save();
  x.shadowColor='#fff'; x.shadowBlur=cell*.5;
  unicorn(hx,hy,cell*.42,'#ffffff',segAng(h),true);
  x.restore();
}

function drawFx(){
  for(const p of parts){
    const a=clamp(p.l/p.m,0,1);
    x.globalAlpha=a; x.fillStyle=p.c;
    x.fillRect(p.x-p.r*a,p.y-p.r*a,p.r*2*a,p.r*2*a);
  }
  x.globalAlpha=1;
  for(const r of rings){
    const t=1-r.l/r.m, rr=r.mr*easeOut(t);
    x.globalAlpha=(1-t)*.9; x.strokeStyle=r.c; x.lineWidth=r.w*(1-t)+.5;
    x.beginPath(); x.arc(r.x,r.y,rr,0,TAU); x.stroke();
  }
  x.globalAlpha=1;
  for(const t of texts){
    const a=clamp(t.l/t.m,0,1);
    x.globalAlpha=a; x.fillStyle=t.c;
    x.font='800 '+t.s+'px ui-sans-serif,system-ui,sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText(t.t,t.x,t.y);
  }
  x.globalAlpha=1;
}

function bestGate(){
  let bg=null,bp=-1;
  for(const g of gates){ const p=prog(g); if(p>bp||(p===bp&&bg&&g.seq.length>bg.seq.length)){ bp=p; bg=g; } }
  return [bg,bp];
}

function drawHud(){
  // meter
  const mh=8;
  x.fillStyle='rgba(255,255,255,.08)'; x.fillRect(0,0,W,mh);
  const g=x.createLinearGradient(0,0,W,0);
  for(let i=0;i<6;i++) g.addColorStop(i/5,HUE[i]);
  x.save();
  if(meter<.22){ x.globalAlpha=.55+.45*Math.abs(Math.sin(T*9)); }
  x.fillStyle=g; x.fillRect(0,0,W*meter,mh);
  x.restore();

  x.textBaseline='middle';
  x.font='800 20px ui-sans-serif,system-ui,sans-serif';
  x.textAlign='left'; x.fillStyle=INK;
  x.fillText(String(Math.round(shown)).padStart(5,'0'),18,32);
  x.font='600 11px ui-sans-serif,system-ui,sans-serif';
  x.fillStyle='rgba(230,220,255,.5)';
  x.fillText('SCORE',18,50);

  x.textAlign='right';
  x.font='800 20px ui-sans-serif,system-ui,sans-serif'; x.fillStyle=INK;
  x.fillText(String(best).padStart(5,'0'),W-18,32);
  x.font='600 11px ui-sans-serif,system-ui,sans-serif'; x.fillStyle='rgba(230,220,255,.5)';
  x.fillText('BEST',W-18,50);

  x.textAlign='center';
  x.font='800 18px ui-sans-serif,system-ui,sans-serif'; x.fillStyle=INK;
  x.fillText('GATES  '+cleared+' / '+WIN_GATES,W/2,30);
  if(combo>1){
    x.font='800 15px ui-sans-serif,system-ui,sans-serif';
    x.fillStyle=`hsl(${(T*200)%360} 90% 68%)`;
    x.fillText('COMBO x'+combo,W/2,50);
  } else {
    x.font='600 11px ui-sans-serif,system-ui,sans-serif';
    x.fillStyle='rgba(230,220,255,.45)';
    x.fillText('HOPE DRAINS — RUN A GATE',W/2,50);
  }

  // herd strip — the whole point of the game, so give it room
  const [bg,bp]=bestGate();
  const MAXP=12;
  const show=herd.slice(-MAXP);
  const n=show.length;
  const pr=Math.max(6,Math.min(13,(W*.62)/(Math.max(4,n)*2.55)));
  const gap=pr*2.55;
  const stripY=oy+ah+34;
  const sx=W/2-(Math.max(1,n)-1)/2*gap;

  x.font='700 11px ui-sans-serif,system-ui,sans-serif';
  x.textAlign='right'; x.textBaseline='middle'; x.fillStyle='rgba(230,220,255,.5)';
  x.fillText(herd.length>MAXP?'HERD +'+(herd.length-MAXP):'HERD', sx-gap*.8, stripY);

  if(n===0){
    x.textAlign='center'; x.fillStyle='rgba(230,220,255,.35)';
    x.font='600 12px ui-sans-serif,system-ui,sans-serif';
    x.fillText('empty herd — go rescue somebody', W/2, stripY);
  }
  for(let i=0;i<n;i++){
    const px=sx+i*gap, py=stripY, ci=show[i];
    const matched = bp>0 && i>=n-bp;
    x.save();
    if(matched){ x.shadowColor=HUE[ci]; x.shadowBlur=10; }
    x.fillStyle=matched?HUE[ci]:DIM[ci];
    shapePath(px,py,pr,ci); x.fill();
    x.shadowBlur=0;
    x.strokeStyle=matched?'#fff':HUE[ci]; x.lineWidth=matched?2:1.2;
    x.globalAlpha=matched?1:.7;
    shapePath(px,py,pr,ci); x.stroke();
    x.restore();
  }
  if(n>0){
    const px=sx+(n-1)*gap;
    x.fillStyle='rgba(255,255,255,.8)'; x.textAlign='left';
    x.font='700 10px ui-sans-serif,system-ui,sans-serif';
    x.fillText('TAIL',px+pr+7,stripY);
  }
  // what to grab next
  if(bg){
    const p=bp, L=bg.seq.length, hy=stripY+pr+16;
    x.textAlign='center'; x.textBaseline='middle';
    if(p===L){
      x.save();
      x.font='800 13px ui-sans-serif,system-ui,sans-serif';
      x.shadowColor='#fff'; x.shadowBlur=12;
      x.fillStyle=`hsl(${(T*220)%360} 95% 72%)`;
      x.fillText('A GATE IS OPEN — RUN IT',W/2,hy);
      x.restore();
    } else {
      const msg='NEXT UP';
      x.font='700 11px ui-sans-serif,system-ui,sans-serif';
      x.fillStyle='rgba(230,220,255,.5)';
      const mw=x.measureText(msg).width;
      x.textAlign='left';
      x.fillText(msg,W/2-mw/2-11,hy);
      x.save();
      x.shadowColor=HUE[bg.seq[p]]; x.shadowBlur=10;
      x.fillStyle=HUE[bg.seq[p]];
      shapePath(W/2+mw/2+3,hy,9,bg.seq[p]); x.fill();
      x.restore();
    }
  }
}

function rainbowText(t,px,py,size,spread){
  x.font='900 '+size+'px ui-sans-serif,system-ui,sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  const g=x.createLinearGradient(px-spread,0,px+spread,0);
  for(let i=0;i<6;i++) g.addColorStop(i/5,HUE[(i+Math.floor(T*2))%6]);
  x.fillStyle=g; x.fillText(t,px,py);
}

function drawTitle(){
  x.fillStyle='rgba(10,7,20,.72)'; x.fillRect(0,0,W,H);
  const cxp=W/2;
  rainbowText('H E R D',cxp,H*.22,Math.min(72,W*.11),W*.22);
  x.textAlign='center'; x.textBaseline='middle';
  x.font='600 14px ui-sans-serif,system-ui,sans-serif';
  x.fillStyle='rgba(230,220,255,.75)';
  x.fillText('a snake made of rescued unicorns',cxp,H*.22+Math.min(52,W*.08));

  const lines=[
    'Rescue unicorns — each one joins the BACK of your herd.',
    'Every gate wants an exact colour ORDER at your tail.',
    'Collect them left-to-right and the gate opens; run it to free them.',
    'A sealed gate is a wall. Your own herd is a wall. Hope drains always.',
    'SPACE / CLICK  releases the tail unicorn back into the field.'
  ];
  x.font='600 14px ui-sans-serif,system-ui,sans-serif';
  let y=H*.44;
  for(const l of lines){ x.fillStyle='rgba(226,218,255,.85)'; x.fillText(l,cxp,y); y+=24; }

  // example
  y+=14;
  const seq=[0,3,4], pr=14, gap=pr*2.6, sx=cxp-(seq.length-1)/2*gap;
  for(let i=0;i<seq.length;i++){
    x.fillStyle=HUE[seq[i]];
    shapePath(sx+i*gap,y,pr,seq[i]); x.fill();
    x.strokeStyle='#fff'; x.lineWidth=1.4;
    shapePath(sx+i*gap,y,pr,seq[i]); x.stroke();
  }
  x.font='600 12px ui-sans-serif,system-ui,sans-serif'; x.fillStyle='rgba(230,220,255,.55)';
  x.fillText('gate wants this order, tail last  →',cxp-gap*2.4,y);
  y+=30;

  x.font='600 13px ui-sans-serif,system-ui,sans-serif'; x.fillStyle='rgba(230,220,255,.6)';
  x.fillText('ARROWS / WASD or MOUSE to steer   •   M mutes',cxp,y);

  const pl=.55+.45*Math.sin(T*4);
  x.globalAlpha=pl;
  x.font='800 18px ui-sans-serif,system-ui,sans-serif'; x.fillStyle='#fff';
  x.fillText('PRESS ANY KEY',cxp,H*.86);
  x.globalAlpha=1;
  if(best>0){
    x.font='600 12px ui-sans-serif,system-ui,sans-serif'; x.fillStyle='rgba(230,220,255,.5)';
    x.fillText('best  '+best,cxp,H*.86+26);
  }
}

function drawEnd(){
  const a=clamp(endT*2.4,0,1);
  x.globalAlpha=a*.78; x.fillStyle='#08050f'; x.fillRect(0,0,W,H); x.globalAlpha=1;
  const cxp=W/2, cyp=H/2-40, sc=easeOut(clamp(endT*3,0,1));
  x.save(); x.translate(cxp,cyp); x.scale(.9+sc*.1,.9+sc*.1); x.translate(-cxp,-cyp);
  if(mode==='win'){
    rainbowText('THE HERD IS FREE',cxp,cyp,Math.min(52,W*.075),W*.3);
  } else {
    x.font='900 '+Math.min(46,W*.068)+'px ui-sans-serif,system-ui,sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillStyle='#ff4d6d'; x.fillText(deathMsg,cxp,cyp);
  }
  x.restore();
  x.textAlign='center'; x.textBaseline='middle';
  x.font='800 26px ui-sans-serif,system-ui,sans-serif'; x.fillStyle=INK;
  x.fillText('SCORE  '+score,cxp,cyp+58);
  x.font='600 14px ui-sans-serif,system-ui,sans-serif'; x.fillStyle='rgba(230,220,255,.7)';
  x.fillText(cleared+' gates run  •  '+rescued+' unicorns freed  •  best '+best,cxp,cyp+88);
  if(score>=best&&score>0){
    x.font='800 14px ui-sans-serif,system-ui,sans-serif';
    x.fillStyle=`hsl(${(T*200)%360} 90% 68%)`;
    x.fillText('NEW BEST',cxp,cyp+112);
  }
  const pl=.55+.45*Math.sin(T*4);
  x.globalAlpha=pl*a;
  x.font='800 17px ui-sans-serif,system-ui,sans-serif'; x.fillStyle='#fff';
  x.fillText('R  or  CLICK  to run again',cxp,cyp+156);
  x.globalAlpha=1;
}

function draw(){
  drawBg();
  x.save();
  if(shake>.4){
    const s=shake;
    x.translate(rnd(-s,s),rnd(-s,s));
  }
  drawArena();
  if(mode!=='title'){
    for(const g of gates) drawGate(g);
  }
  drawWalls();
  if(mode!=='title'){
    drawUnits();
    drawSnake();
  }
  drawFx();
  x.restore();

  if(flash>0){
    x.globalAlpha=clamp(flash,0,1)*.5; x.fillStyle=flashCol;
    x.fillRect(0,0,W,H); x.globalAlpha=1;
  }
  if(mode==='title') drawTitle();
  else{
    drawHud();
    if(mode==='dead'||mode==='win') drawEnd();
  }
  if(muted){
    x.font='600 11px ui-sans-serif,system-ui,sans-serif';
    x.textAlign='left'; x.textBaseline='alphabetic';
    x.fillStyle='rgba(230,220,255,.35)'; x.fillText('muted',18,H-14);
  }
}

/* ------------------------------------------------------------------ input */
const KD={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
          w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0],
          k:[0,-1],j:[0,1],h:[-1,0],l:[1,0]};
addEventListener('keydown',e=>{
  if(e.key===' '||e.key.indexOf('Arrow')===0) e.preventDefault();
  actx();
  if(e.key==='m'||e.key==='M'){ muted=!muted; return; }
  if(mode==='title'){ reset(); return; }
  if(mode==='dead'||mode==='win'){ if(endT>.35) reset(); return; }
  const d=KD[e.key];
  if(d){ mouseMode=false; if(buf.length<2) buf.push({x:d[0],y:d[1]}); return; }
  if(e.key===' '){ dropTail(); return; }
  if(e.key==='r'||e.key==='R'){ reset(); }
});
let downPt=null;
addEventListener('pointerdown',e=>{
  actx();
  downPt={x:e.clientX,y:e.clientY,t:performance.now()};
  if(mode==='title'){ reset(); return; }
  if(mode==='dead'||mode==='win'){ if(endT>.35) reset(); return; }
  if(e.pointerType==='mouse'){ dropTail(); }
});
addEventListener('pointerup',e=>{
  if(!downPt||mode!=='play'){ downPt=null; return; }
  if(e.pointerType!=='mouse'){
    const dx=e.clientX-downPt.x, dy=e.clientY-downPt.y;
    if(Math.hypot(dx,dy)<22){ dropTail(); }
    else{
      mouseMode=false;
      const d=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};
      if(buf.length<2) buf.push(d);
    }
  }
  downPt=null;
});
addEventListener('pointermove',e=>{
  aim={x:e.clientX,y:e.clientY};
  if(e.pointerType==='mouse') mouseMode=true;
});
addEventListener('contextmenu',e=>e.preventDefault());

/* ------------------------------------------------------------------- loop */
resize();
let last=performance.now();
requestAnimationFrame(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  update(dt);
  draw();
});
</script>
