<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RAINFALL</title>
<style>
  html,body{margin:0;height:100%;background:#07050f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
</style>
<canvas id=c></canvas>
<script>
'use strict'
// RAINFALL — a unicorn falls down a well of shadows.
// Downwell-like: rainbow gunboots, stomp combos, destructible shaft, perks per level.

//////////////////// constants ////////////////////
const TW = 10                 // tile size, virtual px
const COLS = 16               // shaft width in tiles
const VW = COLS * TW          // 160 virtual px wide
const VH = 240                // virtual px tall
const LEVEL_ROWS = 100        // rows per level, last few are the landing chamber
const SAVE = 'rainfall_best'

const c = document.getElementById('c'), x = c.getContext('2d')
let W = 0, H = 0, scale = 1, offX = 0, offY = 0
function resize() {
  W = c.width = innerWidth; H = c.height = innerHeight
  scale = Math.max(0.5, Math.floor(Math.min(W / VW, H / VH) * 2) / 2)
  offX = ((W - VW * scale) / 2) | 0
  offY = ((H - VH * scale) / 2) | 0
}
onresize = resize; resize()

//////////////////// palettes ////////////////////
// one per level, cycling. {bg, far, rock, edge, glow}
const PALS = [
  { bg: '#150a24', far: '#241041', rock: '#5b2a86', edge: '#a45ee5', glow: '#ff6ad5' },
  { bg: '#0b1430', far: '#12224d', rock: '#274a8f', edge: '#4f9be8', glow: '#68e8ff' },
  { bg: '#0a2018', far: '#0f3326', rock: '#1c6b45', edge: '#3fd08a', glow: '#c8ff6a' },
  { bg: '#2a1208', far: '#40200c', rock: '#8a4416', edge: '#e08a34', glow: '#ffd76a' },
  { bg: '#230a18', far: '#3b1029', rock: '#8c1f4d', edge: '#e05286', glow: '#ff9ec4' },
  { bg: '#0d0d1c', far: '#171733', rock: '#3a3a6b', edge: '#8686c4', glow: '#ffffff' },
]
const pal = () => PALS[level % PALS.length]
const RAINBOW = ['#ff4d6d', '#ff9f45', '#ffe14d', '#5ce65c', '#4dc8ff', '#9b6bff']

//////////////////// audio ////////////////////
let ac = null, muted = false
function audioInit() {
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A() }
  if (ac && ac.state === 'suspended') ac.resume()
}
function snd(freq, dur, type, vol, slide) {
  if (!ac || muted) return
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain()
  o.type = type || 'square'
  o.frequency.setValueAtTime(freq, t)
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur)
  g.gain.setValueAtTime(vol || 0.05, t)
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  o.connect(g); g.connect(ac.destination)
  o.start(t); o.stop(t + dur + 0.02)
}
const sShoot = () => snd(620 + Math.random() * 80, 0.06, 'square', 0.025, 0.4)
const sStomp = n => snd(300 + n * 60, 0.12, 'square', 0.06, 2.2)
const sBreak = () => snd(160, 0.07, 'sawtooth', 0.025, 0.5)
const sGem = () => snd(880 + Math.random() * 200, 0.07, 'triangle', 0.04, 1.6)
const sHurt = () => snd(220, 0.28, 'sawtooth', 0.09, 0.25)
const sDie = () => snd(300, 0.9, 'sawtooth', 0.1, 0.08)
const sPick = () => snd(520, 0.16, 'triangle', 0.06, 1.8)

//////////////////// input ////////////////////
const keys = {}
onkeydown = e => {
  if (e.repeat) return
  audioInit()
  keys[e.key.toLowerCase()] = 1
  if ([' ', 'arrowup', 'arrowleft', 'arrowright', 'arrowdown'].includes(e.key.toLowerCase())) e.preventDefault()
  if (e.key.toLowerCase() === 'm') muted = !muted
  onPress(e.key.toLowerCase())
}
onkeyup = e => { keys[e.key.toLowerCase()] = 0 }
onblur = () => { for (const k in keys) keys[k] = 0; touches.clear() }

// touch: bottom-left = left, bottom-mid = right, right half / anywhere upper = jump
const touches = new Map()
function zoneOf(cx, cy) {
  const vx = (cx - offX) / scale, vy = (cy - offY) / scale
  if (vy > VH * 0.72) return vx < VW * 0.28 ? 'l' : vx < VW * 0.56 ? 'r' : 'j'
  return 'j'
}
function pointerVirt(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale } }
c.onpointerdown = e => {
  audioInit(); c.setPointerCapture(e.pointerId)
  touches.set(e.pointerId, zoneOf(e.clientX, e.clientY))
  onTap(pointerVirt(e))
}
c.onpointermove = e => { if (touches.has(e.pointerId)) touches.set(e.pointerId, zoneOf(e.clientX, e.clientY)) }
c.onpointerup = c.onpointercancel = e => touches.delete(e.pointerId)
const held = z => { for (const v of touches.values()) if (v === z) return true; return false }

const inLeft = () => keys['arrowleft'] || keys['a'] || held('l')
const inRight = () => keys['arrowright'] || keys['d'] || held('r')
const inJump = () => keys[' '] || keys['arrowup'] || keys['w'] || keys['z'] || held('j')

//////////////////// world ////////////////////
const rows = new Map()
let level = 0

function rnd() { return Math.random() }
function floorRow(l) { return (l + 1) * LEVEL_ROWS - 1 }

function genRow(r) {
  const row = new Uint8Array(COLS)
  row[0] = 1; row[COLS - 1] = 1
  const lvl = Math.floor(r / LEVEL_ROWS), rel = r - lvl * LEVEL_ROWS
  if (rel === LEVEL_ROWS - 1) { for (let i = 0; i < COLS; i++) row[i] = 4; rows.set(r, row); return row }
  if (rel >= LEVEL_ROWS - 8) { rows.set(r, row); return row }   // landing chamber: empty
  if (rel < 3 && lvl === 0) { rows.set(r, row); return row }    // room to drop in

  // ledges
  if (rnd() < 0.42) {
    const len = 3 + (rnd() * 4 | 0), sx = 1 + (rnd() * (COLS - 2 - len) | 0)
    for (let i = sx; i < sx + len; i++) row[i] = 1
  }
  // scattered chunks + thicker walls the deeper you go
  const dense = 0.05 + Math.min(0.06, lvl * 0.012)
  for (let i = 1; i < COLS - 1; i++) if (rnd() < dense) row[i] = 1
  if (rnd() < 0.5) row[rnd() < 0.5 ? 1 : COLS - 2] = 1

  // never seal the shaft: keep a run of 3 open cells
  let best = 0, run = 0
  for (let i = 1; i < COLS - 1; i++) { if (!row[i]) { if (++run > best) best = run } else run = 0 }
  if (best < 3) { const sx = 1 + (rnd() * (COLS - 5) | 0); for (let i = sx; i < sx + 3; i++) row[i] = 0 }

  // ore + hard rock
  for (let i = 1; i < COLS - 1; i++) {
    if (!row[i]) continue
    if (rnd() < 0.07) row[i] = 2
    else if (rnd() < 0.05 + lvl * 0.01) row[i] = 3
  }
  rows.set(r, row)
  populate(r, row, lvl, rel)
  return row
}

function populate(r, row, lvl, rel) {
  if (rel < 6 || rel > LEVEL_ROWS - 12) return
  const y = r * TW
  // enemies
  if (rnd() < Math.min(0.22, 0.10 + lvl * 0.022)) {
    const cands = []
    for (let i = 1; i < COLS - 1; i++) if (!row[i]) cands.push(i)
    if (cands.length) {
      const col = cands[rnd() * cands.length | 0]
      const roll = rnd(), t =
        lvl === 0 ? (roll < 0.72 ? 0 : 1)
          : lvl === 1 ? (roll < 0.45 ? 0 : roll < 0.75 ? 1 : 2)
            : lvl === 2 ? (roll < 0.34 ? 0 : roll < 0.58 ? 1 : roll < 0.8 ? 2 : 3)
              : (roll < 0.26 ? 0 : roll < 0.46 ? 1 : roll < 0.66 ? 2 : roll < 0.86 ? 3 : 4)
      spawnEnemy(t, col * TW + 1, y)
    }
  }
  // loose stardust
  if (rnd() < 0.16) {
    const col = 1 + (rnd() * (COLS - 2) | 0)
    if (!row[col]) gems.push({ x: col * TW + 3, y: y + 3, vx: 0, vy: 0, t: rnd() * 6, big: rnd() < 0.15 })
  }
}

function getRow(r) { return rows.get(r) || genRow(r) }
function tile(cx, cy) {
  if (cx < 0 || cx >= COLS) return 1
  if (cy < 0) return 0
  return getRow(cy)[cx]
}
function setTile(cx, cy, v) { if (cx >= 0 && cx < COLS && cy >= 0) getRow(cy)[cx] = v }

function hitRect(px, py, w, h) {
  const c0 = Math.floor(px / TW), c1 = Math.floor((px + w - 0.01) / TW)
  const r0 = Math.floor(py / TW), r1 = Math.floor((py + h - 0.01) / TW)
  for (let r = r0; r <= r1; r++) for (let cc = c0; cc <= c1; cc++) if (tile(cc, r)) return true
  return false
}

//////////////////// entities ////////////////////
let p, enemies, bullets, foeShots, gems, parts, texts, cam, shake
let state = 'title', hp, maxHp, ammo, maxAmmo, combo, comboBest, stardust, deepest
let fireCd, iFrames, shield, perksTaken, choices, best = 0, dieT = 0, flash = 0, tGlobal = 0
const S = { fireDelay: 0.1, shots: 1, spread: 18, pierce: 0, magnet: 0, shock: 0, recoil: 62, maxFall: 215, gemMult: 1, shieldMax: 0 }

try { best = +(localStorage.getItem(SAVE) || 0) } catch (e) { }

function reset() {
  rows.clear(); level = 0
  enemies = []; bullets = []; foeShots = []; gems = []; parts = []; texts = []
  p = { x: VW / 2 - 3, y: 8, vx: 0, vy: 0, w: 6, h: 8, onGround: false, hitWall: false, face: 1, trail: [], firing: 0, coyote: 0 }
  cam = { y: 0 }; shake = 0; flash = 0
  maxHp = 4; hp = 4; maxAmmo = 6; ammo = 6
  combo = 0; comboBest = 0; stardust = 0; deepest = 0
  fireCd = 0; iFrames = 0; shield = 0; perksTaken = {}
  S.fireDelay = 0.1; S.shots = 1; S.spread = 18; S.pierce = 0; S.magnet = 0
  S.shock = 0; S.recoil = 62; S.maxFall = 215; S.gemMult = 1; S.shieldMax = 0
  state = 'play'
}

function spawnEnemy(t, ex, ey) {
  const base = { type: t, x: ex, y: ey, vx: 0, vy: 0, t: rnd() * 6, hurt: 0, dive: 0, cd: 1 + rnd() }
  if (t === 0) enemies.push(Object.assign(base, { w: 8, h: 7, hp: 1, vx: rnd() < 0.5 ? -22 : 22, grav: 1, stomp: 1 }))
  if (t === 1) enemies.push(Object.assign(base, { w: 7, h: 7, hp: 1, grav: 0, stomp: 1 }))
  if (t === 2) enemies.push(Object.assign(base, { w: 8, h: 8, hp: 2, vx: rnd() < 0.5 ? -15 : 15, grav: 1, stomp: 0 }))
  if (t === 3) enemies.push(Object.assign(base, { w: 8, h: 6, hp: 1, grav: 0, stomp: 1 }))
  if (t === 4) enemies.push(Object.assign(base, { w: 8, h: 8, hp: 3, grav: 1, stomp: 1 }))
}

function move(e, dt) {
  e.onGround = false; e.hitWall = false
  const steps = Math.max(1, Math.ceil((Math.abs(e.vx) + Math.abs(e.vy)) * dt / 2))
  for (let i = 0; i < steps; i++) {
    const sx = e.vx * dt / steps, sy = e.vy * dt / steps
    if (sx) { e.x += sx; if (hitRect(e.x, e.y, e.w, e.h)) { e.x -= sx; e.vx = 0; e.hitWall = true } }
    if (sy) { e.y += sy; if (hitRect(e.x, e.y, e.w, e.h)) { e.y -= sy; if (sy > 0) e.onGround = true; e.vy = 0 } }
  }
}

function burst(px, py, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, s = (spd || 60) * (0.3 + rnd())
    parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.3 + rnd() * 0.4, max: 0.7, col: col || RAINBOW[rnd() * 6 | 0], g: 260 })
  }
}
function popText(px, py, s, col) { texts.push({ x: px, y: py, s: s, col: col || '#fff', life: 0.9 }) }

//////////////////// player ////////////////////
function updatePlayer(dt) {
  const dir = (inRight() ? 1 : 0) - (inLeft() ? 1 : 0)
  if (dir) p.face = dir
  const target = dir * 64
  p.vx += (target - p.vx) * Math.min(1, dt * (p.onGround ? 22 : 12))

  if (p.onGround) { p.coyote = 0.08; if (ammo < maxAmmo) ammo = maxAmmo; endCombo() }
  else p.coyote = Math.max(0, p.coyote - dt)

  // jump from ground, gunboots in the air
  if (inJump()) {
    if (p.coyote > 0 && !p.jumpLatch) { p.vy = -178; p.coyote = 0; p.jumpLatch = 1; snd(420, 0.09, 'square', 0.04, 1.6) }
    else if (!p.onGround && p.coyote <= 0 && ammo > 0 && fireCd <= 0) fire()
  } else p.jumpLatch = 0

  fireCd -= dt
  p.firing = Math.max(0, p.firing - dt)

  p.vy = Math.min(p.vy + 640 * dt, S.maxFall)
  move(p, dt)

  // rainbow trail while dropping
  p.trail.unshift({ x: p.x + 3, y: p.y + 4 })
  if (p.trail.length > 10) p.trail.pop()

  iFrames = Math.max(0, iFrames - dt)
  deepest = Math.max(deepest, (p.y / TW) | 0)

  // enemy contact
  for (const e of enemies) {
    if (e.dead) continue
    if (p.x + p.w < e.x || p.x > e.x + e.w || p.y + p.h < e.y || p.y > e.y + e.h) continue
    const stomping = p.vy > 20 && (p.y + p.h) - e.y < e.h * 0.7 + p.vy * 0.02
    if (stomping && e.stomp) {
      kill(e, true)
      p.vy = -152; ammo = maxAmmo
      if (S.shock) {
        for (const o of enemies) {
          if (o === e || o.dead) continue
          const dx = o.x - e.x, dy = o.y - e.y
          if (dx * dx + dy * dy < 32 * 32 && o.stomp) kill(o, true)
        }
        burst(e.x + 4, e.y + 4, 14, '#fff', 130)
      }
    } else hurt()
  }

  // gems
  for (const g of gems) {
    if (g.dead) continue
    const dx = p.x + 3 - g.x, dy = p.y + 4 - g.y
    if (S.magnet && dx * dx + dy * dy < 46 * 46) { const d = Math.hypot(dx, dy) || 1; g.vx += dx / d * 420 * dt; g.vy += dy / d * 420 * dt }
    if (Math.abs(dx) < 6 && Math.abs(dy) < 7) {
      g.dead = true; stardust += (g.big ? 5 : 1) * S.gemMult; sGem()
      parts.push({ x: g.x, y: g.y, vx: 0, vy: -30, life: 0.3, max: 0.3, col: '#ffe14d', g: 0 })
    }
  }

  // level end: standing on the chamber floor
  if (p.onGround && Math.floor((p.y + p.h) / TW) >= floorRow(level) - 1) levelDone()
  if (hp <= 0 && state === 'play') die()
}

function fire() {
  ammo--; fireCd = S.fireDelay; p.firing = 0.07
  p.vy = Math.max(-74, p.vy - S.recoil)
  const n = S.shots
  for (let i = 0; i < n; i++) {
    const off = n === 1 ? (rnd() - 0.5) * 12 : (i - (n - 1) / 2) * S.spread * 1.6
    bullets.push({ x: p.x + 2.5, y: p.y + p.h, vx: off, vy: 250, life: 1.1, pierce: S.pierce ? 3 : 0, hue: (tGlobal * 260 + i * 40) % 360 })
  }
  burst(p.x + 3, p.y + p.h + 1, 3, RAINBOW[(tGlobal * 8 | 0) % 6], 40)
  shake = Math.max(shake, 0.7)
  sShoot()
}

function hurt() {
  if (iFrames > 0 || state !== 'play') return
  if (shield > 0) { shield--; iFrames = 1.1; burst(p.x + 3, p.y + 4, 16, '#68e8ff', 90); popText(p.x, p.y - 6, 'SHIELD!', '#68e8ff'); snd(700, 0.2, 'triangle', 0.06, 0.6); return }
  hp--; iFrames = 1.4; shake = 3; flash = 0.18
  p.vy = -120; p.vx = -p.face * 70
  endCombo()
  burst(p.x + 3, p.y + 4, 14, '#ff4d6d', 110)
  sHurt()
}

function kill(e, byStomp) {
  e.dead = true
  combo++; comboBest = Math.max(comboBest, combo)
  shake = Math.max(shake, byStomp ? 2.2 : 1.2)
  burst(e.x + e.w / 2, e.y + e.h / 2, byStomp ? 12 : 8, RAINBOW[combo % 6], byStomp ? 110 : 80)
  if (combo > 1) popText(e.x, e.y - 4, 'x' + combo, RAINBOW[combo % 6])
  sStomp(Math.min(combo, 10))
  for (let i = 0, n = 1 + (rnd() * 2 | 0); i < n; i++)
    gems.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: (rnd() - 0.5) * 70, vy: -50 - rnd() * 40, t: 0 })
}

function endCombo() {
  if (combo < 2) { combo = 0; return }
  const reward = Math.min(60, combo * (combo + 1) / 2) * S.gemMult | 0
  stardust += reward
  popText(p.x - 8, p.y - 12, 'COMBO ' + combo + '  +' + reward, '#ffe14d')
  if (combo >= 8 && hp < maxHp) { hp++; popText(p.x - 4, p.y - 20, '+HEART', '#ff6ad5') }
  snd(700, 0.25, 'triangle', 0.06, 2.4)
  combo = 0
}

function die() {
  state = 'dead'; dieT = 0; sDie(); shake = 5
  burst(p.x + 3, p.y + 4, 30, '#fff', 150)
  const score = stardust + deepest
  if (score > best) { best = score; try { localStorage.setItem(SAVE, best) } catch (e) { } }
}

//////////////////// bullets / enemies ////////////////////
function updateBullets(dt) {
  for (const b of bullets) {
    b.life -= dt
    const steps = 3
    for (let i = 0; i < steps && !b.dead; i++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps
      const cx = Math.floor(b.x / TW), cy = Math.floor(b.y / TW), t = tile(cx, cy)
      if (t) {
        burst(b.x, b.y, 4, pal().edge, 60); sBreak()
        if (t === 4) { b.dead = true; continue }   // chamber bedrock: never breaks
        if (t === 3) { setTile(cx, cy, 1) }        // hard rock chips first
        else {
          setTile(cx, cy, 0)
          if (t === 2) for (let g = 0; g < 3; g++)
            gems.push({ x: cx * TW + 5, y: cy * TW + 5, vx: (rnd() - 0.5) * 60, vy: -40 - rnd() * 40, t: 0 })
        }
        if (b.pierce > 0) b.pierce--; else b.dead = true
      }
      for (const e of enemies) {
        if (e.dead || b.dead) continue
        if (b.x < e.x || b.x > e.x + e.w || b.y < e.y || b.y > e.y + e.h) continue
        e.hp--; e.hurt = 0.12
        burst(b.x, b.y, 5, '#fff', 70)
        if (e.hp <= 0) kill(e, false); else snd(240, 0.05, 'square', 0.03, 0.7)
        if (b.pierce > 0) b.pierce--; else b.dead = true
      }
      for (const f of foeShots) {
        if (f.dead || b.dead) continue
        if (Math.abs(f.x - b.x) < 4 && Math.abs(f.y - b.y) < 4) { f.dead = true; b.dead = true; burst(f.x, f.y, 6, '#ff9f45', 70) }
      }
    }
    if (b.life <= 0 || b.y > cam.y + VH + 20) b.dead = true
  }
  bullets = bullets.filter(b => !b.dead)
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue
    if (e.y < cam.y - 260) { e.dead = true; continue }
    if (e.y < cam.y - 90 || e.y > cam.y + VH + 110) continue
    e.t += dt; e.hurt = Math.max(0, e.hurt - dt)

    if (e.type === 0) {                                    // gloom blob: walks, turns at ledges
      if (e.hitWall) e.vx = -e.vx
      if (e.onGround) {
        const ahead = e.x + (e.vx > 0 ? e.w + 2 : -2)
        if (!tile(Math.floor(ahead / TW), Math.floor((e.y + e.h + 2) / TW))) e.vx = -e.vx
      }
      e.vy = Math.min(e.vy + 640 * dt, 200)
    } else if (e.type === 1) {                             // drifting wisp
      e.vx = Math.cos(e.t * 1.4) * 26 + Math.sign(p.x - e.x) * 10
      e.vy = Math.sin(e.t * 2.1) * 22 + 8
      if (e.hitWall) e.x += Math.sign(p.x - e.x) * 0.6
    } else if (e.type === 2) {                             // thornback: cannot be stomped
      if (e.hitWall) e.vx = -e.vx
      if (e.onGround) {
        const ahead = e.x + (e.vx > 0 ? e.w + 2 : -2)
        if (!tile(Math.floor(ahead / TW), Math.floor((e.y + e.h + 2) / TW))) e.vx = -e.vx
      }
      e.vy = Math.min(e.vy + 640 * dt, 200)
    } else if (e.type === 3) {                             // shade: hovers, then dives
      const dy = p.y - e.y, dx = p.x - e.x
      if (e.dive > 0) {
        e.dive -= dt
        e.vx += Math.sign(dx) * 190 * dt; e.vy += Math.sign(dy) * 200 * dt
        e.vx *= 0.98; e.vy *= 0.98
      } else {
        e.vx = Math.cos(e.t * 2) * 18; e.vy = Math.sin(e.t * 3) * 16
        if (dy > -20 && dy < 130 && Math.abs(dx) < 90) { e.dive = 1.3; snd(180, 0.14, 'sawtooth', 0.03, 2.2) }
      }
      if (e.hitWall) e.vx = -e.vx * 0.5
    } else if (e.type === 4) {                             // watcher: sits and spits
      e.vy = Math.min(e.vy + 640 * dt, 200); e.vx *= 0.9
      e.cd -= dt
      if (e.cd <= 0 && Math.abs(p.y - e.y) < 140) {
        e.cd = 1.7
        const dx = p.x + 3 - (e.x + 4), dy = p.y + 4 - (e.y + 4), d = Math.hypot(dx, dy) || 1
        foeShots.push({ x: e.x + 4, y: e.y + 4, vx: dx / d * 62, vy: dy / d * 62, life: 4 })
        snd(150, 0.12, 'square', 0.03, 1.4)
      }
    }
    move(e, dt)
  }
  enemies = enemies.filter(e => !e.dead)

  for (const f of foeShots) {
    f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt
    if (f.life <= 0 || tile(Math.floor(f.x / TW), Math.floor(f.y / TW))) { f.dead = true; burst(f.x, f.y, 4, '#ff9f45', 50); continue }
    if (Math.abs(f.x - (p.x + 3)) < 5 && Math.abs(f.y - (p.y + 4)) < 6) { f.dead = true; hurt() }
  }
  foeShots = foeShots.filter(f => !f.dead)
}

function updateStuff(dt) {
  for (const g of gems) {
    if (g.dead) continue
    g.t += dt
    g.vy = Math.min(g.vy + 300 * dt, 160)
    g.vx *= 0.94
    const nx = g.x + g.vx * dt, ny = g.y + g.vy * dt
    if (!tile(Math.floor(nx / TW), Math.floor(g.y / TW))) g.x = nx; else g.vx = -g.vx * 0.4
    if (!tile(Math.floor(g.x / TW), Math.floor(ny / TW))) g.y = ny; else { g.vy = -g.vy * 0.3; if (Math.abs(g.vy) < 12) g.vy = 0 }
    if (g.y < cam.y - 220) g.dead = true
  }
  gems = gems.filter(g => !g.dead)

  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt }
  parts = parts.filter(q => q.life > 0)
  for (const t of texts) { t.life -= dt; t.y -= 18 * dt }
  texts = texts.filter(t => t.life > 0)

  shake = Math.max(0, shake - dt * 9)
  flash = Math.max(0, flash - dt)
}

//////////////////// perks ////////////////////
const PERKS = [
  { id: 'prism', once: 1, n: 'PRISM HOOF', d: 'fire three beams', f: () => { S.shots = 3 } },
  { id: 'deep', n: 'DEEP WELL', d: '+2 rainbow charge', f: () => { maxAmmo += 2; ammo = maxAmmo } },
  { id: 'heart', n: 'GOLDEN HEART', d: '+1 max heart, heal 1', f: () => { maxHp++; hp = Math.min(maxHp, hp + 1) } },
  { id: 'quick', max: 2, n: 'QUICKHOOF', d: '30% faster beams', f: () => { S.fireDelay *= 0.7 } },
  { id: 'pierce', once: 1, n: 'PIERCING LIGHT', d: 'beams punch through', f: () => { S.pierce = 1 } },
  { id: 'magnet', once: 1, n: 'STARDUST PULL', d: 'stardust flies to you', f: () => { S.magnet = 1 } },
  { id: 'shock', once: 1, n: 'THUNDER HOOVES', d: 'stomps blast nearby foes', f: () => { S.shock = 1 } },
  { id: 'cloud', max: 2, n: 'CLOUDWALK', d: 'stronger hover, softer fall', f: () => { S.recoil += 16; S.maxFall -= 30 } },
  { id: 'rich', max: 2, n: 'RICH VEINS', d: 'double stardust', f: () => { S.gemMult *= 2 } },
  { id: 'shield', n: 'AURORA SHIELD', d: 'absorb 1 hit per level', f: () => { S.shieldMax++ } },
]

function levelDone() {
  if (state !== 'play') return
  state = 'perk'
  endCombo()
  const pool = PERKS.filter(k => {
    const got = perksTaken[k.id] || 0
    return k.once ? got < 1 : k.max ? got < k.max : true
  })
  choices = []
  while (choices.length < 3 && pool.length) choices.push(pool.splice(rnd() * pool.length | 0, 1)[0])
  if (stardust >= 30 && hp < maxHp) choices.push({ id: 'buy', n: 'MEND (30 dust)', d: 'refill every heart', cost: 30, f: () => { stardust -= 30; hp = maxHp } })
  snd(520, 0.3, 'triangle', 0.05, 2.6)
}

function choose(i) {
  if (!choices[i]) return
  const k = choices[i]
  if (k.cost && stardust < k.cost) return
  k.f(); perksTaken[k.id] = (perksTaken[k.id] || 0) + 1
  popText(p.x - 10, p.y - 14, k.n, '#ffe14d')
  sPick()
  // open the hatch and drop to the next level
  const fr = floorRow(level)
  for (let cc = 6; cc <= 9; cc++) { setTile(cc, fr, 0); burst(cc * TW + 5, fr * TW + 5, 5, pal().edge, 80) }
  level++
  hp = Math.min(maxHp, hp + 0)
  shield = S.shieldMax
  ammo = maxAmmo
  state = 'play'
}

//////////////////// draw ////////////////////
function rect(px, py, w, h, col) { x.fillStyle = col; x.fillRect(px | 0, py | 0, Math.ceil(w), Math.ceil(h)) }

function drawBack() {
  const P = pal()
  x.fillStyle = P.bg; x.fillRect(0, 0, VW, VH)
  // parallax rainbow bands + far stars
  const off = -cam.y * 0.25
  for (let i = 0; i < 6; i++) {
    const yy = ((off + i * 90) % 540 + 540) % 540 - 60
    x.globalAlpha = 0.10
    rect(0, yy, VW, 16, RAINBOW[i])
    x.globalAlpha = 1
  }
  const s0 = Math.floor(cam.y / 40)
  for (let i = s0; i < s0 + 8; i++) {
    for (let j = 0; j < 4; j++) {
      const sx = ((i * 73 + j * 191) % 151) + 4, sy = i * 40 + ((i * 31 + j * 57) % 40) - cam.y * 0.5
      const yy = ((sy % 400) + 400) % 400 - 40
      x.globalAlpha = 0.5
      rect(sx, yy, 1, 1, '#fff')
      x.globalAlpha = 1
    }
  }
}

function drawWorld() {
  const P = pal()
  const r0 = Math.floor(cam.y / TW) - 1, r1 = Math.ceil((cam.y + VH) / TW) + 1
  for (let r = r0; r <= r1; r++) {
    if (r < 0) continue
    const row = getRow(r), py = r * TW - cam.y
    for (let cc = 0; cc < COLS; cc++) {
      const t = row[cc]
      if (!t) continue
      const px = cc * TW
      if (t === 4) {                                                   // chamber bedrock
        rect(px, py, TW, TW, P.far)
        rect(px, py, TW, 2, RAINBOW[(cc + level) % 6])
        rect(px + 2, py + 4, 6, 2, P.rock)
        continue
      }
      rect(px, py, TW, TW, t === 3 ? P.far : P.rock)
      if (t === 3) { rect(px + 1, py + 1, TW - 2, TW - 2, P.rock); rect(px + 3, py + 3, 4, 4, P.far) }
      if (!tile(cc, r - 1)) rect(px, py, TW, 2, P.edge)               // lit top edge
      if (t === 2) {                                                   // stardust ore
        const h = (r * 37 + cc * 91) % 360
        rect(px + 3, py + 3, 4, 4, `hsl(${h} 90% 70%)`)
        rect(px + 4, py + 4, 2, 2, '#fff')
      }
    }
  }
}

function drawUnicorn() {
  if (iFrames > 0 && ((tGlobal * 22) | 0) % 2) return
  const px = p.x, py = p.y - cam.y
  // rainbow trail while dropping fast
  if (p.vy > 90) for (let i = p.trail.length - 1; i > 0; i--) {
    const t0 = p.trail[i]
    x.globalAlpha = 0.35 * (1 - i / p.trail.length)
    rect(t0.x - 2, t0.y - cam.y, 4, 4, RAINBOW[i % 6])
    x.globalAlpha = 1
  }
  const f = p.face
  rect(px, py + 1, 6, 7, '#fff')                       // body
  rect(px + (f > 0 ? 4 : 0), py, 3, 4, '#fff')          // head
  rect(px + (f > 0 ? 5 : 1), py + 1, 1, 1, '#2b1240')   // eye
  // horn
  rect(px + (f > 0 ? 6 : -1), py - 2, 1, 3, '#ffe14d')
  // mane
  for (let i = 0; i < 4; i++) rect(px + (f > 0 ? 1 : 3), py + i, 2, 1, RAINBOW[i])
  // tail
  for (let i = 0; i < 3; i++) rect(px + (f > 0 ? -1 : 6), py + 2 + i, 1, 1, RAINBOW[(i + 3) % 6])
  // legs / muzzle flash
  if (p.firing > 0) {
    const col = RAINBOW[(tGlobal * 20 | 0) % 6]
    rect(px + 1, py + 8, 4, 4, col)
    rect(px + 2, py + 11, 2, 3, '#fff')
  } else { rect(px + 1, py + 8, 1, 1, '#fff'); rect(px + 4, py + 8, 1, 1, '#fff') }
  // ammo pips above head
  for (let i = 0; i < maxAmmo; i++)
    rect(px - (maxAmmo - 1) + i * 2 - 1, py - 5, 1, 2, i < ammo ? '#ffe14d' : 'rgba(255,255,255,.22)')
}

function drawEnemy(e) {
  const px = e.x, py = e.y - cam.y
  const flashing = e.hurt > 0
  // bright rim: shadow-things must read against a dark shaft
  x.globalAlpha = 0.5
  rect(px - 1, py - 1, e.w + 2, e.h + 2, flashing ? '#fff' : pal().glow)
  x.globalAlpha = 1
  if (e.type === 0) {
    const sq = Math.sin(e.t * 8) * 0.6
    rect(px, py + sq, 8, 7 - sq, flashing ? '#fff' : '#2b1240')
    rect(px + 1, py + 1, 2, 2, flashing ? '#fff' : '#ff4d6d')
    rect(px + 5, py + 1, 2, 2, flashing ? '#fff' : '#ff4d6d')
  } else if (e.type === 1) {
    const b = Math.sin(e.t * 4)
    rect(px, py + b, 7, 5, flashing ? '#fff' : '#3a2160')
    rect(px + 1, py + 5 + b, 5, 2, flashing ? '#fff' : '#241041')
    rect(px + 1, py + 1 + b, 1, 2, '#68e8ff'); rect(px + 5, py + 1 + b, 1, 2, '#68e8ff')
  } else if (e.type === 2) {
    rect(px, py + 2, 8, 6, flashing ? '#fff' : '#4a1030')
    for (let i = 0; i < 4; i++) rect(px + i * 2, py, 1, 3, flashing ? '#fff' : '#ff4d6d')
    rect(px + 2, py + 4, 1, 1, '#ffe14d'); rect(px + 5, py + 4, 1, 1, '#ffe14d')
  } else if (e.type === 3) {
    const w = Math.sin(e.t * 14) * 2
    rect(px, py + 1, 8, 4, flashing ? '#fff' : '#1b1030')
    rect(px - 3, py + 1 - w, 3, 2, flashing ? '#fff' : '#3a2160')
    rect(px + 8, py + 1 + w, 3, 2, flashing ? '#fff' : '#3a2160')
    rect(px + 2, py + 2, 1, 1, '#ff6ad5'); rect(px + 5, py + 2, 1, 1, '#ff6ad5')
  } else {
    rect(px, py, 8, 8, flashing ? '#fff' : '#1b1030')
    rect(px + 1, py + 1, 6, 6, flashing ? '#fff' : '#5b2a86')
    const dx = Math.sign(p.x - e.x), dy = Math.sign(p.y - e.y)
    rect(px + 3 + dx, py + 3 + dy, 2, 2, '#ffe14d')
  }
}

function txt(s, px, py, col, align, size) {
  x.font = 'bold ' + (size || 8) + 'px "Courier New",monospace'
  x.textAlign = align || 'left'; x.textBaseline = 'top'
  x.fillStyle = '#000'; x.globalAlpha = 0.55
  x.fillText(s, px + 1, py + 1)
  x.globalAlpha = 1; x.fillStyle = col || '#fff'
  x.fillText(s, px, py)
}

function drawHud() {
  for (let i = 0; i < maxHp; i++) {
    const hx = 4 + i * 7
    rect(hx, 4, 5, 5, i < hp ? '#ff4d6d' : 'rgba(255,255,255,.18)')
    if (i < hp) rect(hx + 1, 5, 2, 1, '#ff9ec4')
  }
  for (let i = 0; i < shield; i++) rect(4 + i * 5, 11, 4, 2, '#68e8ff')
  txt('*' + stardust, VW - 4, 4, '#ffe14d', 'right')
  txt('L' + (level + 1) + '  ' + deepest + 'm', VW / 2, 4, '#fff', 'center', 7)
  if (combo > 1) txt('x' + combo, VW / 2, 14, RAINBOW[combo % 6], 'center', 10)
}

function drawPanel(title, lines, sub) {
  x.fillStyle = 'rgba(6,4,14,.82)'; x.fillRect(0, 0, VW, VH)
  txt(title, VW / 2, 40, '#fff', 'center', 14)
  let yy = 70
  for (const l of lines) { txt(l[0], VW / 2, yy, l[1] || '#c8c0e0', 'center', 8); yy += 12 }
  if (sub) txt(sub, VW / 2, VH - 26, RAINBOW[(tGlobal * 3 | 0) % 6], 'center', 8)
}

function optionBox(i) { return { x: 12, y: 74 + i * 34, w: VW - 24, h: 28 } }

function drawPerks() {
  x.fillStyle = 'rgba(6,4,14,.86)'; x.fillRect(0, 0, VW, VH)
  txt('LEVEL ' + level + ' CLEARED', VW / 2, 24, '#fff', 'center', 11)
  txt('choose a blessing', VW / 2, 40, '#9b8fc0', 'center', 7)
  choices.forEach((k, i) => {
    const b = optionBox(i), can = !k.cost || stardust >= k.cost
    x.fillStyle = can ? 'rgba(255,255,255,.07)' : 'rgba(255,0,0,.05)'
    x.fillRect(b.x, b.y, b.w, b.h)
    const col = RAINBOW[(i + (tGlobal * 2 | 0)) % 6]
    rect(b.x, b.y, 2, b.h, can ? col : '#553')
    txt((i + 1) + '. ' + k.n, b.x + 6, b.y + 5, can ? '#fff' : '#776', 'left', 8)
    txt(k.d, b.x + 6, b.y + 16, can ? '#a89ecb' : '#665', 'left', 7)
  })
  txt('*' + stardust + '   press 1-' + choices.length + ' or tap', VW / 2, VH - 22, '#ffe14d', 'center', 7)
}

function draw() {
  x.setTransform(1, 0, 0, 1, 0, 0)
  x.fillStyle = '#07050f'; x.fillRect(0, 0, W, H)
  const sh = shake > 0 ? (Math.random() - 0.5) * shake * 2 : 0
  x.setTransform(scale, 0, 0, scale, offX + sh * scale, offY + sh * scale)
  x.beginPath(); x.rect(0, 0, VW, VH); x.save(); x.clip()

  drawBack()
  drawWorld()

  for (const g of gems) {
    const gy = g.y - cam.y, s = g.big ? 5 : 3, h = (g.t * 200 + g.x * 9) % 360
    rect(g.x - s / 2, gy - s / 2 + Math.sin(g.t * 4) * 0.6, s, s, `hsl(${h} 95% 65%)`)
    rect(g.x - 0.5, gy - 0.5, 1, 1, '#fff')
  }
  for (const e of enemies) if (e.y > cam.y - 20 && e.y < cam.y + VH + 20) drawEnemy(e)
  for (const f of foeShots) { rect(f.x - 2, f.y - cam.y - 2, 4, 4, '#ff9f45'); rect(f.x - 1, f.y - cam.y - 1, 2, 2, '#ffe14d') }
  for (const b of bullets) { rect(b.x - 1, b.y - cam.y - 2, 2, 4, `hsl(${b.hue} 95% 62%)`); rect(b.x - 0.5, b.y - cam.y - 1, 1, 2, '#fff') }
  for (const q of parts) { x.globalAlpha = Math.max(0, q.life / q.max); rect(q.x, q.y - cam.y, 2, 2, q.col); x.globalAlpha = 1 }
  if (state !== 'dead') drawUnicorn()
  for (const t of texts) { x.globalAlpha = Math.min(1, t.life * 2); txt(t.s, t.x, t.y - cam.y, t.col, 'left', 7); x.globalAlpha = 1 }

  if (flash > 0) { x.globalAlpha = flash * 2; x.fillStyle = '#ff4d6d'; x.fillRect(0, 0, VW, VH); x.globalAlpha = 1 }
  if (state === 'play' || state === 'perk') drawHud()

  if (state === 'title') {
    x.fillStyle = 'rgba(6,4,14,.75)'; x.fillRect(0, 0, VW, VH)
    for (let i = 0; i < 6; i++) rect(20, 44 + i * 3, VW - 40, 3, RAINBOW[i])
    txt('RAINFALL', VW / 2, 58, '#fff', 'center', 18)
    txt('a unicorn descends', VW / 2, 80, '#9b8fc0', 'center', 7)
    const lines = [
      ['MOVE  arrows / A D', '#c8c0e0'],
      ['JUMP  space  (hold', '#c8c0e0'],
      ['in air = rainbow boots)', '#c8c0e0'],
      ['', ''],
      ['stomp foes, chain combos,', '#a89ecb'],
      ['land to reload the light', '#a89ecb'],
    ]
    let yy = 100
    for (const l of lines) { txt(l[0], VW / 2, yy, l[1], 'center', 7); yy += 11 }
    if (best) txt('BEST ' + best, VW / 2, 178, '#ffe14d', 'center', 8)
    txt('press any key / tap', VW / 2, VH - 30, RAINBOW[(tGlobal * 3 | 0) % 6], 'center', 8)
  }
  if (state === 'perk') drawPerks()
  if (state === 'dead') {
    drawPanel('THE DARK TOOK YOU', [
      ['depth  ' + deepest + 'm', '#fff'],
      ['stardust  ' + stardust, '#ffe14d'],
      ['best combo  x' + comboBest, '#ff6ad5'],
      ['score  ' + (stardust + deepest), '#fff'],
      ['best  ' + best, '#9b8fc0'],
    ], dieT > 0.8 ? 'press any key / tap' : '')
  }

  x.restore()
  // letterbox mask
  x.setTransform(1, 0, 0, 1, 0, 0)
  x.fillStyle = '#07050f'
  x.fillRect(0, 0, W, offY); x.fillRect(0, offY + VH * scale, W, H)
  x.fillRect(0, 0, offX, H); x.fillRect(offX + VW * scale, 0, W, H)
}

//////////////////// menu input ////////////////////
function onPress(k) {
  if (state === 'title') { reset(); return }
  if (state === 'dead' && dieT > 0.8) { reset(); return }
  if (state === 'perk') { const i = '123456'.indexOf(k); if (i >= 0) choose(i) }
}
function onTap(v) {
  if (state === 'title') { reset(); return }
  if (state === 'dead' && dieT > 0.8) { reset(); return }
  if (state === 'perk') choices.forEach((_, i) => {
    const b = optionBox(i)
    if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) choose(i)
  })
}

//////////////////// loop ////////////////////
function update(dt) {
  tGlobal += dt
  if (state === 'play') {
    updatePlayer(dt)
    updateBullets(dt)
    updateEnemies(dt)
    // camera: lead the fall, never let the unicorn off screen
    const target = p.y - VH * 0.36
    cam.y += (target - cam.y) * Math.min(1, dt * 6)
    cam.y = Math.min(cam.y, p.y - 14)
    cam.y = Math.max(cam.y, p.y + p.h - VH + 22)
    cam.y = Math.max(0, cam.y)
    // keep a screen of world generated below, forget what's far above
    const r1 = Math.ceil((cam.y + VH * 2) / TW)
    for (let r = Math.floor(cam.y / TW); r <= r1; r++) getRow(r)
    const cut = Math.floor(cam.y / TW) - 80
    if (cut > 0 && rows.size > 220) for (const r of rows.keys()) if (r < cut) rows.delete(r)
  } else if (state === 'dead') dieT += dt
  updateStuff(dt)
}

let last = 0
requestAnimationFrame(function loop(now) {
  requestAnimationFrame(loop)
  const dt = Math.min((now - last) / 1000, 0.045)
  last = now
  update(dt)
  draw()
})

reset(); state = 'title'
</script>
