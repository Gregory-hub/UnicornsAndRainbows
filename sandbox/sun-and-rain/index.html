<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sun &amp; Rain</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e1c;overflow:hidden;touch-action:none;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
<canvas id=c></canvas>
<script>
"use strict";
//=====================================================================
// SUN & RAIN  —  a rainbow exists only where sunlight and rain overlap
//=====================================================================
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
// beam geometry, recomputed on resize so the sunbeam can always reach the
// whole playfield whatever the aspect ratio
let SUNSX = 40, LEVER = 400, BMIN = -0.6, BMAX = 0.8;
let aim = 0.35, beam = 0.35, drift = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.max(1, (W * DPR) | 0);
  cvs.height = Math.max(1, (H * DPR) | 0);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  LEVER = Math.max(250, W * 0.40);
  SUNSX = W * 0.42 - LEVER;                 // sun sits low-left; unicorn rides at 0.42W
  const A = Math.min(0.95, Math.atan2(H * 0.44, LEVER));
  BMIN = -A * 0.92; BMAX = A;
  aim = Math.max(BMIN, Math.min(BMAX, aim));
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
function hash(n){ const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

const BOW = ['#ff3b6b','#ff9330','#ffdd2e','#4bdd6a','#31c6ff','#4a6bff','#b558ff'];

//---------------------------------------------------------------- audio
let AC = null, master = null, rainGain = null, muted = false, rainLvl = 0;
function initAudio(){
  if (AC) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    // looping rain hiss
    const n = (AC.sampleRate * 2) | 0, b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const s = AC.createBufferSource(); s.buffer = b; s.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.55;
    rainGain = AC.createGain(); rainGain.gain.value = 0;
    s.connect(bp); bp.connect(rainGain); rainGain.connect(master); s.start();
  } catch(e){ AC = null; }
}
function tone(f, d, type, v, f2, delay){
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.04);
  } catch(e){}
}
function noise(d, v, cut){
  if (!AC || muted) return;
  try {
    const n = Math.max(1, (AC.sampleRate * d) | 0), b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(); s.buffer = b;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cut || 1400;
    const g = AC.createGain(); g.gain.value = v;
    s.connect(lp); lp.connect(g); g.connect(master); s.start();
  } catch(e){}
}
const sfx = {
  step(){ tone(rnd(150,200), 0.05, 'triangle', 0.035, 95); },
  land(){ noise(0.12, 0.13, 900); tone(130, 0.1, 'sine', 0.09, 70); },
  form(){ tone(523,0.1,'triangle',0.05); tone(784,0.1,'triangle',0.05,0,0.05); },
  catch2(){ tone(660,0.09,'triangle',0.08); tone(990,0.14,'triangle',0.08,1320,0.06); },
  die(){ noise(0.5, 0.28, 700); tone(320, 0.55, 'sawtooth', 0.1, 55); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.25,'triangle',0.09,0,i*0.11)); }
};

//---------------------------------------------------------------- input
const keys = {};
addEventListener('keydown', e => {
  initAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].indexOf(e.key) >= 0) e.preventDefault();
  keys[e.key.toLowerCase()] = 1;
  const k = e.key.toLowerCase();
  if (k === 'm'){ muted = !muted; if (rainGain) rainGain.gain.value = 0; }
  if (state === 'title' && (k === ' ' || k === 'enter')) start();
  else if ((state === 'dead' || state === 'win') && overT > 0.35 && (k === ' ' || k === 'enter' || k === 'r')) start();
  else if (state === 'play' && k === 'r') start();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });

// pointer 1 drags the cloud, pointer 2 (touch) aims the sunbeam
const ptrs = new Map();
let cloudPtr = -1, aimPtr = -1, mouseActive = false, mx = 0, my = 0;
function onDown(e){
  initAudio();
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, t: e.pointerType });
  if (cloudPtr < 0) cloudPtr = e.pointerId;
  else if (aimPtr < 0) aimPtr = e.pointerId;
  if (e.pointerType !== 'touch'){ mouseActive = true; mx = e.clientX; my = e.clientY; }
  if (state === 'title') start();
  else if ((state === 'dead' || state === 'win') && overT > 0.35) start();
}
function onMove(e){
  const p = ptrs.get(e.pointerId);
  if (p){ p.x = e.clientX; p.y = e.clientY; }
  if (e.pointerType !== 'touch'){ mouseActive = true; mx = e.clientX; my = e.clientY; }
}
function onUp(e){
  ptrs.delete(e.pointerId);
  if (cloudPtr === e.pointerId) cloudPtr = aimPtr, aimPtr = -1;
  else if (aimPtr === e.pointerId) aimPtr = -1;
}
cvs.addEventListener('pointerdown', onDown);
addEventListener('pointermove', onMove);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('wheel', e => { aim = clamp(aim + Math.sign(e.deltaY) * 0.055, BMIN, BMAX); }, { passive: true });
addEventListener('contextmenu', e => e.preventDefault());

//---------------------------------------------------------------- world
const HW   = 78;                      // sunbeam half-width at difficulty 0
const RW   = 95;                      // rain half-width at difficulty 0
const RREACH = 250;                   // how far rain falls below the cloud
// live sizes: the weather itself gets meaner as you go
let hw = HW, rw = RW, band = 130;
const GOAL = 500;                     // metres to the sunset
const MPX  = 1 / 28;                  // metres per pixel

let state = 'title', overT = 0, time = 0, stop = 0;
let camX = 0, shake = 0, shx = 0, shy = 0, flash = 0;
let cx = 0, cy = 0, wind = 0, windPh = 0;
let sunX = 0, sunY = 0;
let islands = [], genX = 0, lastY = 0;
let parts = [], trail = [];
let dist = 0, bonus = 0, score = 0, best = 0;
let u = null, arc = { ok:false }, hadArc = false, air = 0, ridT = 0, noArcT = 0;
let stepT = 0, formCool = 0, lift = 0, liftCool = 0;

try { best = parseInt(localStorage.getItem('sun-and-rain.best') || '0', 10) || 0; } catch(e){ best = 0; }

function reset(){
  time = 0; stop = 0; shake = 0; flash = 0; overT = 0;
  dist = 0; bonus = 0; score = 0;
  islands = []; parts = []; trail = [];
  lastY = Math.round(H * 0.55);
  islands.push({ x: -320, w: 1000, y: lastY, s: 3.1 });
  genX = 680;
  u = { x: 120, y: lastY, vy: 0, g: 1, ph: 0, sq: 1, tilt: 0, on: 1 };
  camX = u.x - W * 0.42;
  cx = u.x + 150; cy = H * 0.34;
  aim = clamp(0.34, BMIN, BMAX); beam = aim; drift = 0; wind = 0; windPh = 0;
  air = 0; ridT = 0; noArcT = 0; hadArc = false; formCool = 0; lift = 0; liftCool = 0;
  genTo(camX + W * 2);
}
function start(){ state = 'play'; reset(); }

function diff(){ return clamp(dist / 460, 0, 1); }

function genTo(x){
  while (genX < x){
    const d = clamp(genX / (460 / MPX), 0, 1);
    const w = rnd(150, 265) * (1 - d * 0.42);
    lastY = clamp(lastY + rnd(-1, 1) * (58 + d * 150), H * 0.26, H * 0.78);
    islands.push({ x: genX, w: w, y: Math.round(lastY), s: Math.random() * 90 });
    genX += w + rnd(155, 235) + d * 245;
  }
}

//------------------------------------------------------- the rainbow arc
// arc = sunbeam centreline clipped to the rain box. This IS the mechanic.
function computeArc(){
  arc.ok = false;
  const cb = Math.cos(beam);
  if (cb < 0.2) return;
  const m = Math.tan(beam), c = hw / cb;        // vertical half-thickness of the beam
  const rx0 = cx - rw, rx1 = cx + rw;           // rain box
  const ry0 = cy + 26, ry1 = Math.min(cy + RREACH, H - 8);
  if (ry1 - ry0 < 70) return;
  // columns of the rain box that the beam actually touches
  const lo = ry0 - c, hi = ry1 + c;
  let xa, xb;
  if (Math.abs(m) < 1e-3){
    if (sunY < lo || sunY > hi) return;
    xa = rx0; xb = rx1;
  } else {
    let p = sunX + (lo - sunY) / m, q = sunX + (hi - sunY) / m;
    if (p > q){ const t = p; p = q; q = t; }
    xa = Math.max(rx0, p); xb = Math.min(rx1, q);
  }
  xa = Math.max(xa, sunX + 40);
  if (xb - xa < 42) return;
  // the bow spans the overlap horizontally: the player owns its height,
  // so a rainbow can be climbed as well as ridden down
  const bow = Math.min(34, (xb - xa) * 0.17);
  const L = sunY + m * ((xa + xb) / 2 - sunX);
  let y = (Math.max(ry0, L - c) + Math.min(ry1, L + c)) / 2;
  y = clamp(y, ry0 + 20 + bow, Math.max(ry0 + 20 + bow, ry1 - 8));
  arc.ok = true; arc.x0 = xa; arc.x1 = xb; arc.y = y; arc.bow = bow;
}
function arcCentre(x){                       // y of the rainbow ribbon centre
  if (!arc.ok || x < arc.x0 || x > arc.x1) return null;
  const t = (x - arc.x0) / Math.max(1e-3, arc.x1 - arc.x0);
  return arc.y - arc.bow * Math.sin(Math.PI * t);
}
function arcSurface(x){ const c = arcCentre(x); return c === null ? null : c - 17; }

//---------------------------------------------------------------- particles
function pop(x, y, n, col, spd, life, size, gr){
  for (let i = 0; i < n; i++){
    if (parts.length > 460) break;
    const a = Math.random() * 6.2832, s = spd * (0.3 + Math.random() * 0.9);
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.25,
      l: life * (0.6 + Math.random() * 0.7), m: life, c: col || BOW[(Math.random()*7)|0],
      r: size * (0.5 + Math.random()), g: gr === undefined ? 620 : gr });
  }
}
function updParts(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.l -= dt; if (p.l <= 0){ parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.vx *= 0.99;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

//---------------------------------------------------------------- update
function update(dt){
  time += dt;
  const d = diff();
  sunX = camX + SUNSX; sunY = H * 0.46;
  hw = HW - d * 26; rw = RW - d * 30; band = 130 - d * 52;

  //--- sunbeam: player aim vs. its own drift ---------------------------
  let ak = 0;
  if (keys['arrowup'] || keys['w']) ak -= 1;
  if (keys['arrowdown'] || keys['s']) ak += 1;
  if (state === 'play' || state === 'title') aim = clamp(aim + ak * 1.05 * dt, BMIN, BMAX);
  if (aimPtr >= 0){
    const p = ptrs.get(aimPtr);
    if (p) aim = clamp(Math.atan2(p.y - sunY, Math.max(30, p.x - 74)), BMIN, BMAX);
  }
  const dAmp = (state === 'play' ? d : 0) * 0.38;
  drift = Math.sin(time * (0.55 + d * 0.95)) * dAmp + Math.sin(time * 1.9 + 2) * dAmp * 0.35;
  beam = lerp(beam, clamp(aim + drift, BMIN - 0.15, BMAX + 0.15), 1 - Math.exp(-16 * dt));

  //--- raincloud: pointer spring vs. wind ------------------------------
  let tx = cx, ty = cy, dragging = false;
  const cp = cloudPtr >= 0 ? ptrs.get(cloudPtr) : null;
  if (cp && cp.t === 'touch'){ tx = cp.x + camX; ty = cp.y; dragging = true; }
  else if (mouseActive){ tx = mx + camX; ty = my; dragging = true; }
  if (dragging){
    ty = clamp(ty, 66, H * 0.72);
    const k = 1 - Math.exp(-9 * dt);     // soft spring: wind can hold the cloud off target
    cx = lerp(cx, tx, k);
    cy = lerp(cy, ty, k);
  }
  windPh += dt * (0.35 + d * 0.55);
  wind = (Math.sin(windPh) * 0.7 + Math.sin(windPh * 2.3 + 1.7) * 0.3) * (state === 'play' ? d : 0) * 345;
  cx += wind * dt;
  cy = clamp(cy, 66, H * 0.72);

  computeArc();
  if (arc.ok && !hadArc && formCool <= 0){ sfx.form(); formCool = 0.35; flash = Math.max(flash, 0.18); }
  formCool -= dt;
  hadArc = arc.ok;

  //--- the unicorn -----------------------------------------------------
  if (state === 'play'){
    const spd = 200 + d * 290;
    u.x += spd * dt;
    dist = Math.max(dist, (u.x - 120) * MPX);
    genTo(camX + W * 2.2);
    while (islands.length && islands[0].x + islands[0].w < camX - 400) islands.shift();

    const prev = u.y;
    u.vy += 1900 * dt;
    u.y += u.vy * dt;

    // gather candidate surfaces at the unicorn's x
    let land = null, kind = 0;
    const as = arcSurface(u.x);
    const cand = [];
    for (let i = 0; i < islands.length; i++){
      const it = islands[i];
      if (u.x >= it.x - 2 && u.x <= it.x + it.w + 2) cand.push([it.y, 1]);
    }
    if (as !== null) cand.push([as, 2]);
    for (let i = 0; i < cand.length; i++){
      const sy = cand[i][0];
      const cross = prev <= sy + 0.5 && u.y >= sy;
      const stick = u.g && u.y >= sy - 30 && u.y <= sy + 30;
      if (cross || stick){ if (land === null || sy < land){ land = sy; kind = cand[i][1]; } }
    }

    const wasG = u.g;
    if (land !== null){
      const impact = u.vy;
      u.y = land; u.vy = 0; u.g = 1; u.on = kind;
      if (!wasG){
        u.sq = 0.62;
        shake = Math.max(shake, kind === 2 ? 7 : 5);
        if (air > 0.22){
          if (kind === 2){ sfx.catch2(); stop = Math.max(stop, 0.055); flash = Math.max(flash, 0.3);
            pop(u.x, u.y, 22, null, 190, 0.55, 3.4, 380); }
          else { sfx.land(); pop(u.x, u.y, 12, 'rgba(230,236,255,0.9)', 130, 0.4, 3, 500); }
        }
        void impact;
      }
      air = 0;
      if (kind === 2){ ridT += dt; bonus += dt * 34; }
      else ridT = 0;
      u.ph += dt * spd * 0.045;
      stepT -= dt;
      if (stepT <= 0){
        stepT = 44 / spd;
        sfx.step();
        pop(u.x - 14, u.y, 2, kind === 2 ? null : 'rgba(220,230,255,0.75)', 60, 0.34, 2.4, 300);
      }
    } else {
      u.g = 0; ridT = 0; air += dt;
      // buoyancy: inside the glowing overlap the light carries the unicorn
      // back up to the ribbon. The rainbow is a volume, not just a line.
      const asf = arcSurface(u.x);
      if (asf !== null && u.y > asf && u.y < asf + band){
        const f = clamp((u.y - asf) / 30, 0.25, 1);   // soft near the ribbon, strong deep down
        u.vy -= 3900 * f * dt;
        if (u.vy < -620) u.vy = -620;
        lift = Math.min(1, lift + dt * 5);
        if (Math.random() < 0.45) pop(u.x + rnd(-16, 16), u.y - rnd(0, 24), 1, null, 30, 0.45, 2.6, -300);
        if (liftCool <= 0){ liftCool = 0.22; tone(rnd(700, 900), 0.1, 'sine', 0.045, 1400); }
      }
    }
    liftCool -= dt; lift = Math.max(0, lift - dt * 3);

    if (!u.g && lift <= 0) noArcT += dt; else noArcT = 0;

    // trail
    trail.push({ x: u.x, y: u.y - 30, r: u.on === 2 && u.g ? 1 : 0 });
    if (trail.length > 30) trail.shift();

    u.sq += (1 - u.sq) * (1 - Math.exp(-14 * dt));
    u.tilt = lerp(u.tilt, u.g ? clamp((arc.ok && u.on === 2 ? slopeAt(u.x) : 0) * 0.55, -0.45, 0.45)
                              : clamp(u.vy / 2600, -0.35, 0.5), 1 - Math.exp(-10 * dt));

    if (dist >= GOAL){
      state = 'win'; overT = 0; stop = 0.12; shake = 14; flash = 0.6; sfx.win();
      for (let i = 0; i < 6; i++) pop(u.x + rnd(-60,60), u.y - rnd(0,90), 26, null, 300, 1.3, 4, 420);
      saveBest();
    } else if (u.y > H + 90){
      state = 'dead'; overT = 0; stop = 0.15; shake = 22; flash = 0.35; sfx.die();
      pop(u.x, Math.min(u.y, H + 40), 46, null, 300, 1.0, 4, 500);
      saveBest();
    }
  } else {
    // title / game-over idle
    u.ph += dt * 3;
    u.sq += (1 - u.sq) * (1 - Math.exp(-14 * dt));
  }

  score = Math.floor(dist + bonus);

  const tcam = u.x - W * 0.42;
  camX = lerp(camX, tcam, 1 - Math.exp(-6.5 * dt));
  updParts(dt);

  if (rainGain && AC){
    const want = muted ? 0 : (0.035 + (arc.ok ? 0.05 : 0));
    rainLvl = lerp(rainLvl, want, 1 - Math.exp(-4 * dt));
    try { rainGain.gain.value = rainLvl; } catch(e){}
  }
}
function slopeAt(x){
  const a = arcSurface(x - 6), b = arcSurface(x + 6);
  return (a === null || b === null) ? 0 : (b - a) / 12;
}
let newBest = false;
function saveBest(){
  newBest = score > best;
  if (newBest){ best = score; try { localStorage.setItem('sun-and-rain.best', String(best)); } catch(e){} }
}

//---------------------------------------------------------------- drawing
function stripPath(){
  const dx = Math.cos(beam), dy = Math.sin(beam), nx = -dy, ny = dx, L = 5000;
  ctx.beginPath();
  ctx.moveTo(sunX + nx * hw, sunY + ny * hw);
  ctx.lineTo(sunX + nx * hw + dx * L, sunY + ny * hw + dy * L);
  ctx.lineTo(sunX - nx * hw + dx * L, sunY - ny * hw + dy * L);
  ctx.lineTo(sunX - nx * hw, sunY - ny * hw);
  ctx.closePath();
}
function rainRect(){
  const y0 = cy + 26, y1 = Math.min(cy + RREACH, H - 8);
  return [cx - rw, y0, rw * 2, Math.max(0, y1 - y0)];
}

function drawSky(){
  const d = diff(), p = clamp(dist / GOAL, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    'hsl(' + (232 - p * 18) + ' 58% ' + (13 + p * 4) + '%)');
  g.addColorStop(0.42, 'hsl(' + (208 - p * 30) + ' 55% ' + (30 + p * 6) + '%)');
  g.addColorStop(0.78, 'hsl(' + (32 - p * 12) + ' ' + (52 + p * 22) + '% ' + (40 + p * 8) + '%)');
  g.addColorStop(1,    'hsl(' + (14 - p * 8) + ' ' + (58 + p * 20) + '% ' + (28 + p * 6) + '%)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  void d;
}
function drawBgClouds(){
  const par = 0.22, ox = camX * par;
  const i0 = Math.floor((ox - 200) / 340), i1 = Math.ceil((ox + W + 200) / 340);
  ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = '#dfe8ff';
  for (let i = i0; i <= i1; i++){
    const bx = i * 340 + hash(i) * 180 - ox;
    const by = 110 + hash(i + 9) * (H * 0.55);
    const sc = 0.6 + hash(i + 3) * 1.1;
    ctx.beginPath();
    for (let j = 0; j < 5; j++){
      const a = j / 5;
      ctx.arc(bx + (a - 0.4) * 130 * sc, by + Math.sin(a * 5 + i) * 12 * sc, (22 + hash(i * 5 + j) * 26) * sc, 0, 6.3);
    }
    ctx.fill();
  }
  // wind streaks
  if (Math.abs(wind) > 60){
    ctx.globalAlpha = clamp(Math.abs(wind) / 900, 0, 0.4);
    ctx.strokeStyle = '#eaf1ff'; ctx.lineWidth = 1.6;
    for (let i = 0; i < 26; i++){
      const yy = hash(i * 3.7) * H;
      const xx = ((hash(i) * W + time * wind * 0.9) % (W + 260) + W + 260) % (W + 260) - 130;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + wind * 0.06, yy); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawSun(){
  const g = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 190);
  g.addColorStop(0, 'rgba(255,246,200,0.95)');
  g.addColorStop(0.25, 'rgba(255,214,110,0.35)');
  g.addColorStop(1, 'rgba(255,190,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sunX, sunY, 190, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(sunX, sunY, 30, 0, 6.3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,236,160,0.6)'; ctx.lineWidth = 2;
  for (let i = 0; i < 10; i++){
    const a = i / 10 * 6.283 + time * 0.25, r0 = 38 + Math.sin(time * 2 + i) * 3;
    ctx.beginPath();
    ctx.moveTo(sunX + Math.cos(a) * r0, sunY + Math.sin(a) * r0);
    ctx.lineTo(sunX + Math.cos(a) * (r0 + 13), sunY + Math.sin(a) * (r0 + 13));
    ctx.stroke();
  }
}
function drawBeam(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const dx = Math.cos(beam), dy = Math.sin(beam);
  const g = ctx.createLinearGradient(sunX, sunY, sunX + dx * 1600, sunY + dy * 1600);
  g.addColorStop(0, 'rgba(255,232,150,0.36)');
  g.addColorStop(0.5, 'rgba(255,220,130,0.19)');
  g.addColorStop(1, 'rgba(255,210,120,0.06)');
  ctx.fillStyle = g; stripPath(); ctx.fill();
  // motes drifting along the beam
  ctx.fillStyle = 'rgba(255,246,200,0.55)';
  const nx = -dy, ny = dx;
  for (let i = 0; i < 38; i++){
    const t = ((hash(i) * 1400 + time * (40 + hash(i + 2) * 90)) % 1500);
    const o = (hash(i + 7) * 2 - 1) * HW * 0.85;
    const px = sunX + dx * t + nx * o, py = sunY + dy * t + ny * o;
    if (px < camX - 40 || px > camX + W + 40 || py > H + 20) continue;
    ctx.globalAlpha = 0.5 * (1 - t / 1500);
    ctx.fillRect(px, py, 2.2, 2.2);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // beam edges — makes the region unmistakable
  ctx.save();
  ctx.strokeStyle = 'rgba(255,238,170,0.45)'; ctx.lineWidth = 1.6;
  stripPath(); ctx.stroke();
  ctx.restore();
}
function drawIslands(){
  for (let i = 0; i < islands.length; i++){
    const it = islands[i];
    if (it.x + it.w < camX - 100 || it.x > camX + W + 100) continue;
    ctx.save();
    // fluffy underside
    ctx.fillStyle = 'rgba(120,132,190,0.55)';
    ctx.beginPath();
    const n = Math.max(3, (it.w / 46) | 0);
    for (let j = 0; j <= n; j++){
      const a = j / n;
      const r = 26 + hash(it.s + j) * 20;
      ctx.arc(it.x + a * it.w, it.y + 20 + Math.sin(a * 3 + it.s) * 10, r, 0, 6.3);
    }
    ctx.fill();
    // solid flat top — this is the safe ground
    const g = ctx.createLinearGradient(0, it.y, 0, it.y + 30);
    g.addColorStop(0, '#f4f7ff'); g.addColorStop(1, '#c3ccf0');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(it.x, it.y, it.w, 26, 8);
    else ctx.rect(it.x, it.y, it.w, 26);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fillRect(it.x, it.y, it.w, 3);
    ctx.restore();
  }
}
function drawRain(){
  const r = rainRect(); if (r[3] <= 0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(r[0], r[1], r[2], r[3]); ctx.clip();
  const g = ctx.createLinearGradient(0, r[1], 0, r[1] + r[3]);
  g.addColorStop(0, 'rgba(120,170,255,0.30)');
  g.addColorStop(0.75, 'rgba(90,140,240,0.18)');
  g.addColorStop(1, 'rgba(90,140,240,0.02)');
  ctx.fillStyle = g; ctx.fillRect(r[0], r[1], r[2], r[3]);
  const slant = wind * 0.06;
  ctx.strokeStyle = 'rgba(200,226,255,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 54; i++){
    const px = r[0] + hash(i) * r[2];
    const py = r[1] + ((hash(i + 5) * r[3] + time * (420 + hash(i + 3) * 300)) % r[3]);
    ctx.moveTo(px, py); ctx.lineTo(px + slant * 0.05 + 1.2, py + 15);
  }
  ctx.stroke();
  ctx.restore();
  // crisp rain-box boundary
  ctx.save();
  ctx.strokeStyle = 'rgba(170,210,255,0.55)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([7, 6]); ctx.lineDashOffset = -time * 22;
  ctx.strokeRect(r[0], r[1], r[2], r[3]);
  ctx.setLineDash([]);
  ctx.restore();
}
function drawOverlap(){
  const r = rainRect(); if (r[3] <= 0) return;
  // bright wash exactly where beam ∩ rain
  ctx.save();
  ctx.beginPath(); ctx.rect(r[0], r[1], r[2], r[3]); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  const pu = 0.5 + Math.sin(time * 7) * 0.08;
  ctx.fillStyle = 'rgba(255,255,255,' + (0.16 * pu + 0.10) + ')';
  stripPath(); ctx.fill();
  ctx.restore();
  // outline the overlap quad from both sides
  ctx.save();
  ctx.lineWidth = 2.4; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.rect(r[0], r[1], r[2], r[3]); ctx.clip();
  stripPath(); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.lineWidth = 2.4; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  stripPath(); ctx.clip();
  ctx.strokeRect(r[0], r[1], r[2], r[3]);
  ctx.restore();
}
function drawArc(){
  if (!arc.ok) return;
  const N = 26, pts = [];
  for (let i = 0; i <= N; i++){
    const x = arc.x0 + (arc.x1 - arc.x0) * (i / N);
    pts.push([x, arcCentre(x)]);
  }
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // halo
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 52;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  // seven bands
  const bw = 5;
  for (let b = 0; b < 7; b++){
    ctx.strokeStyle = BOW[b]; ctx.lineWidth = bw + 0.6;
    const off = (b - 3) * bw;
    ctx.beginPath();
    for (let i = 0; i <= N; i++){ const p = pts[i]; if (i) ctx.lineTo(p[0], p[1] + off); else ctx.moveTo(p[0], p[1] + off); }
    ctx.stroke();
  }
  // walk-line highlight on top of the ribbon
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= N; i++){ const p = pts[i]; if (i) ctx.lineTo(p[0], p[1] - 18); else ctx.moveTo(p[0], p[1] - 18); }
  ctx.stroke();
  ctx.restore();
  // sparkle along the arc
  if (Math.random() < 0.5){
    const t = Math.random(), sx2 = arc.x0 + (arc.x1 - arc.x0) * t;
    pop(sx2, arcCentre(sx2) - 16, 1, null, 40, 0.5, 2.2, -40);
  }
}
function drawCloud(){
  ctx.save();
  ctx.translate(cx, cy);
  const tl = clamp(wind / 900, -0.25, 0.25);
  ctx.rotate(tl * 0.4);
  ctx.fillStyle = 'rgba(74,86,132,0.9)';
  ctx.beginPath();
  ctx.arc(-46, 6, 26, 0, 6.3); ctx.arc(-14, -8, 34, 0, 6.3);
  ctx.arc(22, -2, 29, 0, 6.3); ctx.arc(52, 8, 22, 0, 6.3);
  ctx.fill();
  ctx.fillStyle = 'rgba(150,164,214,0.95)';
  ctx.beginPath();
  ctx.arc(-40, -4, 20, 0, 6.3); ctx.arc(-10, -18, 27, 0, 6.3); ctx.arc(22, -12, 22, 0, 6.3);
  ctx.fill();
  ctx.restore();
}
function drawTrail(){
  if (trail.length < 3) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
  for (let b = 0; b < 4; b++){
    ctx.strokeStyle = BOW[b * 2];
    ctx.lineWidth = 5 - b * 0.7;
    const off = (b - 1.5) * 6;
    for (let i = 1; i < trail.length; i++){
      const p0 = trail[i - 1], p1 = trail[i], a = i / trail.length;
      ctx.globalAlpha = a * a * (p1.r ? 0.6 : 0.18);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y + off); ctx.lineTo(p1.x, p1.y + off);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.restore();
}
function drawUnicorn(){
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.rotate(u.tilt);
  const sy = u.sq, sx = 2 - u.sq;
  ctx.scale(sx, sy);
  const ph = u.ph, grounded = u.g;
  // legs
  ctx.strokeStyle = '#f2f4ff'; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
  const legs = [[-17, 0], [-11, 2.1], [12, 3.2], [18, 1.1]];
  for (let i = 0; i < legs.length; i++){
    const bx = legs[i][0], o = legs[i][1];
    let fx, fy;
    if (grounded){ fx = bx + Math.sin(ph + o) * 10; fy = -Math.max(0, Math.sin(ph + o)) * 9; }
    else { fx = bx + (i < 2 ? -8 : 9); fy = -6; }
    ctx.beginPath(); ctx.moveTo(bx, -24); ctx.lineTo(fx * 0.6 + bx * 0.4, -13); ctx.lineTo(fx, fy); ctx.stroke();
  }
  // tail
  ctx.lineWidth = 3.4;
  for (let i = 0; i < 7; i++){
    ctx.strokeStyle = BOW[i];
    const w = Math.sin(time * 7 + i * 0.5) * 4;
    ctx.beginPath();
    ctx.moveTo(-24, -38 + i * 1.6);
    ctx.quadraticCurveTo(-38, -34 + i * 2.4 + w, -46 - i * 1.4, -18 + i * 2.6 + w);
    ctx.stroke();
  }
  // body
  ctx.fillStyle = '#fbfcff';
  ctx.beginPath(); ctx.ellipse(-2, -33, 25, 17, -0.06, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(196,206,246,0.55)';
  ctx.beginPath(); ctx.ellipse(-2, -26, 22, 9, -0.06, 0, 6.3); ctx.fill();
  // neck + head
  ctx.fillStyle = '#fbfcff';
  ctx.beginPath();
  ctx.moveTo(10, -42); ctx.lineTo(22, -60); ctx.lineTo(33, -58); ctx.lineTo(24, -34); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(30, -56, 13, 9.5, -0.35, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(39, -50, 6.5, 5, -0.3, 0, 6.3); ctx.fill();
  // ear
  ctx.beginPath(); ctx.moveTo(24, -64); ctx.lineTo(22, -73); ctx.lineTo(30, -66); ctx.closePath(); ctx.fill();
  // horn
  const hg = ctx.createLinearGradient(30, -64, 46, -84);
  hg.addColorStop(0, '#ffe89a'); hg.addColorStop(1, '#ffb43a');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.moveTo(29, -63); ctx.lineTo(36, -64); ctx.lineTo(46, -86); ctx.closePath(); ctx.fill();
  // mane
  ctx.lineWidth = 3.6;
  for (let i = 0; i < 7; i++){
    ctx.strokeStyle = BOW[i];
    const w = Math.sin(time * 8 - i * 0.6) * 3;
    ctx.beginPath();
    ctx.moveTo(20 - i * 1.6, -62 + i * 2.2);
    ctx.quadraticCurveTo(8 - i * 2, -58 + i * 2.6 + w, -2 - i * 2.4, -48 + i * 2.2 + w);
    ctx.stroke();
  }
  // eye
  ctx.fillStyle = '#2a2f52';
  ctx.beginPath(); ctx.arc(33, -57, 2.3, 0, 6.3); ctx.fill();
  ctx.restore();

  // panic mark when airborne with no rainbow anywhere
  if (state === 'play' && noArcT > 0.18){
    const a = clamp((noArcT - 0.18) * 4, 0, 1) * (0.6 + Math.sin(time * 16) * 0.4);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#ff5470'; ctx.font = 'bold 30px ui-sans-serif,system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('!', u.x, u.y - 96);
    ctx.restore();
  }
}
function drawParts(){
  ctx.save();
  for (let i = 0; i < parts.length; i++){
    const p = parts[i], a = clamp(p.l / p.m, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    const s = p.r * (0.4 + a * 0.9);
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.restore();
}

//---------------------------------------------------------------- HUD
function txt(s, x, y, size, col, align, weight){
  ctx.font = (weight || 700) + ' ' + size + 'px ui-sans-serif,system-ui,"Segoe UI",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function shadowTxt(s, x, y, size, col, align, weight){
  txt(s, x + 2, y + 2, size, 'rgba(6,10,26,0.55)', align, weight);
  txt(s, x, y, size, col, align, weight);
}
function drawHUD(){
  // progress to sunset
  const p = clamp(dist / GOAL, 0, 1);
  ctx.fillStyle = 'rgba(10,14,32,0.45)'; ctx.fillRect(0, 0, W, 5);
  const g = ctx.createLinearGradient(0, 0, W, 0);
  for (let i = 0; i < 7; i++) g.addColorStop(i / 6, BOW[i]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * p, 5);

  shadowTxt(String(score), 20, 52, 38, '#fff');
  shadowTxt(Math.floor(dist) + ' / ' + GOAL + ' m', 20, 74, 14, 'rgba(255,255,255,0.72)', 'left', 600);
  shadowTxt('BEST ' + best, W - 20, 40, 17, 'rgba(255,255,255,0.8)', 'right', 700);
  if (ridT > 0.15){
    const a = clamp(ridT, 0, 1);
    shadowTxt('RAINBOW RIDE +' + Math.floor(bonus), W - 20, 64, 14,
      'rgba(255,255,255,' + (0.5 + a * 0.5) + ')', 'right', 700);
  }
  // wind gauge
  const d = diff();
  if (d > 0.06){
    const wx = W / 2, wy = 30, ww = 110;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(wx - ww, wy); ctx.lineTo(wx + ww, wy); ctx.stroke();
    ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + clamp(wind / 345, -1, 1) * ww, wy); ctx.stroke();
    ctx.restore();
    shadowTxt('WIND', wx, wy + 22, 11, 'rgba(255,255,255,0.5)', 'center', 700);
  }
}
function panel(a){
  ctx.fillStyle = 'rgba(8,11,28,' + (0.55 * a) + ')';
  ctx.fillRect(0, 0, W, H);
}
function drawTitle(){
  panel(1);
  const cxm = W / 2, base = H * 0.30;
  const t = 'SUN & RAIN';
  ctx.save();
  ctx.font = '800 ' + Math.min(74, W / 9) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign = 'center';
  const g = ctx.createLinearGradient(cxm - 220, 0, cxm + 220, 0);
  for (let i = 0; i < 7; i++) g.addColorStop(i / 6, BOW[i]);
  ctx.fillStyle = 'rgba(6,10,26,0.6)'; ctx.fillText(t, cxm + 3, base + 3);
  ctx.fillStyle = g; ctx.fillText(t, cxm, base);
  ctx.restore();
  shadowTxt('a rainbow exists only where sunlight and rain overlap', cxm, base + 38, 17, 'rgba(255,255,255,0.85)', 'center', 600);
  shadowTxt('— and it is the only ground —', cxm, base + 62, 15, 'rgba(255,255,255,0.55)', 'center', 600);

  const L = [
    'MOVE MOUSE / DRAG  →  steer the raincloud',
    'W  S   or   ↑ ↓   or  WHEEL  →  angle the sunbeam',
    'the unicorn runs on its own. keep a rainbow under it.',
    'a falling unicorn is carried back up inside the glow',
    'M  mute      R  restart'
  ];
  for (let i = 0; i < L.length; i++)
    shadowTxt(L[i], cxm, base + 116 + i * 25, 15, i < 2 ? '#ffe9a8' : 'rgba(255,255,255,0.7)', 'center', 600);

  const pulse = 0.6 + Math.sin(time * 4) * 0.4;
  shadowTxt('CLICK  or  SPACE  to run', cxm, H * 0.82, 24, 'rgba(255,255,255,' + pulse + ')', 'center', 800);
  if (best) shadowTxt('BEST ' + best, cxm, H * 0.82 + 30, 15, 'rgba(255,255,255,0.5)', 'center', 600);
}
function drawOver(){
  const a = clamp(overT * 2.2, 0, 1), e = easeOut(a);
  panel(e);
  const cxm = W / 2, y = H * 0.36 + (1 - e) * 30;
  const win = state === 'win';
  ctx.save();
  ctx.font = '800 ' + Math.min(62, W / 10) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.globalAlpha = e;
  if (win){
    const g = ctx.createLinearGradient(cxm - 200, 0, cxm + 200, 0);
    for (let i = 0; i < 7; i++) g.addColorStop(i / 6, BOW[i]);
    ctx.fillStyle = g; ctx.fillText('SUNSET REACHED', cxm, y);
  } else {
    ctx.fillStyle = '#ff5470'; ctx.fillText('THE RAINBOW FADED', cxm, y);
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha = e;
  shadowTxt('SCORE  ' + score, cxm, y + 56, 30, '#fff', 'center', 800);
  shadowTxt(Math.floor(dist) + ' m travelled', cxm, y + 84, 16, 'rgba(255,255,255,0.7)', 'center', 600);
  shadowTxt(newBest ? 'NEW BEST!' : 'BEST ' + best, cxm, y + 110, 16,
    newBest ? '#ffdd2e' : 'rgba(255,255,255,0.55)', 'center', 700);
  if (overT > 0.35){
    const pulse = 0.6 + Math.sin(time * 5) * 0.4;
    shadowTxt('CLICK / SPACE / R  to run again', cxm, H * 0.78, 20, 'rgba(255,255,255,' + pulse + ')', 'center', 800);
  }
  ctx.restore();
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky();
  ctx.save();
  ctx.translate(shx, shy);
  drawBgClouds();
  ctx.translate(-camX, 0);
  drawBeam();
  drawIslands();
  drawRain();
  drawOverlap();
  drawArc();
  drawTrail();
  drawUnicorn();
  drawParts();
  drawCloud();
  drawSun();
  ctx.restore();

  // danger vignette
  if (noArcT > 0.1 && state === 'play'){
    const a = clamp((noArcT - 0.1) * 1.3, 0, 0.5);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,60,90,0)'); g.addColorStop(1, 'rgba(255,40,80,' + a + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.55) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (state !== 'title') drawHUD();
  if (state === 'title') drawTitle();
  else if (state === 'dead' || state === 'win') drawOver();
  if (muted) shadowTxt('MUTED', W - 20, H - 16, 12, 'rgba(255,255,255,0.4)', 'right', 600);
}

//---------------------------------------------------------------- loop
reset();
let last = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!last){ last = now; return; }
  const rdt = Math.min((now - last) / 1000, 0.05); last = now;

  if (state === 'dead' || state === 'win') overT += rdt;
  shake *= Math.exp(-6 * rdt);
  shx = (Math.random() * 2 - 1) * shake;
  shy = (Math.random() * 2 - 1) * shake;
  flash = Math.max(0, flash - rdt * 3);

  if (stop > 0){ stop -= rdt; time += rdt * 0.15; }
  else update(rdt);

  draw();
}
requestAnimationFrame(loop);
</script>
