<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RAINFALL FLY UP</title>
<style>
  html,body{margin:0;height:100%;background:#07050f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
</style>
<canvas id=c></canvas>
<script>
'use strict'
// RAINFALL FLY UP — autofly up a shaft. Horn shots go up with downward recoil.

//////////////////// constants ////////////////////
const TW = 18
const COLS = 9
const VW = COLS * TW
const VH = 240
const FLY = 155
const FLY_ACCEL = 210
const HIT_RECOIL = 24
const RECOIL = 62
const FIRE_DELAY = 0.1
const AMMO_REGEN = 0.4
const HORN_H = 10
const HORN_INSET = 2
const SAVE = 'rainfall-fly-up_best'

const c = document.getElementById('c'), x = c.getContext('2d')
let W = 0, H = 0, scale = 1, offX = 0, offY = 0
function resize() {
  W = c.width = innerWidth; H = c.height = innerHeight
  scale = Math.max(0.5, Math.floor(Math.min(W / VW, H / VH) * 2) / 2)
  offX = ((W - VW * scale) / 2) | 0
  offY = ((H - VH * scale) / 2) | 0
}
onresize = resize; resize()

const PALS = [
  { bg: '#150a24', far: '#241041', rock: '#5b2a86', edge: '#a45ee5', glow: '#ff6ad5' },
  { bg: '#0b1430', far: '#12224d', rock: '#274a8f', edge: '#4f9be8', glow: '#68e8ff' },
  { bg: '#0a2018', far: '#0f3326', rock: '#1c6b45', edge: '#3fd08a', glow: '#c8ff6a' },
  { bg: '#2a1208', far: '#40200c', rock: '#8a4416', edge: '#e08a34', glow: '#ffd76a' },
  { bg: '#230a18', far: '#3b1029', rock: '#8c1f4d', edge: '#e05286', glow: '#ff9ec4' },
  { bg: '#0d0d1c', far: '#171733', rock: '#3a3a6b', edge: '#8686c4', glow: '#ffffff' },
]
const pal = () => PALS[(Math.floor(highest / 80) || 0) % PALS.length]
const RAINBOW = ['#ff4d6d', '#ff9f45', '#ffe14d', '#5ce65c', '#4dc8ff', '#9b6bff']

//////////////////// audio ////////////////////
let ac = null, muted = false
function audioInit() {
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A() }
  if (ac && ac.state === 'suspended') ac.resume()
}
function snd(freq, dur, type, vol, slide) {
  if (!ac || muted) return
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain()
  o.type = type || 'square'
  o.frequency.setValueAtTime(freq, t)
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur)
  g.gain.setValueAtTime(vol || 0.05, t)
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  o.connect(g); g.connect(ac.destination)
  o.start(t); o.stop(t + dur + 0.02)
}
const sShoot = () => snd(620 + Math.random() * 80, 0.06, 'square', 0.025, 0.4)
const sBreak = () => snd(180, 0.07, 'sawtooth', 0.03, 0.45)
const sHard = () => snd(140, 0.12, 'sawtooth', 0.05, 0.35)
const sHurt = () => snd(220, 0.28, 'sawtooth', 0.09, 0.25)
const sDie = () => snd(300, 0.9, 'sawtooth', 0.1, 0.08)

//////////////////// input ////////////////////
const keys = {}
onkeydown = e => {
  if (e.repeat) return
  audioInit()
  keys[e.key.toLowerCase()] = 1
  if (['arrowleft', 'arrowright', 'arrowup', ' '].includes(e.key.toLowerCase())) e.preventDefault()
  if (e.key.toLowerCase() === 'm') muted = !muted
  onPress()
}
onkeyup = e => { keys[e.key.toLowerCase()] = 0 }
onblur = () => { for (const k in keys) keys[k] = 0; touches.clear() }

const touches = new Map()
function zoneOf(cx, cy) {
  const vx = (cx - offX) / scale, vy = (cy - offY) / scale
  if (vy > VH * 0.72) return vx < VW / 2 ? 'l' : 'r'
  return 's'
}
c.onpointerdown = e => {
  audioInit(); c.setPointerCapture(e.pointerId)
  touches.set(e.pointerId, zoneOf(e.clientX, e.clientY))
  onPress()
}
c.onpointermove = e => { if (touches.has(e.pointerId)) touches.set(e.pointerId, zoneOf(e.clientX, e.clientY)) }
c.onpointerup = c.onpointercancel = e => touches.delete(e.pointerId)
const held = z => { for (const v of touches.values()) if (v === z) return true; return false }
const inLeft = () => keys['arrowleft'] || keys['a'] || held('l')
const inRight = () => keys['arrowright'] || keys['d'] || held('r')
const inShoot = () => keys[' '] || keys['arrowup'] || keys['w'] || keys['z'] || keys['x'] || keys['j'] || held('s')

//////////////////// world ////////////////////
const rows = new Map()
const BAND = 6
let gapX = 3
function rnd() { return Math.random() }

function brickOf(d) { return rnd() < 0.24 + Math.min(0.22, d * 0.0005) ? 3 : 1 }

function stamp(x0, y0, w, h, t) {
  for (let y = y0; y < y0 + h; y++) {
    const row = rows.get(y)
    if (!row || y >= -3) continue
    for (let x = x0; x < x0 + w && x < COLS; x++) if (x >= 0 && !row[x]) row[x] = t
  }
}

function genBand(b) {
  for (let r = b; r < b + BAND; r++) {
    if (rows.has(r)) continue
    const row = new Uint8Array(COLS)
    if (r > 2) for (let i = 0; i < COLS; i++) row[i] = 4
    rows.set(r, row)
  }
  const ys = []
  for (let r = b; r < b + BAND; r++) if (r < -3) ys.push(r)
  if (!ys.length) return

  const depth = Math.max(0, -b)
  const n = 2 + (rnd() * 2 | 0)
  for (let k = 0; k < n; k++) {
    const t = brickOf(depth), roll = rnd()
    if (roll < 0.52) {
      const w = 2 + (rnd() * 4 | 0)
      stamp(rnd() * (COLS - w + 1) | 0, ys[rnd() * ys.length | 0], w, 1, t)
    } else if (roll < 0.84) {
      const w = 2 + (rnd() * 3 | 0), h = Math.min(2 + (rnd() * 2 | 0), ys.length)
      stamp(rnd() * (COLS - w + 1) | 0, ys[rnd() * (ys.length - h + 1) | 0], w, h, t)
    } else {
      const h = Math.min(2 + (rnd() * 3 | 0), ys.length)
      stamp(rnd() * COLS | 0, ys[rnd() * (ys.length - h + 1) | 0], 1, h, t)
    }
  }

  gapX += (rnd() * 3 | 0) - 1
  if (gapX < 0) gapX = 0
  if (gapX > COLS - 2) gapX = COLS - 2
  for (const y of ys) { const row = rows.get(y); row[gapX] = 0; row[gapX + 1] = 0 }
}

function getRow(r) {
  if (!rows.has(r)) genBand(Math.floor(r / BAND) * BAND)
  return rows.get(r)
}
function tile(cx, cy) {
  if (cx < 0 || cx >= COLS) return 0
  return getRow(cy)[cx]
}
function setTile(cx, cy, v) { if (cx >= 0 && cx < COLS) getRow(cy)[cx] = v }
function isBrick(t) { return t === 1 || t === 3 }
function isWall(cc, t) { return t === 4 }

function hitSolid(px, py, w, h) {
  const c0 = Math.floor(px / TW), c1 = Math.floor((px + w - 0.01) / TW)
  const r0 = Math.floor(py / TW), r1 = Math.floor((py + h - 0.01) / TW)
  for (let r = r0; r <= r1; r++) for (let cc = c0; cc <= c1; cc++) {
    const t = tile(cc, r)
    if (isWall(cc, t) || isBrick(t)) return true
  }
  return false
}

//////////////////// entities ////////////////////
let p, bullets, parts, cam, shake, state = 'title'
let hp, maxHp, ammo, maxAmmo, fireCd, ammoRegen, highest, best = 0
let dieT = 0, flash = 0, tGlobal = 0, iFrames = 0, spawnLock = 0
try { best = +(localStorage.getItem(SAVE) || 0) } catch (e) { }

function reset() {
  rows.clear()
  gapX = 2 + (rnd() * 5 | 0)
  bullets = []; parts = []
  p = { x: VW / 2 - 6, y: 3 * TW - 18, vx: 0, vy: 0, w: 12, h: 18, face: 1, trail: [], firing: 0 }
  cam = { y: 0 }; shake = 0; flash = 0
  maxHp = 4; hp = 4; maxAmmo = 6; ammo = 6; fireCd = 0; ammoRegen = 0
  highest = 0; iFrames = 0; spawnLock = 0.15; dieT = 0
  state = 'play'
}

function burst(px, py, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, s = (spd || 60) * (0.3 + rnd())
    parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.3 + rnd() * 0.4, max: 0.7, col: col || RAINBOW[rnd() * 6 | 0], g: 260 })
  }
}

function hornBox() { return { x: p.x + HORN_INSET, y: p.y - HORN_H, w: p.w - HORN_INSET * 2, h: HORN_H } }

function boxHits(b, cc, r) {
  const x0 = cc * TW, y0 = r * TW
  return b.x < x0 + TW && b.x + b.w > x0 && b.y < y0 + TW && b.y + b.h > y0
}

function hitUni() {
  const h = hornBox()
  return hitSolid(p.x, p.y, p.w, p.h) || hitSolid(h.x, h.y, h.w, h.h)
}

function move(dt) {
  const steps = Math.max(1, Math.ceil((Math.abs(p.vx) + Math.abs(p.vy)) * dt / 2))
  for (let i = 0; i < steps; i++) {
    const sx = p.vx * dt / steps, sy = p.vy * dt / steps
    if (sx) {
      p.x += sx
      if (p.x < 0) { p.x = 0; p.vx = 0 }
      else if (p.x + p.w > VW) { p.x = VW - p.w; p.vx = 0 }
      else if (hitSolid(p.x, p.y, p.w, p.h)) { bumpBody(); p.x -= sx; p.vx = 0 }
    }
    if (sy) {
      p.y += sy
      const broke = sy < 0 && smash()
      if (hitUni()) {
        bumpBody()
        p.y -= sy
        if (!broke) p.vy = 0
      }
    }
  }
}

function smash() {
  const h = hornBox(), body = { x: p.x, y: p.y, w: p.w, h: p.h }
  const c0 = Math.floor(h.x / TW), c1 = Math.floor((h.x + h.w - 0.01) / TW)
  const r0 = Math.floor(h.y / TW), r1 = Math.floor((h.y + h.h - 0.01) / TW)
  let hit = 0, hard = 0
  for (let r = r0; r <= r1; r++) for (let cc = c0; cc <= c1; cc++) {
    const t = tile(cc, r)
    if (!isBrick(t) || !boxHits(h, cc, r) || boxHits(body, cc, r)) continue
    setTile(cc, r, 0)
    hit = 1
    if (t === 3) hard = 1
    burst(cc * TW + TW / 2, r * TW + TW / 2, t === 3 ? 8 : 5, t === 3 ? '#ff4d6d' : pal().edge, t === 3 ? 90 : 60)
  }
  if (!hit) return false
  p.vy = HIT_RECOIL
  p.vx *= 0.3
  shake = Math.max(shake, hard ? 2.2 : 1)
  if (hard) { sHard(); hurt() }
  else sBreak()
  return true
}

function bumpBody() {
  const c0 = Math.floor(p.x / TW), c1 = Math.floor((p.x + p.w - 0.01) / TW)
  const r0 = Math.floor(p.y / TW), r1 = Math.floor((p.y + p.h - 0.01) / TW)
  for (let r = r0; r <= r1; r++) for (let cc = c0; cc <= c1; cc++) {
    if (tile(cc, r) !== 3) continue
    shake = Math.max(shake, 2.2)
    burst(cc * TW + TW / 2, r * TW + TW / 2, 8, '#ff4d6d', 90)
    sHard()
    hurt()
    return
  }
}

function fire() {
  ammo--; fireCd = FIRE_DELAY; p.firing = 0.08
  p.vy = Math.min(p.vy + RECOIL, 80)
  bullets.push({ x: p.x + p.w / 2, y: p.y - HORN_H, vx: (rnd() - 0.5) * 14, vy: -260, life: 0.9, hue: (tGlobal * 260) % 360 })
  burst(p.x + p.w / 2, p.y - HORN_H, 4, RAINBOW[(tGlobal * 8 | 0) % 6], 50)
  shake = Math.max(shake, 0.8)
  sShoot()
}

function updateBullets(dt) {
  for (const b of bullets) {
    b.life -= dt
    const steps = 3
    for (let i = 0; i < steps && !b.dead; i++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps
      const cx = Math.floor(b.x / TW), cy = Math.floor(b.y / TW), t = tile(cx, cy)
      if (!t) continue
      burst(b.x, b.y, 4, pal().edge, 60); sBreak()
      if (t === 1 || t === 3) setTile(cx, cy, 0)
      b.dead = true
    }
    if (b.life <= 0 || b.y < cam.y - 20) b.dead = true
  }
  bullets = bullets.filter(b => !b.dead)
}

function hurt() {
  if (iFrames > 0 || state !== 'play') return
  hp--; iFrames = 0.7; flash = 0.16
  burst(p.x + 3, p.y + 4, 12, '#ff4d6d', 110)
  sHurt()
}

function die() {
  state = 'dead'; dieT = 0; sDie(); shake = 5
  burst(p.x + 3, p.y + 4, 28, '#fff', 150)
  if (highest > best) { best = highest; try { localStorage.setItem(SAVE, best) } catch (e) { } }
}

function updatePlayer(dt) {
  const dir = (inRight() ? 1 : 0) - (inLeft() ? 1 : 0)
  if (dir) p.face = dir
  p.vx += (dir * 165 - p.vx) * Math.min(1, dt * 20)
  p.vy -= FLY_ACCEL * dt
  if (p.vy < -FLY) p.vy = -FLY
  if (spawnLock > 0) spawnLock -= dt

  fireCd -= dt
  p.firing = Math.max(0, p.firing - dt)
  if (spawnLock <= 0 && inShoot() && ammo > 0 && fireCd <= 0) fire()
  if (inShoot()) ammoRegen = 0
  else if (ammo < maxAmmo) {
    ammoRegen += dt
    if (ammoRegen >= AMMO_REGEN) { ammo++; ammoRegen = 0 }
  } else ammoRegen = 0

  move(dt)
  updateBullets(dt)

  p.trail.unshift({ x: p.x + p.w / 2, y: p.y + p.h })
  if (p.trail.length > 14) p.trail.pop()

  iFrames = Math.max(0, iFrames - dt)
  highest = Math.max(highest, Math.max(0, -(p.y / TW) | 0))
  if (hp <= 0 && state === 'play') die()
}

function updateStuff(dt) {
  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt }
  parts = parts.filter(q => q.life > 0)
  shake = Math.max(0, shake - dt * 9)
  flash = Math.max(0, flash - dt)
}

//////////////////// draw ////////////////////
function rect(px, py, w, h, col) { x.fillStyle = col; x.fillRect(px | 0, py | 0, Math.ceil(w), Math.ceil(h)) }

function txt(s, px, py, col, align, size) {
  x.font = 'bold ' + (size || 8) + 'px "Courier New",monospace'
  x.textAlign = align || 'left'; x.textBaseline = 'top'
  x.fillStyle = '#000'; x.globalAlpha = 0.55
  x.fillText(s, px + 1, py + 1)
  x.globalAlpha = 1; x.fillStyle = col || '#fff'
  x.fillText(s, px, py)
}

function drawBack() {
  const P = pal()
  x.fillStyle = P.bg; x.fillRect(0, 0, VW, VH)
  const off = -cam.y * 0.25
  for (let i = 0; i < 6; i++) {
    const yy = ((off + i * 90) % 540 + 540) % 540 - 60
    x.globalAlpha = 0.14
    rect(0, yy, VW, 16, RAINBOW[i])
    x.globalAlpha = 1
  }
  const s0 = Math.floor(cam.y / 40)
  for (let i = s0; i < s0 + 8; i++) {
    for (let j = 0; j < 4; j++) {
      const sx = ((i * 73 + j * 191) % 151) + 4
      const sy = i * 40 + ((i * 31 + j * 57) % 40) - cam.y * 0.5
      const yy = ((sy % 400) + 400) % 400 - 40
      x.globalAlpha = 0.5
      rect(sx, yy, 1, 1, '#fff')
      x.globalAlpha = 1
    }
  }
}

function drawWorld() {
  const P = pal()
  const r0 = Math.floor(cam.y / TW) - 1, r1 = Math.ceil((cam.y + VH) / TW) + 1
  for (let r = r0; r <= r1; r++) {
    const row = getRow(r), py = r * TW - cam.y
    for (let cc = 0; cc < COLS; cc++) {
      const t = row[cc]
      if (!t) continue
      const px = cc * TW
      if (t === 4) {
        rect(px, py, TW, TW, P.far)
        rect(px, py, TW, 2, P.edge)
        continue
      }
      if (t === 3) {
        rect(px, py, TW, TW, '#6a1020')
        rect(px + 1, py + 1, TW - 2, TW - 2, '#ff4d6d')
        rect(px + 3, py + 3, TW - 6, TW - 6, '#ff9ec4')
        continue
      }
      rect(px, py, TW, TW, P.rock)
      if (!tile(cc, r - 1) || tile(cc, r - 1) === 3) rect(px, py, TW, 2, P.edge)
    }
  }
}

function drawUnicorn() {
  if (iFrames > 0 && ((tGlobal * 22) | 0) % 2) return
  const bob = Math.sin(tGlobal * 20)
  const px = p.x, py = p.y - cam.y + bob
  for (let i = p.trail.length - 1; i >= 0; i--) {
    const t0 = p.trail[i]
    x.globalAlpha = 0.7 * (1 - i / Math.max(1, p.trail.length))
    for (let k = 0; k < 6; k++) rect(t0.x - 8, t0.y - cam.y + k * 2, 16, 2, RAINBOW[k])
    x.globalAlpha = 1
  }
  for (let i = 0; i < 6; i++) rect(px - 2, py + p.h + i * 2, 16, 2, RAINBOW[i])
  const f = p.face
  rect(px + 4, py - 8, 4, 10, '#ffe14d')
  rect(px + 6, py - 10, 2, 4, '#fff')
  rect(px + 2, py, 8, 6, '#fff')
  rect(px + (f > 0 ? 6 : 4), py + 2, 2, 2, '#2b1240')
  rect(px, py + 4, 12, 12, '#fff')
  for (let i = 0; i < 4; i++) rect(px + (f > 0 ? 0 : 8), py + 4 + i * 2, 4, 2, RAINBOW[(i + (tGlobal * 10 | 0)) % 6])
  for (let i = 0; i < 3; i++) rect(px + (f > 0 ? 12 : -2), py + 10 + i * 2, 2, 2, RAINBOW[(i + 3 + (tGlobal * 10 | 0)) % 6])
  if (p.firing > 0) {
    const col = RAINBOW[(tGlobal * 20 | 0) % 6]
    rect(px + 2, py - 16, 8, 8, col)
    rect(px + 4, py - 22, 4, 6, '#fff')
  } else { rect(px + 2, py + 16, 2, 2, '#fff'); rect(px + 8, py + 16, 2, 2, '#fff') }
  for (let i = 0; i < maxAmmo; i++)
    rect(px - (maxAmmo - 1) + i * 2 - 1, py - 14, 1, 3, i < ammo ? '#ffe14d' : 'rgba(255,255,255,.22)')
}

function drawHud() {
  for (let i = 0; i < maxHp; i++) {
    const hx = 4 + i * 7
    rect(hx, 4, 5, 5, i < hp ? '#ff4d6d' : 'rgba(255,255,255,.18)')
    if (i < hp) rect(hx + 1, 5, 2, 1, '#ff9ec4')
  }
  txt(highest + 'm', VW - 4, 4, '#fff', 'right')
}

function draw() {
  x.setTransform(1, 0, 0, 1, 0, 0)
  x.fillStyle = '#07050f'; x.fillRect(0, 0, W, H)
  const sh = shake > 0 ? (Math.random() - 0.5) * shake * 2 : 0
  x.setTransform(scale, 0, 0, scale, offX + sh * scale, offY + sh * scale)
  x.beginPath(); x.rect(0, 0, VW, VH); x.save(); x.clip()

  drawBack()
  drawWorld()
  for (const b of bullets) {
    rect(b.x - 1, b.y - cam.y - 4, 2, 4, `hsl(${b.hue} 95% 62%)`)
    rect(b.x - 0.5, b.y - cam.y - 3, 1, 2, '#fff')
  }
  for (const q of parts) { x.globalAlpha = Math.max(0, q.life / q.max); rect(q.x, q.y - cam.y, 2, 2, q.col); x.globalAlpha = 1 }
  if (state !== 'dead') drawUnicorn()

  if (flash > 0) { x.globalAlpha = flash * 2; x.fillStyle = '#ff4d6d'; x.fillRect(0, 0, VW, VH); x.globalAlpha = 1 }
  if (state === 'play') drawHud()

  if (state === 'title') {
    x.fillStyle = 'rgba(6,4,14,.75)'; x.fillRect(0, 0, VW, VH)
    for (let i = 0; i < 6; i++) rect(20, 44 + i * 3, VW - 40, 3, RAINBOW[i])
    txt('FLY UP', VW / 2, 58, '#fff', 'center', 18)
    txt('a unicorn ascends', VW / 2, 80, '#9b8fc0', 'center', 7)
    txt('MOVE  arrows / A D', VW / 2, 108, '#c8c0e0', 'center', 7)
    txt('SHOOT  space  (up, recoil)', VW / 2, 120, '#c8c0e0', 'center', 7)
    txt('smash blocks  ·  red hurts', VW / 2, 138, '#a89ecb', 'center', 7)
    if (best) txt('BEST ' + best + 'm', VW / 2, 160, '#ffe14d', 'center', 8)
    txt('press any key / tap', VW / 2, VH - 30, RAINBOW[(tGlobal * 3 | 0) % 6], 'center', 8)
  }
  if (state === 'dead') {
    x.fillStyle = 'rgba(6,4,14,.82)'; x.fillRect(0, 0, VW, VH)
    txt('THE DARK TOOK YOU', VW / 2, 70, '#fff', 'center', 12)
    txt('height  ' + highest + 'm', VW / 2, 100, '#fff', 'center', 8)
    txt('best  ' + best + 'm', VW / 2, 114, '#9b8fc0', 'center', 8)
    if (dieT > 0.8) txt('press any key / tap', VW / 2, VH - 30, RAINBOW[(tGlobal * 3 | 0) % 6], 'center', 8)
  }

  x.restore()
  x.setTransform(1, 0, 0, 1, 0, 0)
  x.fillStyle = '#07050f'
  x.fillRect(0, 0, W, offY); x.fillRect(0, offY + VH * scale, W, H)
  x.fillRect(0, 0, offX, H); x.fillRect(offX + VW * scale, 0, W, H)
}

function onPress() {
  if (state === 'title') { reset(); return }
  if (state === 'dead' && dieT > 0.8) reset()
}

function update(dt) {
  tGlobal += dt
  if (state === 'play') {
    updatePlayer(dt)
    const target = p.y - VH * 0.5
    cam.y += (target - cam.y) * Math.min(1, dt * 8)
    cam.y = Math.min(cam.y, p.y - HORN_H - 4)
    cam.y = Math.max(cam.y, p.y + p.h - VH + 22)
    const r0 = Math.floor((cam.y - VH) / TW)
    const r1 = Math.ceil((cam.y + VH) / TW)
    for (let r = r0; r <= r1; r++) getRow(r)
    const cut = Math.ceil((cam.y + VH) / TW) + 80
    if (rows.size > 220) for (const r of rows.keys()) if (r > cut) rows.delete(r)
  } else if (state === 'dead') dieT += dt
  updateStuff(dt)
}

let last = 0
requestAnimationFrame(function loop(now) {
  requestAnimationFrame(loop)
  const dt = Math.min((now - last) / 1000, 0.045)
  last = now
  update(dt)
  draw()
})

reset(); state = 'title'
</script>
</html>
