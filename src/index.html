<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RAINFALL</title>
<style>
  html,body{margin:0;height:100%;background:#c5dff8;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
</style>
<canvas id=c></canvas>
<script>
'use strict'
// RAINFALL — copy of rainfall-fly-up, flipped into a Downwell fall.
// Jump on ground, gunboots in the air. Four horseshoes. Land or stomp to reload.

//////////////////// constants ////////////////////
const TW = 18
const COLS = 9
const VW = COLS * TW
const VH = 240
const GRAVITY = 780
const MAX_FALL = 220
const JUMP = -250
const STOMP = -210
const KICK = -115
const FIRE_DELAY = 0.15
const MAX_VX = 190
const SAVE = 'downwell_best'

const c = document.getElementById('c'), x = c.getContext('2d')
let W = 0, H = 0, scale = 1, offX = 0, offY = 0
function resize() {
  W = c.width = innerWidth; H = c.height = innerHeight
  scale = Math.max(0.5, Math.floor(Math.min(W / VW, H / VH) * 2) / 2)
  offX = ((W - VW * scale) / 2) | 0
  offY = ((H - VH * scale) / 2) | 0
}
onresize = resize; resize()

const PALS = [
  { bg: '#c8e4ff', far: '#eef7ff', rock: '#ffffff', edge: '#d5e4f6', glow: '#ff8ec4', ink: '#4a3560' },
  { bg: '#d4f0ea', far: '#f3fffb', rock: '#ffffff', edge: '#d4ece4', glow: '#7ad0c8', ink: '#35524c' },
  { bg: '#f3dfff', far: '#fbf4ff', rock: '#ffffff', edge: '#e6d6f4', glow: '#c89bff', ink: '#4a3560' },
  { bg: '#ffe9c8', far: '#fff6e8', rock: '#ffffff', edge: '#f3e0c4', glow: '#ffb45c', ink: '#5a3c28' },
  { bg: '#ffdce8', far: '#fff0f5', rock: '#ffffff', edge: '#f3d0dc', glow: '#ff7aa8', ink: '#5a3050' },
  { bg: '#dce8ff', far: '#f4f7ff', rock: '#ffffff', edge: '#d0daf0', glow: '#8eb4ff', ink: '#343c68' },
]
const pal = () => PALS[(Math.floor(deepest / 80) || 0) % PALS.length]
const RAINBOW = ['#ff4d6d', '#ff9f45', '#ffe14d', '#5ce65c', '#4dc8ff', '#9b6bff']

//////////////////// audio ////////////////////
let ac = null, muted = false
function audioInit() {
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A() }
  if (ac && ac.state === 'suspended') ac.resume()
}
function snd(freq, dur, type, vol, slide) {
  if (!ac || muted) return
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain()
  o.type = type || 'square'
  o.frequency.setValueAtTime(freq, t)
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur)
  g.gain.setValueAtTime(vol || 0.05, t)
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  o.connect(g); g.connect(ac.destination)
  o.start(t); o.stop(t + dur + 0.02)
}
const sShoot = () => { snd(140, 0.14, 'sawtooth', 0.08, 0.28); snd(480, 0.07, 'square', 0.045, 0.45) }
const sJump = () => snd(420, 0.09, 'square', 0.04, 1.6)
const sWall = () => snd(520, 0.08, 'square', 0.04, 1.8)
const sStomp = n => snd(300 + n * 60, 0.12, 'square', 0.06, 2.2)
const sBreak = () => snd(180, 0.07, 'sawtooth', 0.03, 0.45)
const sHurt = () => snd(220, 0.28, 'sawtooth', 0.09, 0.25)
const sDie = () => snd(300, 0.9, 'sawtooth', 0.1, 0.08)
const sGem = () => snd(880 + Math.random() * 200, 0.07, 'triangle', 0.04, 1.6)
const sEmpty = () => snd(140, 0.08, 'square', 0.03, 0.5)
const sReload = () => snd(700, 0.07, 'triangle', 0.03, 1.4)
const sBoom = () => { snd(90, 0.28, 'sawtooth', 0.11, 0.3); snd(220, 0.16, 'square', 0.05, 0.45) }

//////////////////// input ////////////////////
const keys = {}
onkeydown = e => {
  if (e.repeat) return
  audioInit()
  keys[e.key.toLowerCase()] = 1
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(e.key.toLowerCase())) e.preventDefault()
  if (e.key.toLowerCase() === 'm') muted = !muted
  onPress()
}
onkeyup = e => { keys[e.key.toLowerCase()] = 0 }
onblur = () => { for (const k in keys) keys[k] = 0; touches.clear() }

const touches = new Map()
function zoneOf(cx, cy) {
  const vx = (cx - offX) / scale, vy = (cy - offY) / scale
  if (vy > VH * 0.72) return vx < VW * 0.28 ? 'l' : vx < VW * 0.56 ? 'r' : 'j'
  return 'j'
}
c.onpointerdown = e => {
  audioInit(); c.setPointerCapture(e.pointerId)
  touches.set(e.pointerId, zoneOf(e.clientX, e.clientY))
  onPress()
}
c.onpointermove = e => { if (touches.has(e.pointerId)) touches.set(e.pointerId, zoneOf(e.clientX, e.clientY)) }
c.onpointerup = c.onpointercancel = e => touches.delete(e.pointerId)
const held = z => { for (const v of touches.values()) if (v === z) return true; return false }
const inLeft = () => keys['arrowleft'] || keys['a'] || held('l')
const inRight = () => keys['arrowright'] || keys['d'] || held('r')
const inJump = () => keys[' '] || keys['arrowup'] || keys['w'] || keys['z'] || keys['x'] || keys['j'] || held('j')

//////////////////// world ////////////////////
const rows = new Map()
function rnd() { return Math.random() }

function genRow(r) {
  const row = new Uint8Array(COLS)
  row[0] = 4; row[COLS - 1] = 4
  if (r === 4) {
    for (let i = 2; i <= 6; i++) row[i] = 1
    rows.set(r, row)
    return row
  }
  if (r < 9) { rows.set(r, row); return row }

  const depth = Math.max(0, r - 9)
  if (rnd() < 0.19 + Math.min(0.08, depth * 0.0004)) {
    const len = 2 + (rnd() * 3 | 0)
    const sx = 1 + (rnd() * (COLS - 2 - len) | 0)
    for (let i = sx; i < sx + len; i++) row[i] = rnd() < 0.12 ? 3 : 1
  }
  if (rnd() < 0.06) {
    const i = 1 + (rnd() * (COLS - 2) | 0)
    if (!row[i]) row[i] = 1
  }
  let best = 0, run = 0
  for (let i = 1; i < COLS - 1; i++) {
    if (!row[i]) { if (++run > best) best = run }
    else run = 0
  }
  if (best < 2) {
    const sx = 1 + (rnd() * (COLS - 4) | 0)
    row[sx] = 0; row[sx + 1] = 0
  }
  for (let i = 2; i < COLS - 2; i++) {
    if (row[i] || !isCloud(row[i - 1]) || !isCloud(row[i + 1])) continue
    row[i] = row[i - 1] === 3 || row[i + 1] === 3 ? 3 : 1
  }
  rows.set(r, row)
  for (let i = 1; i < COLS - 1; i++) {
    if (!isCloud(row[i])) continue
    if (isCloud(getRow(r - 2)[i])) {
      const mid = getRow(r - 1)
      if (!isCloud(mid[i])) mid[i] = row[i] === 3 || getRow(r - 2)[i] === 3 ? 3 : 1
      continue
    }
    if (ceilingTooLow(r, i)) row[i] = 0
  }
  populate(r, row, depth)
  return row
}

function populate(r, row, depth) {
  if (r < 12) return
  const y = r * TW
  if (rnd() < Math.min(0.22, 0.10 + depth * 0.0008)) {
    const cands = []
    for (let i = 1; i < COLS - 1; i++) if (!row[i]) cands.push(i)
    if (cands.length) {
      const roll = rnd()
      const t = roll < 0.42 ? 0 : roll < 0.78 ? 1 : 2
      const w = t === 2 ? 14 : 12, h = t === 1 ? 10 : 12
      for (let n = cands.length - 1; n > 0; n--) {
        const k = rnd() * (n + 1) | 0, tmp = cands[n]; cands[n] = cands[k]; cands[k] = tmp
      }
      for (const col of cands) {
        const ex = col * TW + 3, ey = y + 4
        if (!enemyOverlap(ex, ey, w, h)) { spawnEnemy(t, ex, ey); break }
      }
    }
  }
  if (rnd() < 0.10) {
    const cands = []
    for (let i = 1; i < COLS - 1; i++) if (!row[i]) cands.push(i)
    if (cands.length) {
      const col = cands[rnd() * cands.length | 0]
      doodads.push({ x: col * TW + 5, y: y + 6, w: 8, h: 10, t: rnd() * 6 })
    }
  }
}

function getRow(r) {
  if (r < 0) {
    const empty = new Uint8Array(COLS)
    empty[0] = 4; empty[COLS - 1] = 4
    return empty
  }
  return rows.get(r) || genRow(r)
}
function tile(cx, cy) {
  if (cx < 0 || cx >= COLS) return 4
  if (cy < 0) return 0
  return getRow(cy)[cx]
}
function setTile(cx, cy, v) { if (cx >= 0 && cx < COLS && cy >= 0) getRow(cy)[cx] = v }
function isCloud(t) { return t === 1 || t === 3 }
function isSolid(t) { return t === 1 || t === 3 || t === 4 }

function ceilingTooLow(r, i) {
  const prev = getRow(r - 2)
  for (let c = i - 1; c <= i + 1; c++) {
    if (c < 1 || c >= COLS - 1) continue
    if (isCloud(prev[c])) return true
  }
  return false
}

function hitRect(px, py, w, h) {
  const c0 = Math.floor(px / TW), c1 = Math.floor((px + w - 0.01) / TW)
  const r0 = Math.floor(py / TW), r1 = Math.floor((py + h - 0.01) / TW)
  for (let r = r0; r <= r1; r++) for (let cc = c0; cc <= c1; cc++) if (isSolid(tile(cc, r))) return true
  return false
}

function spikeUnder(e) {
  const y = e.y + e.h + 0.5
  const c0 = Math.floor(e.x / TW), c1 = Math.floor((e.x + e.w - 0.01) / TW)
  const r = Math.floor(y / TW)
  for (let cc = c0; cc <= c1; cc++) if (tile(cc, r) === 3) return true
  return false
}

//////////////////// entities ////////////////////
let p, enemies, bullets, doodads, gems, parts, texts, booms, cam, shake
let state = 'title', hp, maxHp, ammo, maxAmmo, combo, comboBest, dust, deepest
let fireCd, iFrames, best = 0, dieT = 0, flash = 0, tGlobal = 0, emptyT = 0
try { best = +(localStorage.getItem(SAVE) || 0) } catch (e) { }

function reset() {
  rows.clear()
  enemies = []; bullets = []; doodads = []; gems = []; parts = []; texts = []; booms = []
  p = {
    x: VW / 2 - 6, y: 4 * TW - 18 - 0.5, vx: 0, vy: 0, w: 12, h: 18,
    face: 1, trail: [], firing: 0, onGround: true, coyote: 0.09,
    jumpLatch: 1, jumpBuf: 0, rolling: 0, justJumped: 0, reloadT: 0, fireSlot: 0
  }
  cam = { y: 0, vy: 0 }; shake = 0; flash = 0
  maxHp = 4; hp = 4; maxAmmo = 4; ammo = 4
  combo = 0; comboBest = 0; dust = 0; deepest = 0
  fireCd = 0; iFrames = 0; dieT = 0; emptyT = 0
  state = 'play'
  for (let r = 0; r < 16; r++) getRow(r)
}

function enemyOverlap(ex, ey, w, h, skip) {
  const pad = 4
  for (const e of enemies) {
    if (e.dead || e === skip) continue
    if (ex + w + pad <= e.x || ex >= e.x + e.w + pad || ey + h + pad <= e.y || ey >= e.y + e.h + pad) continue
    return e
  }
  return null
}

function spawnEnemy(t, ex, ey) {
  const base = { type: t, x: ex, y: ey, vx: 0, vy: 0, t: rnd() * 6, hurt: 0 }
  if (t === 0) enemies.push(Object.assign(base, { w: 12, h: 12, hp: 1, vx: rnd() < 0.5 ? -36 : 36, stomp: 1 }))
  if (t === 1) enemies.push(Object.assign(base, { w: 12, h: 10, hp: 1, stomp: 1 }))
  if (t === 2) enemies.push(Object.assign(base, { w: 14, h: 12, hp: 2, vx: rnd() < 0.5 ? -28 : 28, stomp: 0 }))
}

function burst(px, py, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, s = (spd || 60) * (0.3 + rnd())
    parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.3 + rnd() * 0.4, max: 0.7, col: col || RAINBOW[rnd() * 6 | 0], g: 260 })
  }
}

function explode(px, py) {
  shake = Math.max(shake, 5)
  flash = Math.max(flash, 0.22)
  burst(px, py, 26, '#ff9f45', 190)
  burst(px, py, 14, '#ffe14d', 150)
  burst(px, py, 10, '#fff', 100)
  booms.push({ x: px, y: py, life: 0.38, max: 0.38 })
  sBoom()
  const cx = Math.floor(px / TW), cy = Math.floor(py / TW)
  for (let r = cy - 1; r <= cy + 1; r++) {
    for (let c = cx - 1; c <= cx + 1; c++) {
      const t = tile(c, r)
      if (t !== 1 && t !== 3) continue
      setTile(c, r, 0)
      burst(c * TW + TW / 2, r * TW + TW / 2, 6, pal().edge, 80)
    }
  }
  const x0 = (cx - 1) * TW, y0 = (cy - 1) * TW, x1 = (cx + 2) * TW, y1 = (cy + 2) * TW
  for (const e of enemies) {
    if (e.dead) continue
    if (e.x + e.w < x0 || e.x > x1 || e.y + e.h < y0 || e.y > y1) continue
    kill(e, false)
  }
}
function popText(px, py, s, col) { texts.push({ x: px, y: py, s: s, col: col || '#fff', life: 0.9 }) }

function moveEnt(e, dt) {
  e.onGround = false
  e.hitWall = false
  const steps = Math.max(1, Math.ceil((Math.abs(e.vx) + Math.abs(e.vy)) * dt / 2))
  for (let i = 0; i < steps; i++) {
    const sx = e.vx * dt / steps, sy = e.vy * dt / steps
    if (sx) {
      e.x += sx
      if (hitRect(e.x, e.y, e.w, e.h)) { e.x -= sx; e.vx = 0; e.hitWall = true }
    }
    if (sy) {
      e.y += sy
      if (hitRect(e.x, e.y, e.w, e.h)) {
        e.y -= sy
        if (sy > 0) e.onGround = true
        e.vy = 0
      }
    }
  }
}

function refill() {
  if (ammo < maxAmmo) {
    sReload()
    const legs = unicornLegs()
    for (const L of legs) burst(p.x + L.x + 1, p.y + L.y + 5, 2, '#e8a018', 50)
  }
  ammo = maxAmmo
  p.reloadT = 0.16
}

function wallJump(dir) {
  p.vy = JUMP
  p.vx = dir * MAX_VX
  p.face = dir
  p.rolling = 0
  p.justJumped = 1
  p.jumpLatch = 1
  p.coyote = 0
  p.jumpBuf = 0
  sWall()
}

function jump() {
  p.vy = JUMP
  p.coyote = 0
  p.jumpBuf = 0
  p.jumpLatch = 1
  p.justJumped = 1
  p.rolling = inLeft() || inRight() ? 1 : 0
  sJump()
}

function fire() {
  if (ammo <= 0) {
    fireCd = FIRE_DELAY
    if (emptyT <= 0) { emptyT = 0.55; sEmpty() }
    return
  }
  const slot = maxAmmo - ammo
  ammo--; fireCd = FIRE_DELAY; p.firing = 0.12; p.fireSlot = slot
  p.rolling = 0
  if (p.vy > JUMP * 0.5) p.vy = KICK
  const L = unicornLegs()[slot]
  const sx = p.x + L.x + 1, sy = p.y + L.y + 5
  bullets.push({ x: sx, y: sy, vx: (rnd() - 0.5) * 14, vy: 280, life: 0.9, hue: (tGlobal * 260) % 360 })
  burst(sx, sy, 8, '#e8a018', 90)
  shake = Math.max(shake, 0.9)
  sShoot()
  if (ammo <= 0) { emptyT = 0.55; sEmpty() }
}

function hurt() {
  if (iFrames > 0 || state !== 'play') return
  hp--; iFrames = 1.1
  p.vy = JUMP * 0.55
  p.vx = -p.face * 90
  p.rolling = 1
  endCombo()
  explode(p.x + p.w / 2, p.y + p.h / 2)
  sHurt()
}

function kill(e, byStomp) {
  e.dead = true
  combo++; comboBest = Math.max(comboBest, combo)
  shake = Math.max(shake, byStomp ? 2.2 : 1.2)
  burst(e.x + e.w / 2, e.y + e.h / 2, byStomp ? 12 : 8, RAINBOW[combo % 6], byStomp ? 110 : 80)
  if (combo > 1) popText(e.x, e.y - 4, 'x' + combo, RAINBOW[combo % 6])
  sStomp(Math.min(combo, 10))
  gems.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: (rnd() - 0.5) * 70, vy: -50 - rnd() * 40 })
}

function endCombo() {
  if (combo < 2) { combo = 0; return }
  const reward = Math.min(60, combo * (combo + 1) / 2) | 0
  dust += reward
  popText(p.x - 8, p.y - 12, 'COMBO ' + combo + '  +' + reward, '#ffe14d')
  if (combo >= 8 && hp < maxHp) { hp++; popText(p.x - 4, p.y - 22, '+HEART', '#ff6ad5') }
  snd(700, 0.25, 'triangle', 0.06, 2.4)
  combo = 0
}

function die() {
  state = 'dead'; dieT = 0; sDie(); shake = 5
  burst(p.x + p.w / 2, p.y + p.h / 2, 28, '#fff', 150)
  const score = dust + deepest
  if (score > best) { best = score; try { localStorage.setItem(SAVE, best) } catch (e) { } }
}

function updatePlayer(dt) {
  const dir = (inRight() ? 1 : 0) - (inLeft() ? 1 : 0)
  if (dir) p.face = dir
  p.vx += (dir * MAX_VX - p.vx) * Math.min(1, dt * (p.onGround ? 22 : 14))

  const wasGround = p.onGround
  p.justJumped = 0
  p.jumpBuf = Math.max(0, p.jumpBuf - dt)
  fireCd -= dt
  p.firing = Math.max(0, p.firing - dt)
  p.reloadT = Math.max(0, p.reloadT - dt)
  emptyT = Math.max(0, emptyT - dt)

  if (inJump()) {
    if (!p.jumpLatch) p.jumpBuf = 0.1
  } else p.jumpLatch = 0

  const wallL = hitRect(p.x - 2, p.y, p.w, p.h)
  const wallR = hitRect(p.x + 2, p.y, p.w, p.h)
  const canWall = !p.onGround && p.rolling && ammo === maxAmmo && inJump() && !p.jumpLatch
  if (canWall && wallL && dir > 0) wallJump(1)
  else if (canWall && wallR && dir < 0) wallJump(-1)
  else if ((p.coyote > 0 || p.onGround) && p.jumpBuf > 0 && !p.jumpLatch) jump()
  else if (!p.onGround && p.coyote <= 0 && inJump() && fireCd <= 0) {
    const risingHold = p.jumpLatch && p.vy < JUMP * 0.55
    if (!risingHold) fire()
  }

  p.vy = Math.min(p.vy + GRAVITY * dt, MAX_FALL)
  moveEnt(p, dt)

  if (p.onGround) {
    p.coyote = 0.09
    p.rolling = 0
    if (!wasGround) refill()
    else ammo = maxAmmo
    endCombo()
    if (spikeUnder(p)) hurt()
  } else {
    p.coyote = Math.max(0, p.coyote - dt)
    if (wasGround && !p.justJumped) p.rolling = 0
  }

  p.trail.unshift({ x: p.x + p.w / 2, y: p.y + p.h })
  if (p.trail.length > 12) p.trail.pop()

  iFrames = Math.max(0, iFrames - dt)
  deepest = Math.max(deepest, (p.y / TW) | 0)

  for (const e of enemies) {
    if (e.dead) continue
    if (p.x + p.w < e.x || p.x > e.x + e.w || p.y + p.h < e.y || p.y > e.y + e.h) continue
    const stomping = p.vy > 24 && (p.y + p.h) - e.y < e.h * 0.7 + p.vy * 0.02
    if (stomping && e.stomp) {
      kill(e, true)
      p.vy = STOMP
      p.rolling = 1
      refill()
    } else hurt()
  }

  for (const d of doodads) {
    if (d.dead) continue
    if (p.x + p.w < d.x || p.x > d.x + d.w || p.y + p.h < d.y || p.y > d.y + d.h) continue
    const stomping = p.vy > 10 && (p.y + p.h) - d.y < d.h * 0.8
    if (stomping) {
      d.dead = true
      p.vy = STOMP
      p.rolling = 1
      refill()
      burst(d.x + 4, d.y + 4, 8, pal().edge, 80)
      sBreak()
    }
  }

  for (const g of gems) {
    if (g.dead) continue
    const dx = p.x + p.w / 2 - g.x, dy = p.y + p.h / 2 - g.y
    if (Math.abs(dx) < 10 && Math.abs(dy) < 12) {
      g.dead = true; dust += 1; sGem()
    }
  }

  if (hp <= 0 && state === 'play') die()
}

function updateBullets(dt) {
  for (const b of bullets) {
    b.life -= dt
    const steps = 3
    for (let i = 0; i < steps && !b.dead; i++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps
      const cx = Math.floor(b.x / TW), cy = Math.floor(b.y / TW), t = tile(cx, cy)
      if (isSolid(t)) {
        burst(b.x, b.y, 4, pal().edge, 60); sBreak()
        if (t === 1 || t === 3) setTile(cx, cy, 0)
        b.dead = true
        continue
      }
      for (const e of enemies) {
        if (e.dead || b.dead) continue
        if (b.x < e.x || b.x > e.x + e.w || b.y < e.y || b.y > e.y + e.h) continue
        e.hp--; e.hurt = 0.12
        burst(b.x, b.y, 5, '#fff', 70)
        if (e.hp <= 0) kill(e, false)
        else snd(240, 0.05, 'square', 0.03, 0.7)
        b.dead = true
      }
      for (const d of doodads) {
        if (d.dead || b.dead) continue
        if (b.x < d.x || b.x > d.x + d.w || b.y < d.y || b.y > d.y + d.h) continue
        d.dead = true; b.dead = true
        burst(d.x + 4, d.y + 4, 6, pal().edge, 70)
        sBreak()
      }
    }
    if (b.life <= 0 || b.y > cam.y + VH + 24) b.dead = true
  }
  bullets = bullets.filter(b => !b.dead)
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue
    if (e.y < cam.y - 80) { e.dead = true; continue }
    if (e.y < cam.y - 40 || e.y > cam.y + VH + 80) continue
    e.t += dt; e.hurt = Math.max(0, e.hurt - dt)
    if (e.type === 0) {
      if (e.hitWall) e.vx = -e.vx
      if (e.onGround) {
        const ahead = e.x + (e.vx > 0 ? e.w + 2 : -2)
        if (!isSolid(tile(Math.floor(ahead / TW), Math.floor((e.y + e.h + 2) / TW)))) e.vx = -e.vx
      }
      e.vy = Math.min(e.vy + GRAVITY * dt, 220)
    } else if (e.type === 1) {
      e.vx = Math.cos(e.t * 1.4) * 28 + Math.sign(p.x - e.x) * 12
      e.vy = Math.sin(e.t * 2.1) * 22 + 10
      if (e.hitWall) e.x += Math.sign(p.x - e.x) * 0.8
    } else {
      if (e.hitWall) e.vx = -e.vx
      if (e.onGround) {
        const ahead = e.x + (e.vx > 0 ? e.w + 2 : -2)
        if (!isSolid(tile(Math.floor(ahead / TW), Math.floor((e.y + e.h + 2) / TW)))) e.vx = -e.vx
      }
      e.vy = Math.min(e.vy + GRAVITY * dt, 220)
    }
    moveEnt(e, dt)
  }
  separateEnemies()
  enemies = enemies.filter(e => !e.dead)
}

function separateEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]
    if (a.dead) continue
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]
      if (b.dead) continue
      if (a.x + a.w <= b.x || a.x >= b.x + b.w || a.y + a.h <= b.y || a.y >= b.y + b.h) continue
      const dx = (a.x + a.w / 2) - (b.x + b.w / 2)
      const dy = (a.y + a.h / 2) - (b.y + b.h / 2)
      const ox = (a.w + b.w) / 2 - Math.abs(dx)
      const oy = (a.h + b.h) / 2 - Math.abs(dy)
      if (ox < oy) {
        const s = dx < 0 ? -1 : 1
        a.x += s * ox * 0.5
        b.x -= s * ox * 0.5
        if (a.vx * s < 0) a.vx = -a.vx
        if (b.vx * s > 0) b.vx = -b.vx
      } else {
        const s = dy < 0 ? -1 : 1
        a.y += s * oy * 0.5
        b.y -= s * oy * 0.5
      }
    }
  }
}

function updateStuff(dt) {
  for (const d of doodads) {
    if (d.dead) continue
    d.t += dt
    if (d.y < cam.y - 80) d.dead = true
  }
  doodads = doodads.filter(d => !d.dead)

  for (const g of gems) {
    if (g.dead) continue
    g.vy = Math.min(g.vy + 300 * dt, 160)
    g.vx *= 0.94
    const nx = g.x + g.vx * dt, ny = g.y + g.vy * dt
    if (!isSolid(tile(Math.floor(nx / TW), Math.floor(g.y / TW)))) g.x = nx
    else g.vx = -g.vx * 0.4
    if (!isSolid(tile(Math.floor(g.x / TW), Math.floor(ny / TW)))) g.y = ny
    else { g.vy = -g.vy * 0.3; if (Math.abs(g.vy) < 12) g.vy = 0 }
    if (g.y < cam.y - 80) g.dead = true
  }
  gems = gems.filter(g => !g.dead)

  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt }
  parts = parts.filter(q => q.life > 0)
  for (const b of booms) b.life -= dt
  booms = booms.filter(b => b.life > 0)
  for (const t of texts) { t.life -= dt; t.y -= 18 * dt }
  texts = texts.filter(t => t.life > 0)
  shake = Math.max(0, shake - dt * 9)
  flash = Math.max(0, flash - dt)
}

//////////////////// draw ////////////////////
function rect(px, py, w, h, col) { x.fillStyle = col; x.fillRect(px | 0, py | 0, Math.ceil(w), Math.ceil(h)) }

function txt(s, px, py, col, align, size) {
  x.font = 'bold ' + (size || 8) + 'px "Courier New",monospace'
  x.textAlign = align || 'left'; x.textBaseline = 'top'
  x.fillStyle = '#fff'; x.globalAlpha = 0.7
  x.fillText(s, px + 1, py + 1)
  x.globalAlpha = 1; x.fillStyle = col || pal().ink
  x.fillText(s, px, py)
}

function shoe(px, py, on) {
  const col = on ? '#e8a018' : 'rgba(74,53,96,.28)'
  rect(px, py, 2, 1, col)
  rect(px + 4, py, 2, 1, col)
  rect(px, py + 1, 1, 3, col)
  rect(px + 5, py + 1, 1, 3, col)
  rect(px + 1, py + 4, 1, 1, col)
  rect(px + 4, py + 4, 1, 1, col)
  rect(px + 1, py + 5, 4, 1, col)
}

function unicornLegs() {
  const run = !p.onGround || Math.abs(p.vx) > 30
  const ph = run ? ((tGlobal * 16) | 0) % 2 : 0
  const yb = 12 + (ph ? 1 : 0), yf = 12 + (ph ? 0 : 1)
  if (p.face > 0)
    return [{ x: 1, y: yb }, { x: 4, y: yf }, { x: 7, y: yb }, { x: 10, y: yf }]
  return [{ x: 9, y: yb }, { x: 6, y: yf }, { x: 3, y: yb }, { x: 0, y: yf }]
}

function hoof(px, py) {
  rect(px - 1, py, 1, 2, '#e8a018')
  rect(px + 2, py, 1, 2, '#e8a018')
  rect(px - 1, py + 2, 4, 1, '#e8a018')
  rect(px, py + 1, 2, 1, '#c48800')
}

function drawCloud(px, py, tiles, storm, far) {
  const w = tiles * TW, h = TW
  const fill = storm ? '#f4d2de' : far ? '#d4d4d8' : '#ffffff'
  const shade = storm ? '#e398b0' : far ? '#b0b0b6' : '#cfdcf0'
  const blush = storm ? '#ffc0d4' : far ? '#e8e8ec' : '#fff6fb'
  rect(px, py + 4, w, h - 6, fill)
  rect(px + 2, py + 1, w * 0.55, 12, fill)
  rect(px + w * 0.32, py, w * 0.52, 13, fill)
  rect(px + w * 0.18, py + 2, 8, 5, blush)
  rect(px + 3, py + h - 3, w - 6, 2, shade)
}

function drawCloudCell(c, r, pass) {
  const storm = tile(c, r) === 3
  const fill = storm ? '#f4d2de' : '#ffffff'
  const shade = storm ? '#e398b0' : '#cfdcf0'
  const blush = storm ? '#ffc0d4' : '#fff6fb'
  const px = c * TW, py = r * TW - cam.y
  const up = isCloud(tile(c, r - 1)), dn = isCloud(tile(c, r + 1))
  const lf = isCloud(tile(c - 1, r)), rt = isCloud(tile(c + 1, r))
  const s = (c * 73 + r * 19) & 7
  if (pass === 0) {
    rect(px, py, TW, TW, '#ffffff')
    rect(px - 3, py + 3, TW + 6, TW - 6, '#ffffff')
    rect(px + 2, py - 2, TW - 4, TW + 2, '#ffffff')
    return
  }
  if (pass === 1) {
    if (storm) {
      rect(px + 2, py + 2, TW - 4, TW - 4, fill)
      rect(px + 4, py + 1, TW - 8, TW - 3, fill)
    }
    return
  }
  if (!up) {
    rect(px - 1, py - 4, TW + 2, 8, fill)
    if (s > 3) rect(px + 3, py - 6, 10, 6, fill)
    if (s === 1 || s === 6) rect(px + 5, py - 5, 6, 4, blush)
  }
  if (!dn) rect(px, py + TW - 2, TW, 2, shade)
  if (!lf && (s & 1)) rect(px - 5, py + 4, 8, 10, fill)
  if (!rt && (s & 2)) rect(px + TW - 3, py + 3, 8, 11, fill)
}

function drawSkyCastle(px, py) {
  if (py < -36 || py > VH + 24) return
  const a = x.globalAlpha
  x.globalAlpha = a * 0.7
  drawCloud(px - 2, py, 4, 0, 1)
  x.globalAlpha = a
  const bx = px + 8
  rect(bx, py - 16, 24, 16, '#d4c6e6')
  rect(bx - 2, py - 22, 7, 12, '#c4b4dc')
  rect(bx + 19, py - 26, 7, 16, '#c4b4dc')
  for (let i = 0; i < 6; i++) rect(bx + i * 4, py - 18, 2, 3, '#efe8f8')
  rect(bx + 22, py - 34, 1, 9, '#ff4d6d')
  rect(bx + 22, py - 34, 7, 3, '#ff4d6d')
  rect(bx + 10, py - 7, 5, 7, '#6a5080')
  rect(bx + 5, py - 12, 3, 3, '#ffe14d')
  rect(bx + 16, py - 12, 3, 3, '#ffe14d')
}

function drawTales() {
  const par = 0.24, step = 170
  const k0 = Math.floor(cam.y * par / step) - 1
  for (let k = k0; k < k0 + 6; k++) {
    if (k < 1) continue
    const seed = (k * 1103515245 + 12345) >>> 0
    const roll = seed % 5
    if (roll > 2) continue
    const cx = TW + 12 + (seed % (VW - TW * 2 - 56))
    const sy = k * step - cam.y * par
    x.globalAlpha = 0.7
    drawSkyCastle(cx - 4, sy)
    x.globalAlpha = 1
  }
}

function drawBack() {
  const P = pal()
  x.fillStyle = P.bg; x.fillRect(0, 0, VW, VH)
  const sky = ['#b7dbff', '#d3eaff', '#ebe4ff', '#ffdcec', '#ffe9c4']
  const off = -cam.y * 0.18
  for (let i = 0; i < 5; i++) {
    const yy = ((off + i * 70) % 420 + 420) % 420 - 50
    x.globalAlpha = 0.35
    rect(0, yy, VW, 48, sky[i])
    x.globalAlpha = 1
  }
  for (let i = 0; i < 6; i++) {
    const yy = ((off * 1.4 + i * 95) % 540 + 540) % 540 - 40
    x.globalAlpha = 0.16
    rect(0, yy, VW, 8, RAINBOW[i])
    x.globalAlpha = 1
  }
  x.globalAlpha = 0.9
  rect(22, 22, 12, 12, '#ffe14d')
  rect(20, 24, 16, 8, '#ffe14d')
  rect(24, 20, 8, 16, '#fff3a0')
  x.globalAlpha = 1
  const s0 = Math.floor(cam.y * 0.28 / 46)
  for (let i = s0; i < s0 + 9; i++) {
    const cw = 2 + (i * 3 % 3)
    const cx = 8 + ((i * 53) % (VW - cw * TW - 16))
    const cy = i * 46 - cam.y * 0.28
    x.globalAlpha = 0.42
    drawCloud(cx, cy, cw, 0, 1)
    x.globalAlpha = 1
  }
  drawTales()
  const sp = Math.floor(cam.y / 36)
  for (let i = sp; i < sp + 8; i++) {
    for (let j = 0; j < 3; j++) {
      const sx = ((i * 73 + j * 191) % 151) + 4
      const sy = i * 36 + ((i * 31 + j * 57) % 36) - cam.y * 0.45
      const yy = ((sy % 400) + 400) % 400 - 40
      rect(sx, yy, 1, 1, j ? '#ffe14d' : '#ff9ec4')
    }
  }
}

function drawRainbowSides() {
  const band = TW / 6
  for (let i = 0; i < 6; i++) {
    rect(i * band, 0, Math.ceil(band), VH, RAINBOW[i])
    rect(VW - (i + 1) * band, 0, Math.ceil(band), VH, RAINBOW[i])
  }
}

function drawWorld() {
  const r0 = Math.floor(cam.y / TW) - 1, r1 = Math.ceil((cam.y + VH) / TW) + 1
  const cells = []
  for (let r = r0; r <= r1; r++)
    for (let c = 1; c < COLS - 1; c++)
      if (isCloud(tile(c, r))) cells.push(c, r)
  for (let pass = 0; pass < 3; pass++)
    for (let i = 0; i < cells.length; i += 2) drawCloudCell(cells[i], cells[i + 1], pass)
  drawRainbowSides()
}

function drawUnicorn() {
  if (iFrames > 0 && ((tGlobal * 22) | 0) % 2) return
  const px = p.x, py = p.y - cam.y
  if (p.vy > 90) for (let i = p.trail.length - 1; i > 0; i--) {
    const t0 = p.trail[i]
    x.globalAlpha = 0.45 * (1 - i / p.trail.length)
    rect(t0.x - 3, t0.y - cam.y, 6, 4, RAINBOW[i % 6])
    x.globalAlpha = 1
  }
  if (p.reloadT > 0) {
    x.globalAlpha = p.reloadT * 4
    rect(px - 2, py, p.w + 4, p.h, '#ffe14d')
    x.globalAlpha = 1
  }
  const f = p.face
  rect(px - 1, py + 3, 14, 11, '#b8a4d8')
  rect(px + 4, py - 8, 4, 10, '#ffe14d')
  rect(px + 6, py - 10, 2, 4, '#fff')
  rect(px + 2, py, 8, 6, '#fff')
  rect(px + (f > 0 ? 6 : 4), py + 2, 2, 2, '#2b1240')
  rect(px, py + 4, 12, 9, '#fff')
  for (let i = 0; i < 4; i++) rect(px + (f > 0 ? 0 : 8), py + 4 + i * 2, 4, 2, RAINBOW[(i + (tGlobal * 10 | 0)) % 6])
  for (let i = 0; i < 3; i++) rect(px + (f > 0 ? 12 : -2), py + 8 + i * 2, 2, 2, RAINBOW[(i + 3 + (tGlobal * 10 | 0)) % 6])
  const legs = unicornLegs()
  for (let i = 0; i < 4; i++) {
    const L = legs[i]
    rect(px + L.x - 1, py + L.y, 4, 5, '#b8a4d8')
    rect(px + L.x, py + L.y, 2, 4, '#fff')
    if (i >= maxAmmo - ammo) hoof(px + L.x, py + L.y + 3)
  }
  if (p.firing > 0) {
    const L = legs[p.fireSlot] || legs[0]
    rect(px + L.x - 1, py + L.y + 4, 4, 5, RAINBOW[(tGlobal * 20 | 0) % 6])
  }
  if (emptyT > 0) txt('EMPTY', px + p.w / 2, py - 22, '#ff4d6d', 'center', 8)
}

function drawEnemy(e) {
  const px = e.x, py = e.y - cam.y
  const flashing = e.hurt > 0
  x.globalAlpha = 0.5
  rect(px - 1, py - 1, e.w + 2, e.h + 2, flashing ? '#fff' : pal().glow)
  x.globalAlpha = 1
  if (e.type === 0) {
    const sq = Math.sin(e.t * 8) * 0.6
    rect(px, py + sq, 12, 12 - sq, flashing ? '#fff' : '#2b1240')
    rect(px + 2, py + 3, 3, 3, flashing ? '#fff' : '#ff4d6d')
    rect(px + 7, py + 3, 3, 3, flashing ? '#fff' : '#ff4d6d')
  } else if (e.type === 1) {
    const b = Math.sin(e.t * 4)
    rect(px, py + b, 12, 8, flashing ? '#fff' : '#3a2160')
    rect(px + 2, py + 8 + b, 8, 3, flashing ? '#fff' : '#241041')
    rect(px + 2, py + 2 + b, 2, 3, '#68e8ff')
    rect(px + 8, py + 2 + b, 2, 3, '#68e8ff')
  } else {
    rect(px, py + 4, 14, 8, flashing ? '#fff' : '#4a1030')
    for (let i = 0; i < 5; i++) rect(px + i * 3, py, 2, 5, flashing ? '#fff' : '#ff4d6d')
    rect(px + 3, py + 7, 2, 2, '#ffe14d')
    rect(px + 9, py + 7, 2, 2, '#ffe14d')
  }
}

function drawHud() {
  for (let i = 0; i < maxHp; i++) {
    const hx = 4 + i * 7
    rect(hx, 4, 5, 5, i < hp ? '#ff4d6d' : 'rgba(74,53,96,.2)')
    if (i < hp) rect(hx + 1, 5, 2, 1, '#ff9ec4')
  }
  for (let i = 0; i < maxAmmo; i++) shoe(VW - 8 - (maxAmmo - i) * 8, 4, i < ammo)
  txt(deepest + 'm', VW / 2, 4, pal().ink, 'center', 7)
  if (combo > 1) txt('x' + combo, VW / 2, 14, RAINBOW[combo % 6], 'center', 10)
}

function draw() {
  x.setTransform(1, 0, 0, 1, 0, 0)
  x.fillStyle = pal().bg; x.fillRect(0, 0, W, H)
  const sh = shake > 0 ? (Math.random() - 0.5) * shake * 2 : 0
  x.setTransform(scale, 0, 0, scale, offX + sh * scale, offY + sh * scale)
  x.beginPath(); x.rect(0, 0, VW, VH); x.save(); x.clip()

  drawBack()
  drawWorld()
  for (const d of doodads) {
    const dy = d.y - cam.y + Math.sin(d.t * 4) * 0.6
    rect(d.x, dy + 2, 8, 8, '#ffe14d')
    rect(d.x + 1, dy, 6, 3, '#fff')
    rect(d.x + 3, dy + 4, 2, 2, '#ff9ec4')
  }
  for (const g of gems) {
    const gy = g.y - cam.y
    rect(g.x - 2, gy - 2, 4, 4, '#ffe14d')
    rect(g.x - 1, gy - 1, 2, 2, '#fff')
  }
  for (const e of enemies) if (e.y > cam.y - 20 && e.y < cam.y + VH + 20) drawEnemy(e)
  for (const b of bullets) {
    const by = b.y - cam.y
    shoe(b.x - 3, by - 2, 1)
    rect(b.x - 1, by + 4, 2, 2, '#ffe14d')
  }
  for (const q of parts) { x.globalAlpha = Math.max(0, q.life / q.max); rect(q.x, q.y - cam.y, 2, 2, q.col); x.globalAlpha = 1 }
  for (const b of booms) {
    const t = 1 - b.life / b.max, r = 8 + t * 26, py = b.y - cam.y
    x.globalAlpha = (1 - t) * 0.85
    rect(b.x - r, py - r, r * 2, 3, '#ffe14d')
    rect(b.x - r, py + r - 3, r * 2, 3, '#ff9f45')
    rect(b.x - r, py - r, 3, r * 2, '#ff4d6d')
    rect(b.x + r - 3, py - r, 3, r * 2, '#ff9f45')
    x.globalAlpha = (1 - t) * 0.45
    rect(b.x - r * 0.4, py - r * 0.4, r * 0.8, r * 0.8, '#fff')
    x.globalAlpha = 1
  }
  if (state !== 'dead') drawUnicorn()
  for (const t of texts) { x.globalAlpha = Math.min(1, t.life * 2); txt(t.s, t.x, t.y - cam.y, t.col, 'left', 7); x.globalAlpha = 1 }

  if (flash > 0) { x.globalAlpha = flash * 2; x.fillStyle = '#ff4d6d'; x.fillRect(0, 0, VW, VH); x.globalAlpha = 1 }
  if (state === 'play') drawHud()

  if (state === 'title') {
    x.fillStyle = 'rgba(255,248,252,.78)'; x.fillRect(0, 0, VW, VH)
    for (let i = 0; i < 6; i++) rect(20, 44 + i * 3, VW - 40, 3, RAINBOW[i])
    txt('RAINFALL', VW / 2, 58, pal().ink, 'center', 18)
    txt('a unicorn descends', VW / 2, 80, '#7a6498', 'center', 7)
    txt('MOVE  arrows / A D', VW / 2, 104, '#5a4878', 'center', 7)
    txt('JUMP  space  (hold in air', VW / 2, 116, '#5a4878', 'center', 7)
    txt('= gunboots)', VW / 2, 128, '#5a4878', 'center', 7)
    txt('stomp  ·  4 horseshoes', VW / 2, 148, '#7a6498', 'center', 7)
    txt('land to reload', VW / 2, 160, '#7a6498', 'center', 7)
    if (best) txt('BEST ' + best, VW / 2, 180, '#c48800', 'center', 8)
    txt('press any key / tap', VW / 2, VH - 30, RAINBOW[(tGlobal * 3 | 0) % 6], 'center', 8)
  }
  if (state === 'dead') {
    x.fillStyle = 'rgba(255,248,252,.82)'; x.fillRect(0, 0, VW, VH)
    txt('TUMBLED AWAY', VW / 2, 70, pal().ink, 'center', 12)
    txt('depth  ' + deepest + 'm', VW / 2, 100, pal().ink, 'center', 8)
    txt('dust  ' + dust, VW / 2, 114, '#c48800', 'center', 8)
    txt('combo  x' + comboBest, VW / 2, 128, '#ff6ad5', 'center', 8)
    txt('best  ' + best, VW / 2, 148, '#7a6498', 'center', 8)
    if (dieT > 0.8) txt('press any key / tap', VW / 2, VH - 30, RAINBOW[(tGlobal * 3 | 0) % 6], 'center', 8)
  }

  x.restore()
  x.setTransform(1, 0, 0, 1, 0, 0)
  x.fillStyle = pal().bg
  x.fillRect(0, 0, W, offY); x.fillRect(0, offY + VH * scale, W, H)
  x.fillRect(0, 0, offX, H); x.fillRect(offX + VW * scale, 0, W, H)
}

function onPress() {
  if (state === 'title') { reset(); return }
  if (state === 'dead' && dieT > 0.8) reset()
}

function update(dt) {
  tGlobal += dt
  if (state === 'play') {
    updatePlayer(dt)
    updateBullets(dt)
    updateEnemies(dt)
    const target = Math.max(0, p.y + p.h / 2 - VH * 0.33)
    const err = target - cam.y
    if (err > 0)
      cam.vy += (err * 48 - cam.vy * 8) * dt
    else
      cam.vy *= Math.exp(-dt * 8)
    if (cam.vy < 0) cam.vy = 0
    cam.y = Math.max(0, cam.y + cam.vy * dt)
    const r1 = Math.ceil((Math.max(cam.y, p.y) + VH * 2) / TW)
    for (let r = Math.floor(cam.y / TW); r <= r1; r++) getRow(r)
    const cut = Math.floor(cam.y / TW) - 80
    if (cut > 0 && rows.size > 220) for (const r of rows.keys()) if (r < cut) rows.delete(r)
  } else if (state === 'dead') dieT += dt
  updateStuff(dt)
}

let last = 0
requestAnimationFrame(function loop(now) {
  requestAnimationFrame(loop)
  const dt = Math.min((now - last) / 1000, 0.045)
  last = now
  update(dt)
  draw()
})

reset(); state = 'title'
</script>
